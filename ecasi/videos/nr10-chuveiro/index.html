<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Paleta do design system Grupo ECASI (tokens.css) */
      :root {
        --ground: #eef1f6;
        --ink: #0b1d3f;
        --accent: #f97316;
        --font-display: Poppins, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="90.33"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="world"
        class="clip"
        data-composition-id="world"
        data-composition-src="compositions/world.html"
        data-start="0"
        data-duration="90.33"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="hud"
        class="clip"
        data-composition-id="hud"
        data-composition-src="compositions/hud.html"
        data-start="0"
        data-duration="90.33"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="cta"
        class="clip"
        data-composition-id="cta"
        data-composition-src="compositions/cta.html"
        data-start="81.75"
        data-duration="3.75"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="captions"
        class="clip"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="90.33"
        data-track-index="4"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <audio
        id="vo"
        class="clip"
        src="assets/narracao-nr10-norm.mp3"
        data-start="0"
        data-duration="89.55"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <!-- Efeitos sonoros das entradas, pré-mixados e abaixados sob a voz (tools/build_sfx.py) -->
      <audio
        id="sfx"
        class="clip"
        src="assets/sfx-track.wav"
        data-start="0"
        data-duration="90.33"
        data-track-index="11"
        data-volume="1"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
