  <script>
    /*CUES*/
    const C = {
      "hook": 0.0,
      "disjuntor": 0.96,
      "chuveiro": 2.16,
      "encostar": 4.64,
      "nao": 5.6,
      "nr10": 6.48,
      "camadas": 8.24,
      "problema": 11.36,
      "v220": 13.36,
      "molhada": 16.16,
      "ma10": 18.08,
      "trava": 20.08,
      "ma50": 22.8,
      "coracao": 24,
      "c1": 25.6,
      "bloquear": 27.76,
      "desliga": 28.72,
      "circuito": 29.44,
      "cadeado": 30.96,
      "etiqueta": 31.68,
      "religa": 34.08,
      "c2": 36.16,
      "testar": 37.44,
      "detector": 39.44,
      "energia": 40.8,
      "mede": 42.16,
      "semTensao": 43.52,
      "agoraSim": 44.64,
      "c3": 45.76,
      "aterrar": 47.04,
      "aterramento": 49.04,
      "luva": 51.28,
      "ferramenta": 52.56,
      "atencao": 54.32,
      "taSeguro": 56.88,
      "nemSempre": 57.68,
      "rede": 58.96,
      "duasFases": 63.04,
      "polo": 65.43,
      "desligaUma": 66.47,
      "continua": 68.47,
      "v127": 69.35,
      "soDetector": 70.95,
      "norma": 73.11,
      "desenergizacao": 75.99,
      "treino": 77.35,
      "reciclagem": 79.43,
      "cta": 81.75,
      "fale": 83.27,
      "loop": 85.11,
      "confira": 86.47,
      "antes": 88.31,
      "end": 90.33
    };
    /*END-CUES*/

    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const ENTER = "expo.out";

    // Entrada da marca: 0,7 s, opacidade + 24 px. Saída 40% mais curta, com desfoque.
    function show(sel, a, b, opts = {}) {
      const el = $(sel);
      const dy = opts.dy ?? 24;
      tl.set(el, { visibility: "visible" }, 0);
      tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: opts.dur ?? 0.7, ease: ENTER }, a);
      if (b != null) {
        tl.to(el, { opacity: 0, y: -10, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
        tl.set(el, { visibility: "hidden" }, b);
      }
    }
    // Número de seção: escala com desfoque, depois palavra e subtítulo
    function section(sel, a, b) {
      const el = $(sel);
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, a);
      tl.fromTo(el.querySelector(".n"), { scale: 0.55, opacity: 0, filter: "blur(14px)", transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, a);
      tl.fromTo(el.querySelector(".t"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, a + 0.22);
      tl.fromTo(el.querySelector(".s"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, a + 0.36);
      tl.to(el, { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
      tl.set(el, { visibility: "hidden" }, b);
    }
    // Contador numérico (fonte monoespaçada, sem pular de largura)
    function count(sel, to, at, dur = 0.8) {
      const p = { v: 0 };
      tl.fromTo(p, { v: 0 }, { v: to, duration: dur, ease: "power2.out", onUpdate: () => ($(sel).textContent = String(Math.round(p.v))) }, at);
    }
    // Estados da barra: inativo, ativo, concluído
    const CHIP = {
      off: { backgroundColor: "#ffffff", borderColor: "#e5e7eb", color: "#6b7280" },
      on: { backgroundColor: "#c2410c", borderColor: "#c2410c", color: "#ffffff" },
      done: { backgroundColor: "#fff1e6", borderColor: "#fed7b5", color: "#c2410c" },
    };
    function chip(n, state, at) {
      tl.to("#hud-chip" + n, { ...CHIP[state], duration: 0.3, ease: "power2.inOut" }, at);
    }
    // Vinheta: sobe e desce
    function vignette(a, b, peak = 1) {
      tl.to("#hud-vig", { opacity: peak, duration: 0.5, ease: "power2.out" }, a);
      tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, b - 0.6);
    }

    // Abertura (o primeiro quadro já mostra o título, para o loop emendar)
    tl.set("#hud-hook", { opacity: 1 }, 0);
    tl.set("#hud-vig", { opacity: 0.7 }, 0);
    tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, C.nr10);
    tl.to("#hud-hook", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, C.nao - 0.12);
    tl.set("#hud-hook", { visibility: "hidden" }, C.nao + 0.1);
    tl.fromTo("#hud-nao", { opacity: 0, scale: 1.25, filter: "blur(12px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, C.nao);
    tl.to("#hud-nao", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, C.nr10 + 0.05);
    tl.set("#hud-nao", { visibility: "hidden" }, C.nr10 + 0.25);
    show("#hud-nr", C.nr10 + 0.24, C.camadas);

    // Barra 1-2-3: entra em "três camadas"
    [1, 2, 3].forEach((n, i) => {
      tl.fromTo("#hud-chip" + n, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER }, C.camadas + i * 0.12);
    });
    chip(1, "on", C.c1);
    chip(1, "done", C.c2);
    chip(2, "on", C.c2);
    chip(2, "done", C.c3);
    chip(3, "on", C.c3);
    chip(3, "done", C.atencao);
    // Some durante a chamada final e volta para o fecho
    tl.to("#hud-chips", { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, C.cta - 0.1);
    tl.fromTo("#hud-chips", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER, immediateRender: false }, C.loop + 0.1);
    chip(1, "on", C.confira + 0.56);
    chip(2, "on", C.confira + 0.72);
    chip(3, "on", C.confira + 0.96);

    // Problema
    show("#hud-c220", C.v220 - 0.1, C.molhada + 0.6);
    count("#hud-v220", 220, C.v220);
    show("#hud-c10", C.ma10 + 0.1, C.ma50);
    show("#hud-c50", C.ma50 + 0.1, C.c1);
    vignette(C.coracao, C.c1 + 0.2, 0.8);

    // Camadas
    section("#hud-s1", C.c1, C.circuito + 0.3);
    show("#hud-q1", C.religa - 0.2, C.c2);
    section("#hud-s2", C.c2, C.detector);
    show("#hud-q2", C.energia + 0.5, C.mede + 0.6);
    show("#hud-c0v", C.semTensao + 0.1, C.c3);
    section("#hud-s3", C.c3, C.aterramento + 0.2);

    // Atenção
    show("#hud-alert", C.atencao, C.norma, { dur: 0.45 });
    show("#hud-c2f", C.rede + 0.3, C.polo);
    show("#hud-c1p", C.polo, C.v127 - 0.3);
    show("#hud-c127", C.v127 - 0.25, C.soDetector);
    count("#hud-v127", 127, C.v127);
    show("#hud-q3", C.soDetector, C.norma);
    vignette(C.continua, C.soDetector + 0.6, 0.8);

    // Norma
    show("#hud-norma-head", C.norma + 0.8, C.cta);
    show("#hud-k1", C.desenergizacao - 0.3, C.cta);
    show("#hud-k2", C.treino, C.cta);
    tl.fromTo("#hud-k2sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: ENTER }, C.reciclagem);

    // Fecho: a vinheta volta aos poucos para emendar com o primeiro quadro
    tl.set("#hud-end", { opacity: 1, visibility: "visible" }, C.confira - 0.05);
    tl.fromTo("#hud-end1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.confira);
    tl.fromTo("#hud-end2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.confira + 0.72);
    tl.fromTo("#hud-end3", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.antes);
    tl.to("#hud-vig", { opacity: 0.7, duration: 1.2, ease: "power1.inOut" }, C.end - 1.4);

    window.__timelines["hud"] = tl;
  </script>
