    // ---------- Materiais (paleta ECASI) ----------
    const mat = (color, extra = {}) =>
      new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, metalness: 0, ...extra });
    function tileTex(base, line, repX, repY) {
      const cv = document.createElement("canvas");
      cv.width = cv.height = 256;
      const g = cv.getContext("2d");
      g.fillStyle = base;
      g.fillRect(0, 0, 256, 256);
      g.strokeStyle = line;
      g.lineWidth = 4;
      for (let i = 0; i <= 2; i++) {
        const p = i * 128;
        g.beginPath();
        g.moveTo(p, 0);
        g.lineTo(p, 256);
        g.moveTo(0, p);
        g.lineTo(256, p);
        g.stroke();
      }
      const tx = new THREE.CanvasTexture(cv);
      tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
      tx.repeat.set(repX, repY);
      tx.colorSpace = THREE.SRGBColorSpace;
      return tx;
    }
    function hazardTex() {
      const cv = document.createElement("canvas");
      cv.width = 256;
      cv.height = 128;
      const g = cv.getContext("2d");
      g.fillStyle = "#facc15";
      g.fillRect(0, 0, 256, 128);
      g.fillStyle = "#1f2937";
      for (let x = -128; x < 256; x += 48) {
        g.beginPath();
        g.moveTo(x, 128);
        g.lineTo(x + 24, 128);
        g.lineTo(x + 152, 0);
        g.lineTo(x + 128, 0);
        g.fill();
      }
      const tx = new THREE.CanvasTexture(cv);
      tx.colorSpace = THREE.SRGBColorSpace;
      return tx;
    }
    // Etiqueta/face de componente com texto (canvas, determinístico)
    function textTex(lines, { bg = "#ffffff", fg = "#0b1d3f", w = 128, h = 128, size = 44, mono = true } = {}) {
      const cv = document.createElement("canvas");
      cv.width = w;
      cv.height = h;
      const g = cv.getContext("2d");
      g.fillStyle = bg;
      g.fillRect(0, 0, w, h);
      g.fillStyle = fg;
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.font = `700 ${size}px ${mono ? '"JetBrains Mono", monospace' : "Poppins, sans-serif"}`;
      lines.forEach((ln, i) => g.fillText(ln, w / 2, h / 2 + (i - (lines.length - 1) / 2) * size * 1.1));
      const tx = new THREE.CanvasTexture(cv);
      tx.colorSpace = THREE.SRGBColorSpace;
      tx.anisotropy = 4;
      return tx;
    }
    const M = {
      wall: mat("#e9ecef"),
      wallLow: mat("#cdd3db"),
      floor: mat("#ffffff", { map: tileTex("#d5d8dc", "#c3c7cc", 8, 8) }),

      steelLight: mat("#c9ced6", { roughness: 0.6 }),
      cabinet: mat("#d6dae0", { roughness: 0.6 }),
      plate: mat("#eef0f2"),
      duct: mat("#9ca3af"),
      navy: mat("#0b1d3f"),
      navyLight: mat("#142b52"),
      orange: mat("#f97316"),
      white: mat("#f8f8f6"),
      skin: mat("#d9a074"),
      glove: mat("#1f2937", { roughness: 0.5 }),
      boot: mat("#2a2f38"),
      reflect: mat("#dfe3e8", { roughness: 0.35, emissive: "#ffffff", emissiveIntensity: 0.12 }),
      red: mat("#d32f2f"),
      green: mat("#3bb273"),
      yellow: mat("#facc15"),
      dark: mat("#1f2937"),
      blue: mat("#2563eb"),
      belt: mat("#4a3426"),
      motor: mat("#3b6ea8", { roughness: 0.6 }),
      pump: mat("#6b7280", { roughness: 0.6 }),
      paper: mat("#ffffff"),
      board: mat("#8b5a2b"),
    };

    const box = (w, h, d, m) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    };
    const cyl = (r, h, m, seg = 10) => {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), m);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    };
    const plane = (w, h, tex) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
    function wirePath(pts) {
      const path = new THREE.CurvePath();
      for (let i = 0; i < pts.length - 1; i++) path.add(new THREE.LineCurve3(new THREE.Vector3(...pts[i]), new THREE.Vector3(...pts[i + 1])));
      return path;
    }
    const tube = (pts, r, m, seg = 120) => {
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(wirePath(pts), seg, r, 6, false), m);
      mesh.castShadow = true;
      return mesh;
    };

    // ---------- Cenário: cabine primária de 13,8 kV ----------
    const MX = {
      copper: mat("#c2703d", { roughness: 0.45 }),
      porcelain: mat("#8b5e3c", { roughness: 0.4 }),
      tank: mat("#9aa5b4", { roughness: 0.6 }),
      gen: mat("#15803d", { roughness: 0.6 }),
      cone: mat("#f97316"),
      gcable: mat("#84cc16", { roughness: 0.5 }),
      clamp: mat("#facc15"),
      pole: mat("#f59e0b", { roughness: 0.5 }),
      glove: mat("#eab308", { roughness: 0.5 }),
    };
    const WALL_Z = -1.6;
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), M.floor);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const wall = box(10, 4.0, 0.2, M.wall);
    wall.position.set(0, 2.0, WALL_Z - 0.1);
    const wallLow = box(10, 1.0, 0.02, M.wallLow);
    wallLow.position.set(0, 0.5, WALL_Z + 0.005);
    scene.add(wall, wallLow);
    const tag = (txt, w, h, size, opts = {}) => plane(w, h, textTex(txt, { w: Math.round(w * 1000), h: Math.round(h * 1000), size, ...opts }));
    // Placa de perigo na parede
    const danger = tag(["⚡ PERIGO", "13.800 V"], 0.34, 0.2, 52, { bg: "#facc15", mono: false });
    danger.position.set(-0.25, 1.55, WALL_Z + 0.012);
    scene.add(danger);

    // Fases (em profundidade) e alturas
    const PHZ = [WALL_Z + 0.38, WALL_Z + 0.55, WALL_Z + 0.72];
    const SEC_X = -1.05;
    const BUS_Y = 2.3;
    const UP_Y = 2.88;
    const TR_X = 0.75;

    // Chave seccionadora tripolar: contatos de baixo (carga) e de cima (entrada, energizada pela concessionária)
    const beamLow = box(0.08, 0.08, 0.9, M.steel);
    beamLow.position.set(SEC_X, 2.12, WALL_Z + 0.45);
    const beamUp = box(0.08, 0.08, 0.9, M.steel);
    beamUp.position.set(SEC_X, 3.12, WALL_Z + 0.45);
    scene.add(beamLow, beamUp);
    const blades = [];
    const upContacts = [];
    for (const z of PHZ) {
      const insLow = cyl(0.035, 0.12, MX.porcelain, 8);
      insLow.position.set(SEC_X, 2.22, z);
      const cLow = box(0.08, 0.04, 0.06, MX.copper);
      cLow.position.set(SEC_X, BUS_Y, z);
      const insUp = cyl(0.035, 0.14, MX.porcelain, 8);
      insUp.position.set(SEC_X, 3.01, z);
      const cUp = box(0.08, 0.05, 0.06, MX.copper);
      cUp.position.set(SEC_X, UP_Y + 0.05, z);
      scene.add(insLow, cLow, insUp, cUp);
      upContacts.push(cUp);
      const pivot = new THREE.Group();
      pivot.position.set(SEC_X, BUS_Y, z);
      const blade = box(0.03, 0.6, 0.045, M.steelLight);
      blade.position.y = 0.3;
      pivot.add(blade);
      scene.add(pivot);
      blades.push(pivot);
      // Cabo de entrada da concessionária com mufla
      const cab = cyl(0.025, 0.55, M.dark, 8);
      cab.position.set(SEC_X - 0.12, 3.45, z);
      const mufla = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.14, 8), MX.porcelain);
      mufla.position.set(SEC_X - 0.12, 3.12, z);
      mufla.rotation.x = Math.PI;
      const lead = box(0.12, 0.02, 0.02, MX.copper);
      lead.position.set(SEC_X - 0.06, UP_Y + 0.12, z);
      const leadV = box(0.02, 0.1, 0.02, MX.copper);
      leadV.position.set(SEC_X - 0.12, UP_Y + 0.12 + 0.05, z);
      scene.add(cab, mufla, lead, leadV);
    }
    const secLab = tag(["SECCIONADORA"], 0.3, 0.05, 30);
    secLab.position.set(SEC_X, 1.98, WALL_Z + 0.012);
    scene.add(secLab);
    // Manopla na parede e haste até o eixo da chave
    const MAN = new THREE.Vector3(-1.9, 1.15, WALL_Z + 0.1);
    const manPlate = box(0.16, 0.3, 0.04, M.steelLight);
    manPlate.position.copy(MAN);
    scene.add(manPlate);
    const manLever = new THREE.Group();
    manLever.position.set(MAN.x, MAN.y, MAN.z + 0.05);
    const lev = box(0.04, 0.26, 0.04, M.red);
    lev.position.y = 0.12;
    manLever.add(lev);
    scene.add(manLever);
    const manLab = tag(["I", "O"], 0.05, 0.12, 22);
    manLab.position.set(MAN.x + 0.12, MAN.y, MAN.z + 0.025);
    scene.add(manLab);
    scene.add(tube([[MAN.x, MAN.y + 0.15, MAN.z], [MAN.x, 2.12, MAN.z], [SEC_X, 2.12, MAN.z], [SEC_X, 2.12, WALL_Z + 0.3]], 0.015, M.steel, 60));
    const MAN_LOCK = new THREE.Vector3(MAN.x, MAN.y - 0.1, MAN.z + 0.09);

    // Barramento interno (lado da carga) até o transformador
    const bus = [];
    for (const z of PHZ) {
      const b = box(TR_X - SEC_X, 0.03, 0.03, MX.copper);
      b.position.set((SEC_X + TR_X) / 2, BUS_Y, z);

      drop.position.set(TR_X, (BUS_Y + 1.36) / 2, z);
      scene.add(b, drop);
      bus.push(b);
    }
    for (const x of [-0.3, 0.35]) {
      const beam = box(0.06, 0.06, 0.9, M.steel);
      beam.position.set(x, 2.12, WALL_Z + 0.45);
      scene.add(beam);
      for (const z of PHZ) {

        scene.add(ins);

    // Transformador 13.800/380 V
    const TR = new THREE.Vector3(TR_X, 0.62, WALL_Z + 0.55);

    const tank = box(0.8, 1.0, 0.56, trMat);
    tank.position.copy(TR);
    scene.add(tank);

    for (let i = 0; i < 4; i++) {

    scene.add(trLab);

    // Quadro de baixa tensão (QGBT) e gerador de emergência
    const QG = new THREE.Vector3(1.8, 1.0, WALL_Z + 0.25);
    const qg = box(0.55, 1.6, 0.4, M.cabinet);
    qg.position.copy(QG);
    const qgLab = tag(["QGBT", "380 V"], 0.2, 0.1, 30);
    qgLab.position.set(QG.x, QG.y + 0.45, QG.z + 0.201);
    scene.add(qg, qgLab);
    const lvPath = wirePath([[TR.x + 0.53, 0.85, TR.z], [1.42, 0.85, TR.z], [1.42, 0.85, QG.z + 0.1], [QG.x - 0.28, 0.85, QG.z + 0.1]]);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(lvPath, 60, 0.03, 6, false), M.dark));
    const GEN = new THREE.Vector3(2.45, 0.45, -0.55);
    const genGroup = new THREE.Group();
    genGroup.position.copy(GEN);
    const genBody = box(0.8, 0.8, 1.2, MX.gen);
    const genTop = box(0.6, 0.06, 0.9, M.dark);
    genTop.position.y = 0.43;
    const exhaust = cyl(0.04, 0.35, M.steel, 8);
    exhaust.position.set(0.2, 0.62, -0.35);
    const genPanel = box(0.36, 0.26, 0.03, M.dark);
    genPanel.position.set(-0.1, 0.15, 0.61);
    const genLab = tag(["GERADOR"], 0.3, 0.07, 34, { bg: "#ffffff" });
    genLab.position.set(-0.1, 0.32, 0.602);
    genGroup.add(genBody, genTop, exhaust, genPanel, genLab);
    scene.add(genGroup);
    const GEN_LOCK = new THREE.Vector3(GEN.x - 0.1, GEN.y + 0.08, GEN.z + 0.66);
    const genPath = wirePath([[GEN.x - 0.4, 0.06, GEN.z - 0.3], [QG.x, 0.06, GEN.z - 0.3], [QG.x, 0.06, QG.z + 0.22], [QG.x, 0.25, QG.z + 0.22]]);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(genPath, 60, 0.03, 6, false), M.dark));
    const smoke = [];
    for (let k = 0; k < 8; k++) {
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 0), new THREE.MeshBasicMaterial({ color: "#6b7280", transparent: true, depthWrite: false }));
      m.userData = { off: k / 8 };
      scene.add(m);
      smoke.push(m);
    }

    // Barra de terra na parede
    const GBAR_Y = 0.22;
    const gbar = box(2.6, 0.04, 0.04, M.green);
    gbar.position.set(-0.2, GBAR_Y, WALL_Z + 0.03);
    scene.add(gbar);

    // Aterramento temporário: grampos nos dois lados do ponto de trabalho, com cabos até a barra de terra
    function groundSet(points) {
      return points.map((p, k) => {
        const g = new THREE.Group();
        const cl = box(0.06, 0.07, 0.06, MX.clamp);
        cl.position.copy(p);
        const end = new THREE.Vector3(p.x + 0.04 * (k - 1), GBAR_Y + 0.03, WALL_Z + 0.06);
        const mid = new THREE.Vector3(p.x + 0.02 * (k - 1), (p.y + GBAR_Y) / 2, (p.z + WALL_Z) / 2 + 0.25);
        const cab = new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(p.clone(), mid, end), 30, 0.01, 6, false), MX.gcable);
        g.add(cl, cab);
        g.userData.path = new THREE.QuadraticBezierCurve3(p.clone(), mid, end);
        scene.add(g);
        return g;
      });
    }

    const easeOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));

    const spring = (x) => (x <= 0 ? 0 : 1 - Math.exp(-6 * x) * Math.cos(9 * x));

      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 0; i < keys.length - 1; i++) {
        const [ta, va] = keys[i];
        const [tb, vb] = keys[i + 1];
        if (t <= tb) return tb === ta ? vb : lerp(va, vb, easeInOut((t - ta) / (tb - ta)));
      }
      return keys[keys.length - 1][1];
    }
    // Posição por quadros-chave com pontos 3D
    function track3(t, keys) {

        const [tb, vb] = keys[i + 1];

        { id: "co-secc", a: C.chave + 0.6, b: C.camadas, at: () => worldOf(blades[2], 0, 0.45, 0), dx: 130, dy: 60, top: 640 },
        { id: "co-live", a: C.aberta + 0.6, b: C.problema, at: () => [SEC_X - 0.12, UP_Y + 0.25, PHZ[2]], dx: 120, dy: -60, top: 640 },
        { id: "co-arc", a: C.arco, b: C.zonas, at: () => ARC_P.toArray(), dx: 140, dy: 120, top: 640 },
        { id: "co-zr", a: C.r38 - 0.1, b: C.c1, at: () => [ZC.x + 0.27, ZC.y - 0.27, ZC.z + 0.1], dx: 140, dy: 40, top: 760 },
        { id: "co-zc", a: C.r138 - 0.1, b: C.c1, at: () => [ZC.x + 0.98, ZC.y - 0.98, ZC.z + 0.2], dx: 120, dy: 90, top: 860 },
        { id: "co-team", a: C.duas + 0.3, b: C.c2, at: () => worldOf(col.userData.hips, 0, 1.05, 0), dx: 100, dy: -50, top: 960 },
        { id: "co-lock", a: C.seccionadora2 + 0.4, b: C.gerador + 0.3, at: () => MAN_LOCK.toArray(), dx: 130, dy: 90, top: 960 },
        { id: "co-glock", a: C.gerador + 0.7, b: C.detector, at: () => GEN_LOCK.toArray(), dx: -110, dy: -120, top: 960 },
        { id: "co-test", a: C.testado + 0.35, b: C.usar + 0.2, at: () => head.position.toArray(), dx: 120, dy: -70, top: 960 },
        { id: "co-dead", a: C.usar + 0.4, b: C.aterramento, at: () => head.position.toArray(), dx: 120, dy: -70, top: 960 },
        { id: "co-g1", a: C.aterramento + 1.0, b: C.sinal, at: () => G1P[2].toArray(), dx: -60, dy: -140, top: 960 },
        { id: "co-g2", a: C.dois + 1.0, b: C.sinal, at: () => G2P[2].toArray(), dx: 110, dy: 90, top: 960 },
        { id: "co-zone", a: C.sinal + 0.4, b: C.mito, at: () => cones[2].position.toArray().map((v, i) => (i === 1 ? 0.4 : v)), dx: 120, dy: -80, top: 960 },
        { id: "co-back", a: C.voltar, b: C.terra, at: () => [TR.x + 0.4, 0.88, TR.z], dx: 120, dy: 150, top: 960 },
        { id: "co-earth", a: C.terra + 0.3, b: C.norma, at: () => G2P[2].toArray(), dx: 120, dy: 160, top: 960 },
        { id: "co-safe", a: C.lados2 - 0.3, b: C.norma + 1.0, at: () => [-0.3, BUS_Y, PHZ[2]], dx: -60, dy: -150, top: 960 },
        { id: "co-epi", a: C.complementar, b: C.cta, at: () => worldOf(elet.userData.hips, 0, 0.9, 0.2), dx: -120, dy: 160, top: 1000 },
        { id: "co-elet", ...CTA_BOX, a: C.treinamento + 0.6, b: C.loop, at: () => worldOf(elet.userData.hips, 0, 1.05, 0), dx: 110, dy: -60 },
      ];
      for (const c of CALLOUTS) {
        c.el = document.getElementById(c.id);
        c.bw = c.el.offsetWidth;
        c.bh = c.el.offsetHeight;
        c.line = document.createElementNS(SVGNS, "line");
        c.line.setAttribute("stroke", "#0b1d3f");
        c.line.setAttribute("stroke-width", "3");
        c.dot = document.createElementNS(SVGNS, "circle");
        c.dot.setAttribute("r", "8");
        c.dot.setAttribute("fill", "#f97316");
        c.dot.setAttribute("stroke", "#ffffff");
        c.dot.setAttribute("stroke-width", "3");
        svg.append(c.line, c.dot);
      }
      const proj = new THREE.Vector3();
      function placeCallouts(t) {
        for (const c of CALLOUTS) {
          const fadeIn = prog(t, c.a, c.a + 0.25);
          const fadeOut = 1 - prog(t, c.b - 0.2, c.b);
          const o = Math.min(fadeIn, fadeOut);
          if (o <= 0.001) {
            c.el.style.opacity = "0";
            c.line.setAttribute("opacity", "0");
            c.dot.setAttribute("opacity", "0");
            continue;
          }
          proj.fromArray(c.at()).project(camera);
          const px = (proj.x * 0.5 + 0.5) * W;
          const py = (-proj.y * 0.5 + 0.5) * H;
          let bx = px + c.dx - (c.dx < 0 ? c.bw : 0);
          let by = py + c.dy - c.bh / 2;
          bx = Math.min(W - 54 - c.bw, Math.max(54, bx));
          by = Math.min((c.bottom ?? 1160) - c.bh, Math.max(c.top ?? 330, by));
          const lift = 14 * (1 - easeOutExpo(fadeIn));
          c.el.style.opacity = String(o);
          c.el.style.transform = `translate(${bx}px, ${by + lift}px)`;
          const lx = bx + (c.dx < 0 ? c.bw : 0);
          const ly = by + c.bh / 2;
          const grow = easeOut(fadeIn);
          c.line.setAttribute("x1", String(px));
          c.line.setAttribute("y1", String(py));
          c.line.setAttribute("x2", String(lerp(px, lx, grow)));
          c.line.setAttribute("y2", String(lerp(py, ly, grow)));
          c.line.setAttribute("opacity", String(o));
          c.dot.setAttribute("cx", String(px));
          c.dot.setAttribute("cy", String(py));
          c.dot.setAttribute("opacity", String(o));
        }
      }

      // ---------- Estados ao longo do tempo ----------
      // Seccionadora: aberta no gancho, fechada de novo na chamada final (depois de tirar aterramentos e cadeados)
      const SEC = [[0, 1], [0.55, 1], [0.95, 0], [C.proximo + 0.8, 0], [C.proximo + 1.2, 1]];
      // Gerador: no mito, "e se ligar?" (replay ilustrativo, sem o cadeado)
      const genOn = (t) => t >= C.gerador2 - 0.1 && t < C.norma;
      // Grampos de aterramento: um por vez com o bastão; saem na chamada final
      const G1T = [0, 1, 2].map((k) => C.aterramento + 0.3 + k * 0.35);
      const G2T = [0, 1, 2].map((k) => C.dois + 0.1 + k * 0.35);
      const G_OFF = C.cta + 0.5;
      // Alvo do bastão: fonte de teste, as três fases e os pontos de aterramento
      const IDLE = [-0.15, 2.75, -0.55];
      const DETP = PHZ.map((z) => [-0.45, BUS_Y + 0.02, z]);
      const STICK = [
        [C.bastao - 0.6, IDLE], [C.testado - 0.15, TS.toArray().map((v, i) => (i === 1 ? v + 0.06 : v))], [C.testado + 0.5, TS.toArray().map((v, i) => (i === 1 ? v + 0.06 : v))],
        [C.usar + 0.05, DETP[0]], [C.usar + 0.35, DETP[0]], [C.usar + 0.6, DETP[1]], [C.usar + 0.9, DETP[1]], [C.usar + 1.15, DETP[2]], [C.usar + 1.45, DETP[2]],
        [C.aterramento - 0.3, IDLE],
        ...G1T.flatMap((tt, k) => [[tt - 0.1, G1P[k].toArray()], [tt + 0.1, G1P[k].toArray()]]),
        ...G2T.flatMap((tt, k) => [[tt - 0.1, G2P[k].toArray()], [tt + 0.1, G2P[k].toArray()]]),
        [C.sinal - 0.4, IDLE],
      ];
      const stickOn = (t) => t >= C.bastao - 0.6 && t < C.chao + 0.4;
      const stickK = (t) => track(t, [[C.bastao - 0.7, 0], [C.bastao - 0.3, 1], [C.chao, 1], [C.chao + 0.4, 0]]);

      // ---------- Render de um quadro a partir de t ----------
      const tmp = new THREE.Vector3();
      const vH = new THREE.Vector3();
      return function render(t) {
        const cam = cameraAt(t);
        camera.position.fromArray(cam.p);
        camera.lookAt(cam.q[0], cam.q[1], cam.q[2]);
        camera.updateMatrixWorld(true);

        // Seccionadora e manopla
        const sec = track(t, SEC);
        blades.forEach((b) => (b.rotation.z = lerp(1.15, 0, sec)));
        manLever.rotation.z = lerp(Math.PI * 0.8, 0, sec);
        const busLive = sec > 0.5;

        // Energia: entrada sempre energizada (concessionária); barramento só com a chave fechada
        inPulses.forEach((arr, ph) => arr.forEach((p, k) => {
          inPaths[ph].getPointAt((k / arr.length + t * 0.35) % 1, tmp);
          p.position.copy(tmp);
          p.position.x += 0.03;
        }));
        busPulses.forEach((arr, ph) => arr.forEach((p, k) => {
          p.visible = busLive;
          if (busLive) {
            busPaths[ph].getPointAt((k / arr.length + t * 0.25) % 1, tmp);
            p.position.copy(tmp);
            p.position.z += 0.025;
          }
        }));

        // Zonas da NR-10 (problema)
        const zk = Math.min(prog(t, C.zonas - 0.3, C.zonas + 0.3), 1 - prog(t, C.c1, C.c1 + 0.5));
        zrMat.opacity = 0.32 * Math.min(zk, prog(t, C.r38 - 0.4, C.r38 + 0.1) + 0.15 * zk);
        zcMat.opacity = 0.4 * Math.min(zk, prog(t, C.r138 - 0.4, C.r138 + 0.1) + 0.15 * zk);
        zr.visible = zrMat.opacity > 0.005;
        zcS.visible = zcMat.opacity > 0.005;
        zr.scale.setScalar(0.92 + 0.08 * Math.sin(t * 4));

        // Ferramenta que se aproxima e arco sem contato
        const toolOn = t >= C.nem && t < C.arco + 0.7;
        tool.visible = toolOn;
        if (toolOn) {
          const a = [-0.35, 2.45, -0.25];
          const b = [SEC_X + 0.24, UP_Y + 0.04, PHZ[2] + 0.12];
          const p = t < C.arco - 0.1 ? lerp3(a, b, easeInOut(prog(t, C.chegar - 0.6, C.arco - 0.15))) : b;
          const fall = t > C.arco ? Math.pow(t - C.arco, 2) * 4 : 0;
          tool.position.set(p[0] + 0.1 * prog(t, C.arco, C.arco + 0.5), p[1] - fall, p[2] + 0.15 * prog(t, C.arco, C.arco + 0.5));
          tool.lookAt(ARC_P);
        }
        const ak = t >= C.arco - 0.1 ? Math.exp(-(t - (C.arco - 0.1)) * 5) : 0;
        arcBall.visible = ak > 0.02;
        arcBall.position.copy(ARC_P).add(new THREE.Vector3(0.12, 0, 0.06));
        arcBall.scale.setScalar(0.5 + 1.4 * (1 - ak));
        arcMat.opacity = ak;
        arcLight.position.copy(arcBall.position);
        arcLight.intensity = 16 * ak;
        if (bolt) {
          scene.remove(bolt);
          bolt.geometry.dispose();
          bolt = null;
        }
        if (t >= C.arco - 0.1 && t < C.arco + 0.35) {
          const from = ARC_P.clone();
          const to = new THREE.Vector3(SEC_X + 0.24, UP_Y + 0.04, PHZ[2] + 0.12);
          const seed = Math.floor(t * 20);
          for (let i = 0; i <= 6; i++) {
            const f = i / 6;
            const j = i === 0 || i === 6 ? 0 : 0.035 * Math.sin(seed * 12.9898 + i * 78.233);
            boltPts[i].set(lerp(from.x, to.x, f) + j, lerp(from.y, to.y, f) + j * 1.4, lerp(from.z, to.z, f) - j);
          }
          bolt = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(boltPts), 24, 0.008, 5, false), boltMat);
          scene.add(bolt);
        }

        // Cadeados
        lockS.visible = t >= C.seccionadora2 + 0.35 && t < C.ecasi + 0.6;
        lockS.scale.setScalar(Math.max(0.01, spring(prog(t, C.seccionadora2 + 0.35, C.seccionadora2 + 0.95))));
        lockG.visible = t >= C.gerador + 0.45 && t < C.cta + 0.9 && !(t >= C.mito && t < C.norma);
        lockG.scale.setScalar(Math.max(0.01, spring(prog(t, C.gerador + 0.45, C.gerador + 1.05))));

        // Aterramento temporário
        [[G1, G1T], [G2, G2T]].forEach(([set, times]) => set.forEach((g, k) => {
          const s = spring(prog(t, times[k], times[k] + 0.5)) * (1 - prog(t, G_OFF + k * 0.1, G_OFF + 0.4 + k * 0.1));
          g.visible = s > 0.01;
          g.scale.setScalar(1);
          g.children[0].scale.setScalar(Math.max(0.01, s));
          g.children[1].visible = s > 0.6;
        }));

        // Zona sinalizada
        const zs = (k) => spring(prog(t, C.sinal + k * 0.12, C.sinal + 0.5 + k * 0.12)) * (1 - prog(t, G_OFF, G_OFF + 0.4));
        cones.forEach((c, k) => {
          const s = zs(k);
          c.visible = s > 0.01;
          c.scale.setScalar(Math.max(0.01, s));
        });
        tapes.forEach((tp, k) => (tp.visible = zs(k + 1) > 0.9));

        // Gerador (mito): vibra, solta fumaça e manda energia de volta pelo transformador
        const gon = genOn(t);
        genGroup.position.set(GEN.x + (gon ? 0.006 * Math.sin(t * 90) : 0), GEN.y, GEN.z);
        smoke.forEach((m) => {
          m.visible = gon;
          if (gon) {
            const f = (m.userData.off + t * 0.7) % 1;
            m.position.set(GEN.x + 0.2 + 0.05 * f, GEN.y + 0.8 + f * 0.6, GEN.z - 0.35);
            m.scale.setScalar(0.6 + f * 1.6);
            m.material.opacity = 0.6 * (1 - f);
          }
        });
        const backOn = t >= C.ligar && t < C.norma;
        backA.forEach((p, k) => {
          p.visible = backOn;
          if (backOn) {
            backPath.getPointAt((k / backA.length + t * 0.3) % 1, tmp);
            p.position.copy(tmp);
          }
        });
        const hvOn = t >= C.saem - 0.3 && t < C.norma;
        backHV.forEach((arr, ph) => arr.forEach((p, k) => {
          p.visible = hvOn;
          if (hvOn) {
            hvPaths[ph].getPointAt((k / arr.length + t * 0.6) % 1, tmp);
            p.position.copy(tmp);
            p.position.x += 0.03;
          }
        }));
        const earthOn = t >= C.terra - 0.3 && t < C.norma;
        earthPulses.forEach((arr, ph) => arr.forEach((p, k) => {
          p.visible = earthOn;
          if (earthOn) {
            G2[ph].userData.path.getPointAt((k / arr.length + t * 0.5) % 1, tmp);
            p.position.copy(tmp);
          }
        }));
        trMat.emissiveIntensity = (busLive ? 0.08 : 0) + (hvOn ? 0.35 + 0.2 * Math.sin(t * 8) : 0);

        // ---------- Eletricista ECASI ----------
        const ep = posAt(t);
        const ep2 = posAt(t - 0.05);
        const moving = Math.hypot(ep[0] - ep2[0], ep[2] - ep2[2]);
        const walk = Math.min(1, moving / 0.03);
        const LEV = worldOf(lev, 0, 0.1, 0.03);
        const targetYaw = (() => {
          if (t < C.pode + 0.2) return yawTo(ep, LEV);
          if (t < C.chave) return lerp(yawTo(ep, LEV), yawCam, prog(t, C.pode + 0.2, C.pode + 0.8));
          if (t < C.c1) return yawTo(ep, [SEC_X, 0, PHZ[1]]);
          if (t < C.c2) return 0.7;
          if (t < C.seccionadora2 + 0.7) return yawTo(ep, LEV);
          if (t < C.cta + 0.3) return yawTo(ep, [-0.3, 0, PHZ[1]]);
          return yawTo(ep, LEV);
        })();
        const headingYaw = moving > 0.004 ? Math.atan2(ep[0] - ep2[0], ep[2] - ep2[2]) : targetYaw;
        elet.position.fromArray(ep);
        elet.rotation.y = lerp(targetYaw, headingYaw, walk * 0.85);
        const ph = Math.sin(t * 9) * walk;
        elet.userData.legs[0].rotation.x = 0.4 * ph;
        elet.userData.legs[1].rotation.x = -0.4 * ph;
        elet.userData.hips.position.y = 0.9 + 0.02 * Math.abs(ph);

        // Braço A: manopla (gancho e fim), cadeado, prancheta; com o bastão, as duas mãos seguram
        const actsA = [
          [track(t, [[0, 1], [0.95, 1], [1.4, 0], [C.end - 1.0, 0], [C.end - 0.4, 1]]), LEV],
          [track(t, [[C.seccionadora2 - 0.3, 0], [C.seccionadora2 + 0.2, 1], [C.seccionadora2 + 0.6, 1], [C.seccionadora2 + 0.9, 0]]), MAN_LOCK.toArray()],
          [track(t, [[C.ecasi + 0.05, 0], [C.ecasi + 0.35, 1], [C.ecasi + 0.75, 1], [C.ecasi + 1.05, 0]]), MAN_LOCK.toArray()],
          [track(t, [[C.proximo + 0.3, 0], [C.proximo + 0.6, 1], [C.proximo + 1.3, 1], [C.proximo + 1.6, 0]]), LEV],
        ];
        const clipK = track(t, [[C.c1 - 0.2, 0], [C.c1 + 0.4, 1], [C.c2 - 0.5, 1], [C.c2 + 0.1, 0]]);
        clip.visible = clipK > 0.05;
        clip.scale.setScalar(Math.max(0.01, clipK));
        const sk = stickK(t);
        const sOn = stickOn(t);
        pole.visible = head.visible = sOn && sk > 0.05;
        const ST = track3(t, STICK);
        const actA = actsA.find(([k]) => k > 0.001);
        if (actA) aimArm(elet, armA, actA[1], actA[0]);
        else if (clipK > 0.001) armA.quaternion.setFromEuler(new THREE.Euler(-1.25 * clipK, 0, 0.35 * clipK));
        else if (sk > 0.001) aimArm(elet, armA, ST, sk * 0.85);
        else armA.quaternion.identity();
        if (sk > 0.001) aimArm(elet, armB, ST, sk);
        else armB.quaternion.identity();
        if (pole.visible) {
          elet.updateMatrixWorld(true);
          elet.userData.hands[1].getWorldPosition(vH);
          const target = new THREE.Vector3(...ST);
          const d = target.clone().sub(vH);
          const len = Math.min(1.9, Math.max(0.6, d.length() - 0.06));
          setPole(vH, vH.clone().addScaledVector(d.normalize(), len * Math.max(0.3, sk)));
        }
        // LED do detector: pisca vermelho na fonte de teste (detector funcionando); apagado nas fases (sem tensão)
        const onTest = t >= C.testado - 0.05 && t < C.testado + 0.5;
        ledMat.color.set(onTest && Math.sin(t * 40) > -0.3 ? "#ef4444" : "#374151");

        // ---------- Colega (equipe de 2) ----------
        const cp = colAt(t);
        const cp2 = colAt(t - 0.05);
        const cMove = Math.hypot(cp[0] - cp2[0], cp[2] - cp2[2]);
        const cWalk = Math.min(1, cMove / 0.03);
        col.visible = cp[0] < 3.6 && cp[0] > -4.0;
        col.position.fromArray(cp);
        const cTarget = t >= C.bloquear && t < C.c3 + 0.6 ? GEN_LOCK.toArray() : [-0.3, 0, PHZ[1]];
        col.rotation.y = cMove > 0.004 ? Math.atan2(cp[0] - cp2[0], cp[2] - cp2[2]) : yawTo(cp, cTarget);
        const cph = Math.sin(t * 9 + 1) * cWalk;
        col.userData.legs[0].rotation.x = 0.4 * cph;
        col.userData.legs[1].rotation.x = -0.4 * cph;
        col.userData.hips.position.y = 0.9 + 0.02 * Math.abs(cph);
        const cK = track(t, [[C.gerador - 0.2, 0], [C.gerador + 0.3, 1], [C.gerador + 0.8, 1], [C.gerador + 1.1, 0]]);
        aimArm(col, colA, GEN_LOCK.toArray(), cK);

        renderer.render(scene, camera);
        placeCallouts(t);
      };
    }

    // Relógio: um tween do GSAP alimenta render(t). A linha do tempo só é registrada depois que as fontes e o
    // símbolo da ECASI carregaram, para o colete nunca aparecer sem o logo.
    const logoTex = new THREE.TextureLoader().loadAsync("assets/brand/simbolo-ecasi.png");
    Promise.all([document.fonts.ready, logoTex]).then(([, tex]) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      const render = build(tex);
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: C.end, duration: C.end, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["world"] = tl;
    });
  </script>
</template>
