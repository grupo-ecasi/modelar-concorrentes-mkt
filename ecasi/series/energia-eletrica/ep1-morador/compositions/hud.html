      "mito": 53.84,
      "naoMito": 55.68,
      "ligada": 58.08,
      "esquenta": 59.68,
      "vezes": 60.64,
      "queimar": 62,
      "norma": 63.49,
      "exige": 65.81,
      "circuito": 66.37,
      "protecao": 68.13,
      "cta": 69.57,
      "eletricista": 71.01,
      "segue": 72.69,
      "proximo": 74.45,
      "loop": 77.41,
      "confira": 78.93,
      "antes": 80.85,
      "end": 82.87
    };
    /*END-CUES*/

    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const ENTER = "expo.out";

    // Entrada da marca: 0,7 s, opacidade + 24 px. Saída mais curta, com desfoque.
    function show(sel, a, b, opts = {}) {
      const el = $(sel);
      const dy = opts.dy ?? 24;
      tl.set(el, { visibility: "visible" }, 0);
      tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: opts.dur ?? 0.7, ease: ENTER }, a);
      if (b != null) {
        tl.to(el, { opacity: 0, y: -10, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
        tl.set(el, { visibility: "hidden" }, b);
      }
    }
    function section(sel, a, b) {
      const el = $(sel);
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, a);
      tl.fromTo(el.querySelector(".n"), { scale: 0.55, opacity: 0, filter: "blur(14px)", transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, a);
      tl.fromTo(el.querySelector(".t"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, a + 0.22);
      tl.fromTo(el.querySelector(".s"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, a + 0.36);
      tl.to(el, { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
      tl.set(el, { visibility: "hidden" }, b);
    }
    function count(sel, to, at, dur = 0.8, fmt = (v) => String(Math.round(v))) {
      const p = { v: 0 };
      tl.fromTo(p, { v: 0 }, { v: to, duration: dur, ease: "power2.out", onUpdate: () => ($(sel).textContent = fmt(p.v)) }, at);
    }
    function bar(sel, at, dur = 0.6) {
      tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: "power3.out" }, at);
    }
    const CHIP = {
      off: { backgroundColor: "#ffffff", borderColor: "#e5e7eb", color: "#6b7280" },
      on: { backgroundColor: "#c2410c", borderColor: "#c2410c", color: "#ffffff" },
      done: { backgroundColor: "#fff1e6", borderColor: "#fed7b5", color: "#c2410c" },
    };
    function chip(n, state, at) {
      tl.to("#hud-chip" + n, { ...CHIP[state], duration: 0.3, ease: "power2.inOut" }, at);
    }
    function vignette(a, b, peak = 1) {
      tl.to("#hud-vig", { opacity: peak, duration: 0.5, ease: "power2.out" }, a);
      tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, b - 0.6);
    }

    // Abertura (o primeiro quadro já mostra o título, para o loop emendar)
    tl.set("#hud-hook", { opacity: 1 }, 0);
    tl.set("#hud-vig", { opacity: 0.7 }, 0);
    tl.to("#hud-hook", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, C.pode - 0.12);
    tl.set("#hud-hook", { visibility: "hidden" }, C.pode + 0.1);
    tl.fromTo("#hud-pode", { opacity: 0, scale: 1.25, filter: "blur(12px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, C.pode);
    tl.to("#hud-pode", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, C.fios - 0.1);
    tl.set("#hud-pode", { visibility: "hidden" }, C.fios + 0.1);
    tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, C.camadas);
    show("#hud-live", C.fios + 0.1, C.problema);

    // Barra 1-2-3: entra em "três camadas"
    [1, 2, 3].forEach((n, i) => {
      tl.fromTo("#hud-chip" + n, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER }, C.camadas + i * 0.12);
    });
    chip(1, "on", C.c1);
    chip(1, "done", C.c2);
    chip(2, "on", C.c2);
    chip(2, "done", C.c3);
    chip(3, "on", C.c3);
    chip(3, "done", C.mito);
    tl.to("#hud-chips", { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, C.cta - 0.1);
    tl.fromTo("#hud-chips", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER, immediateRender: false }, C.loop + 0.1);
    chip(1, "on", C.confira + 0.56);
    chip(2, "on", C.confira + 0.72);
    chip(3, "on", C.confira + 0.96);

    // Problema: 34 A e a comparação com os aparelhos da casa
    show("#hud-c34", C.a34 - 0.2, C.geladeira - 0.1);
    count("#hud-v34", 34, C.a34 - 0.1);
    show("#hud-cmp1", C.geladeira - 0.1, C.molhada);
    bar("#hud-b-show", C.geladeira, 0.7);
    bar("#hud-b-gel", C.geladeira + 0.3, 0.4);
    bar("#hud-b-tv", C.tv, 0.4);
    bar("#hud-b-mic", C.micro, 0.6);
    tl.fromTo(["#hud-cmp1-lab", "#hud-cmp1-num"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, C.juntos - 0.1);
    show("#hud-c10", C.ma10 + 0.1, C.ma50);
    show("#hud-c50", C.ma50 + 0.1, C.c1);
    vignette(C.coracao, C.c1 + 0.2, 0.8);

    // Camadas
    section("#hud-s1", C.c1, C.registro - 0.1);
    show("#hud-q1", C.disjuntor - 0.4, C.c2);
    section("#hud-s2", C.c2, C.modelo + 0.2);
    show("#hud-cvolt", C.tensao, C.fio - 0.1);
    show("#hud-cburn", C.queimado, C.c3);
    section("#hud-s3", C.c3, C.achou - 0.1);
    show("#hud-a1", C.achou - 0.2, C.pare);
    show("#hud-a2", C.confirmar - 0.2, C.pare);
    tl.fromTo("#hud-stop", { opacity: 0, scale: 0.7, rotation: -8, transformOrigin: "20% 50%" }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, C.pare - 0.05);
    tl.to("#hud-stop", { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, C.mito - 0.25);
    tl.set("#hud-stop", { visibility: "hidden" }, C.mito);

    // Mito: resistência de 127 V em 220 V
    show("#hud-alert", C.mito, C.norma, { dur: 0.45 });
    show("#hud-cneq", C.naoMito, C.esquenta - 0.1);
    show("#hud-cmp2", C.esquenta - 0.1, C.norma);
    bar("#hud-b-ok", C.esquenta, 0.5);
    bar("#hud-b-bad", C.esquenta + 0.3, 0.9);
    count("#hud-v16", 16500, C.esquenta + 0.3, 0.9, (v) => (Math.round(v / 100) * 100).toLocaleString("pt-BR"));
    tl.fromTo("#hud-3x", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: ENTER }, C.vezes - 0.1);
    vignette(C.queimar - 0.2, C.norma + 0.2, 0.85);

    // Norma
    show("#hud-norma-head", C.norma + 0.3, C.cta);
    show("#hud-k1", C.circuito - 0.2, C.cta);
    show("#hud-k2", C.protecao - 0.1, C.cta);

    // Fecho: a vinheta volta aos poucos para emendar com o primeiro quadro
    tl.set("#hud-end", { opacity: 1, visibility: "visible" }, C.confira - 0.05);
    tl.fromTo("#hud-end1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.confira);
    tl.fromTo("#hud-end2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.confira + 0.72);
    tl.fromTo("#hud-end3", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.antes);
    tl.to("#hud-vig", { opacity: 0.7, duration: 1.2, ease: "power1.inOut" }, C.end - 1.4);

    window.__timelines["hud"] = tl;
  </script>
</template>
