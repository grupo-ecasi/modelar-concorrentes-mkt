      "end": 99.61
    };
    /*END-CUES*/

    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const ENTER = "expo.out";

    // Entrada da marca: 0,7 s, opacidade + 24 px. Saída mais curta, com desfoque.
    function show(sel, a, b, opts = {}) {
      const el = $(sel);
      const dy = opts.dy ?? 24;
      tl.set(el, { visibility: "visible" }, 0);
      tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: opts.dur ?? 0.7, ease: ENTER }, a);
      if (b != null) {
        tl.to(el, { opacity: 0, y: -10, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
        tl.set(el, { visibility: "hidden" }, b);
      }
    }
    function section(sel, a, b) {
      const el = $(sel);
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, a);
      tl.fromTo(el.querySelector(".n"), { scale: 0.55, opacity: 0, filter: "blur(14px)", transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, a);
      tl.fromTo(el.querySelector(".t"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, a + 0.22);
      tl.fromTo(el.querySelector(".s"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, a + 0.36);
      tl.to(el, { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
      tl.set(el, { visibility: "hidden" }, b);
    }
    function count(sel, from, to, at, dur = 0.8, ease = "power2.out") {
      const p = { v: from };
      tl.fromTo(p, { v: from }, { v: to, duration: dur, ease, onUpdate: () => ($(sel).textContent = String(Math.round(p.v))) }, at);
    }
    function bar(sel, at, dur = 0.6) {
      tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: "power3.out" }, at);
    }
    const CHIP = {
      off: { backgroundColor: "#ffffff", borderColor: "#e5e7eb", color: "#6b7280" },
      on: { backgroundColor: "#c2410c", borderColor: "#c2410c", color: "#ffffff" },
      done: { backgroundColor: "#fff1e6", borderColor: "#fed7b5", color: "#c2410c" },
    };
    function chip(n, state, at) {
      tl.to("#hud-chip" + n, { ...CHIP[state], duration: 0.3, ease: "power2.inOut" }, at);
    }
    function vignette(a, b, peak = 1) {
      tl.to("#hud-vig", { opacity: peak, duration: 0.5, ease: "power2.out" }, a);
      tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, b - 0.6);
    }

    // Abertura (o primeiro quadro já mostra o título, para o loop emendar)
    tl.set("#hud-hook", { opacity: 1 }, 0);
    tl.set("#hud-vig", { opacity: 0.7 }, 0);
    tl.to("#hud-hook", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, C.nao - 0.12);
    tl.set("#hud-hook", { visibility: "hidden" }, C.nao + 0.1);
    tl.fromTo("#hud-ainda", { opacity: 0, scale: 1.25, filter: "blur(12px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, C.nao);
    tl.to("#hud-ainda", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, C.desligar - 0.1);
    tl.set("#hud-ainda", { visibility: "hidden" }, C.desligar + 0.1);
    tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, C.camadas);
    show("#hud-live", C.desligar + 0.1, C.camadas - 0.1);

    // Barra 1-2-3: entra em "três camadas"
    [1, 2, 3].forEach((n, i) => {
      tl.fromTo("#hud-chip" + n, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER }, C.camadas + i * 0.12);
    });
    chip(1, "on", C.c1);
    chip(1, "done", C.c2);
    chip(2, "on", C.c2);
    chip(2, "done", C.c3);
    chip(3, "on", C.c3);
    chip(3, "done", C.mito);
    tl.to("#hud-chips", { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, C.cta - 0.1);
    tl.fromTo("#hud-chips", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER, immediateRender: false }, C.loop + 0.1);
    chip(1, "on", C.confira + 0.64);
    chip(2, "on", C.confira + 0.8);
    chip(3, "on", C.confira + 1.04);

    // Problema: energia guardada no barramento, partida inesperada e arco
    show("#hud-cbus", C.capacitores - 0.2, C.alguem - 0.1);
    count("#hud-vbus", 0, 540, C.capacitores, C.v540 + 0.2 - C.capacitores, "power1.inOut");
    show("#hud-cpart", C.alguem - 0.1, C.curto - 0.1);
    show("#hud-carco", C.curto - 0.1, C.c1);
    vignette(C.arco - 0.2, C.c1 + 0.2, 0.8);

    // Camada 1
    section("#hud-s1", C.c1, C.analise + 0.05);
    show("#hud-p1", C.analise, C.c2);
    show("#hud-p2", C.permissao - 0.15, C.c2);
    show("#hud-p3", C.diagrama - 0.15, C.c2);

    // Camada 2
    section("#hud-s2", C.c2, C.todas - 0.2);
    show("#hud-b1", C.todas - 0.2, C.cada - 0.1);
    show("#hud-b2", C.fontes, C.cada - 0.1);
    show("#hud-qlock", C.cada - 0.1, C.c3);

    // Camada 3
    section("#hud-s3", C.c3, C.espere - 0.2);
    show("#hud-t1", C.espere - 0.2, C.mito);
    tl.fromTo("#hud-clock", { rotation: 0, svgOrigin: "12 12" }, { rotation: 720, svgOrigin: "12 12", duration: C.tente - C.espere, ease: "none" }, C.espere);
    show("#hud-t2", C.tente - 0.15, C.mito);
    show("#hud-t3", C.meca - 0.15, C.mito);

    // Mito: display apagado com o barramento ainda carregado
    show("#hud-alert", C.mito, C.norma, { dur: 0.45 });
    show("#hud-cneq", C.mito + 0.1, C.display2 - 0.2);
    tl.fromTo("#hud-nao", { opacity: 0, scale: 1.3, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, C.naoMito);
    show("#hud-dsp", C.display2 - 0.2, C.v540b - 0.2);
    count("#hud-vres", 540, 330, C.apaga, C.centenas + 0.9 - C.apaga, "power1.out");
    show("#hud-scale", C.v540b - 0.2, C.norma);
    bar("#hud-b-bt", C.v540b, 0.8);
    tl.fromTo("#hud-mk", { opacity: 0, scaleY: 0.3 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: "back.out(2)" }, C.v540b + 0.5);
    show("#hud-risk", C.mas - 0.1, C.norma);
    vignette(C.mito - 0.1, C.norma + 0.2, 0.6);

    // Norma
    show("#hud-norma-head", C.norma + 0.2, C.cta);
    show("#hud-k1", C.norma + 0.4, C.cta);
    show("#hud-k2", C.nr12 - 0.15, C.cta);
    show("#hud-k3", C.nr1 - 0.15, C.cta);

    // Fecho: a vinheta volta aos poucos para emendar com o primeiro quadro
    tl.set("#hud-end", { opacity: 1, visibility: "visible" }, C.confira - 0.05);
    tl.fromTo("#hud-end1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.confira);
    tl.fromTo("#hud-end2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.confira + 0.8);
    tl.fromTo("#hud-end3", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.antes);
    tl.to("#hud-vig", { opacity: 0.7, duration: 1.2, ease: "power1.inOut" }, C.end - 1.4);

    window.__timelines["hud"] = tl;
  </script>
</template>
