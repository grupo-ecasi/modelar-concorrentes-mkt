    function track(t, keys) {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 0; i < keys.length - 1; i++) {
        const [ta, va] = keys[i];
        const [tb, vb] = keys[i + 1];
        if (t <= tb) return tb === ta ? vb : lerp(va, vb, easeInOut((t - ta) / (tb - ta)));
      }
      return keys[keys.length - 1][1];
    }
    function track3(t, keys) {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 0; i < keys.length - 1; i++) {
        const [ta, va] = keys[i];
        const [tb, vb] = keys[i + 1];

    const angLerp = (a, b, x) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a)) * x;
    // Integral de uma velocidade por partes (fluxo contínuo mesmo quando a velocidade muda)
    function integ(t, speedAt) {
      let s = 0;
      const dt = 1 / 60;
      for (let x = 0; x < t; x += dt) s += speedAt(x) * Math.min(dt, t - x);

        }

    // Caminho com cantos arredondados (fios dobrados de verdade)
    function bendPath(pts, r = 0.02) {
      const P = pts.map((p) => new THREE.Vector3(...p));
      const path = new THREE.CurvePath();
      let cur = P[0].clone();
      for (let i = 1; i < P.length - 1; i++) {
        const a = P[i - 1];
        const b = P[i];
        const c = P[i + 1];
        const l1 = b.distanceTo(a);
        const l2 = c.distanceTo(b);
        const rr = Math.min(r, l1 / 2, l2 / 2);
        const p1 = b.clone().addScaledVector(b.clone().sub(a).normalize(), -rr);
        const p2 = b.clone().addScaledVector(c.clone().sub(b).normalize(), rr);
        if (cur.distanceTo(p1) > 1e-5) path.add(new THREE.LineCurve3(cur.clone(), p1));
        path.add(new THREE.QuadraticBezierCurve3(p1, b.clone(), p2));
        cur = p2;
      }
      path.add(new THREE.LineCurve3(cur, P[P.length - 1]));
      return path;
    }
    function wire(pts, m, r = 0.0058, bend = 0.018) {
      const path = bendPath(pts, bend);
      const L = path.getLength();
      const geo = new THREE.TubeGeometry(path, Math.max(24, Math.round(L * 180)), r, 8, false);
      if (m.map) {
        m = m.clone();
        m.map = m.map.clone();
        m.map.repeat.set(L / 0.035, 1);
        m.map.needsUpdate = true;
      }
      const mesh = shade(new THREE.Mesh(geo, m));
      scene.add(mesh);
      return { mesh, path, geo, L, r };
    }

    // ---------- Energia: tubo de fluxo (pulsos que correm pelo fio, com brilho) ----------
    const FLOW_VS = `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`;
    const FLOW_FS = `uniform float uT; uniform float uI; uniform float uDens; uniform float uLen; uniform vec3 uColor; uniform float uHead; uniform float uHeadI; uniform float uDraw; uniform float uBase;
      varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){
        if (vUv.x > uDraw) discard;
        float s = vUv.x * uLen;
        float f = fract(s * uDens - uT);
        float dash = smoothstep(0.0, 0.1, f) * (1.0 - smoothstep(0.28, 0.55, f));
        float facing = abs(dot(normalize(vN), normalize(vV)));
        float body = 0.3 + 0.7 * facing;
        float head = uHeadI * exp(-pow((s - uHead) / 0.06, 2.0));
        float e = uI * (uBase + dash) * body + head * (0.5 + 0.5 * facing);
        gl_FragColor = vec4(uColor * e, 1.0);
      }`;
    const flows = [];
    function flowOn(w, color, k = 2.6, dens = 9, scaleR = 1.55) {
      const geo = new THREE.TubeGeometry(w.path, w.geo.parameters.tubularSegments, w.r * scaleR, 8, false);
      const mt = new THREE.ShaderMaterial({
        uniforms: {
          uT: { value: 0 },
          uI: { value: 0 },
          uDens: { value: dens },
          uLen: { value: w.L },
          uColor: { value: new THREE.Color(color).multiplyScalar(k) },
          uHead: { value: -9 },
          uHeadI: { value: 0 },
          uDraw: { value: 1 },
          uBase: { value: 0.12 },
        },
        vertexShader: FLOW_VS,
        fragmentShader: FLOW_FS,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const mesh = new THREE.Mesh(geo, mt);
      mesh.renderOrder = 6;
      mesh.frustumCulled = false;
      scene.add(mesh);
      const f = { mesh, u: mt.uniforms, L: w.L, k, set(i, T, col) {
        mesh.visible = i > 0.002 || mt.uniforms.uHeadI.value > 0.002;
        mt.uniforms.uI.value = i;
        mt.uniforms.uT.value = T;
        if (col) mt.uniforms.uColor.value.set(col).multiplyScalar(k);
      } };
      flows.push(f);
      return f;
    }

    // ---------- Energia: superfície eletrificada (linhas que andam sobre a carcaça) ----------
    const SKIN_FS = `uniform float uT; uniform float uI; uniform vec3 uColor; varying vec3 vP; varying vec3 vN; varying vec3 vV;
      float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float n(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(h(i), h(i + vec2(1.0, 0.0)), u.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), u.x), u.y); }
      void main(){
        vec2 p = vP.xy * 7.0 + vP.zy * 5.0 + vP.xz * 3.0;
        float a = n(p + vec2(uT * 2.3, -uT * 1.7)) * 0.65 + n(p * 2.3 - vec2(uT * 4.1, uT * 2.9)) * 0.35;
        float lines = 1.0 - smoothstep(0.0, 0.035, abs(a - 0.52));
        float rim = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.2);
        float flick = 0.65 + 0.35 * sin(uT * 37.0) * sin(uT * 23.0 + 1.3);
        gl_FragColor = vec4(uColor * (lines * 2.6 * flick + rim * 0.9) * uI, 1.0);
      }`;
    function skinMat(color) {
      return new THREE.ShaderMaterial({
        uniforms: { uT: { value: 0 }, uI: { value: 0 }, uColor: { value: new THREE.Color(color) } },
        vertexShader: `varying vec3 vP; varying vec3 vN; varying vec3 vV;
          void main(){ vP = position; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: SKIN_FS,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
    }

    // ---------- Energia: arco elétrico (raio ramificado, núcleo branco e halo azul) ----------
    const bolts = [];
    function makeBolt(N, coreW, glowW, glowColor) {
      const mk = (w, col, op) => {
        const geo = new LineGeometry();
        geo.setPositions(new Float32Array(N * 3));
        const m = new LineMaterial({ color: col, linewidth: w, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending });
        m.resolution.set(W, H);
        const l = new Line2(geo, m);
        l.frustumCulled = false;
        l.renderOrder = 10;
        l.visible = false;
        scene.add(l);
        return l;
      };
      const b = { N, glow: mk(glowW, new THREE.Color(glowColor).multiplyScalar(0.8), 0.6), core: mk(coreW, new THREE.Color(1.8, 1.9, 2.3), 1) };
      bolts.push(b);
      return b;
    }
    const vA = new THREE.Vector3();
    const vB = new THREE.Vector3();
    const vD = new THREE.Vector3();
    const vU = new THREE.Vector3();
    const vWp = new THREE.Vector3();
    const UPV = new THREE.Vector3(0, 1, 0);
    function setBolt(b, a, c, seed, amp, inten) {
      if (inten <= 0.01) {
        b.core.visible = b.glow.visible = false;
        return;
      }
      vA.fromArray(a);
      vB.fromArray(c);
      vD.subVectors(vB, vA);
      vU.crossVectors(vD, Math.abs(vD.y) > 0.9 * vD.length() ? new THREE.Vector3(1, 0, 0) : UPV).normalize();
      vWp.crossVectors(vD, vU).normalize();
      const pts = [];
      for (let i = 0; i < b.N; i++) {
        const s = i / (b.N - 1);
        const env = Math.sin(Math.PI * s);
        // grosso (4 controles interpolados) + fino (por ponto)
        const cs = s * 4;
        const ci = Math.floor(cs);
        const cf = cs - ci;
        const c1 = lerp(hash(seed + ci * 3.1) - 0.5, hash(seed + (ci + 1) * 3.1) - 0.5, cf);
        const c2 = lerp(hash(seed + ci * 5.7 + 9) - 0.5, hash(seed + (ci + 1) * 5.7 + 9) - 0.5, cf);
        const f1 = (hash(seed + i * 7.3 + 1) - 0.5) * 0.45;
        const f2 = (hash(seed + i * 9.1 + 2) - 0.5) * 0.45;
        const o1 = (c1 + f1) * amp * env;
        const o2 = (c2 + f2) * amp * env;
        pts.push(vA.x + vD.x * s + vU.x * o1 + vWp.x * o2, vA.y + vD.y * s + vU.y * o1 + vWp.y * o2, vA.z + vD.z * s + vU.z * o1 + vWp.z * o2);
      }
      for (const l of [b.core, b.glow]) {
        const arr = l.geometry.attributes.instanceStart.data.array;
        for (let i = 0; i < b.N - 1; i++) {
          for (let j = 0; j < 3; j++) {
            arr[i * 6 + j] = pts[i * 3 + j];
            arr[i * 6 + 3 + j] = pts[(i + 1) * 3 + j];
          }
        }
        l.geometry.attributes.instanceStart.data.needsUpdate = true;
        l.visible = true;
      }
      b.core.material.opacity = Math.min(1, inten);
      b.glow.material.opacity = 0.6 * Math.min(1, inten);
      return pts;
    }

    // ---------- Energia: faíscas balísticas (determinísticas, quicam no piso) ----------
    const SPARK_N = 220;
    const sparks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.0055, 0.0055, 1), new THREE.MeshBasicMaterial({ color: "#ffffff" }), SPARK_N);
    sparks.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(SPARK_N * 3), 3);
    sparks.frustumCulled = false;
    sparks.renderOrder = 9;
    scene.add(sparks);
    const BURSTS = [];
    const dum = new THREE.Object3D();
    const ZAX = new THREE.Vector3(0, 0, 1);
    const sV = new THREE.Vector3();
    const sP = new THREE.Vector3();
    const sCol = new THREE.Color();
    function updateSparks(t) {
      let k = 0;
      for (const b of BURSTS) {
        const age = t - b.t0;
        if (age < 0 || age > b.life + b.stagger + 0.1) continue;
        const d = new THREE.Vector3(...b.dir).normalize();
        const u = new THREE.Vector3().crossVectors(d, Math.abs(d.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : UPV).normalize();
        const w = new THREE.Vector3().crossVectors(d, u);
        for (let i = 0; i < b.n && k < SPARK_N; i++) {
          const h1 = hash(b.seed + i * 1.37);
          const h2 = hash(b.seed + i * 2.71);
          const h3 = hash(b.seed + i * 4.13);
          const h4 = hash(b.seed + i * 5.93);
          const a = age - h4 * b.stagger;
          const life = b.life * (0.45 + 0.55 * h3);
          if (a < 0 || a > life) continue;
          const th = b.spread * Math.sqrt(h1);
          const ph = 2 * Math.PI * h2;
          const sp = b.speed * (0.45 + 0.75 * hash(b.seed + i * 7.7));
          sV.copy(d).multiplyScalar(Math.cos(th)).addScaledVector(u, Math.sin(th) * Math.cos(ph)).addScaledVector(w, Math.sin(th) * Math.sin(ph)).multiplyScalar(sp);
          sP.set(b.o[0] + sV.x * a, b.o[1] + sV.y * a - 4.9 * a * a, b.o[2] + sV.z * a);
          let vy = sV.y - 9.8 * a;
          if (sP.y < 0.004) {
            // quique simples no piso
            sP.y = 0.004 + Math.abs(sP.y) * 0.25;
            vy = Math.abs(vy) * 0.3;
          }
          const vel = new THREE.Vector3(sV.x, vy, sV.z);
          const spd = vel.length();
          dum.position.copy(sP);
          dum.quaternion.setFromUnitVectors(ZAX, vel.normalize());
          dum.scale.set(b.size, b.size, 0.012 + spd * 0.022);
          dum.updateMatrix();
          sparks.setMatrixAt(k, dum.matrix);
          const fade = 1 - a / life;
          sCol.setRGB(lerp(1.1, 3.0, fade), lerp(0.3, 2.2, fade * fade), lerp(0.06, 0.9, fade * fade * fade));
          sparks.setColorAt(k, sCol);
          k++;
        }
      }
      dum.scale.set(0, 0, 0);
      dum.updateMatrix();
      for (; k < SPARK_N; k++) sparks.setMatrixAt(k, dum.matrix);
      sparks.instanceMatrix.needsUpdate = true;
      sparks.instanceColor.needsUpdate = true;
    }

    // ---------- Energia: fumaça (sprites suaves) ----------
    const smoke = [];
    for (let k = 0; k < 30; k++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: "#3a3e45", transparent: true, depthWrite: false, opacity: 0 }));
      s.renderOrder = 7;
      scene.add(s);
      smoke.push(s);
    }
    function updateSmoke(t, src, amount, spread = 0.5) {
      smoke.forEach((s, k) => {
        if (amount <= 0.01) {
          s.visible = false;
          return;
        }
        const f = (hash(k * 1.7) + t * (0.32 + hash(k * 2.3) * 0.18)) % 1;
        s.visible = true;
        s.position.set(
          src[0] + (hash(k * 3.1) - 0.5) * spread + 0.08 * Math.sin(t * 1.4 + k) * f,
          src[1] + 0.03 + f * (0.7 + hash(k * 4.4) * 0.4),
          src[2] + 0.06 + f * 0.25,
        );
        s.scale.setScalar(0.1 + f * (0.45 + hash(k) * 0.25));
        s.material.rotation = hash(k * 5.5) * 6 + t * 0.3;
        s.material.opacity = amount * 0.5 * (1 - f) * Math.min(1, f * 8);
      });
    }

    // ---------- Luz: interna, com janela fria e chave quente ----------
    const hemi = new THREE.HemisphereLight("#fffaf2", "#b3a690", 0.21);
    scene.add(hemi);
    const key = new THREE.DirectionalLight("#fff0dc", 0.88);
    key.position.set(2.6, 5.4, 4.2);
    key.target.position.set(-0.3, 1.2, -1.2);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -3.6;
    key.shadow.camera.right = 3.6;
    key.shadow.camera.top = 3.6;
    key.shadow.camera.bottom = -3.6;
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 16;
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.015;
    key.shadow.radius = 3;
    key.shadow.blurSamples = 12;
    scene.add(key, key.target);
    const fill = new THREE.DirectionalLight("#d6e6ff", 0.21);
    fill.position.set(-4, 2.6, 2.5);
    scene.add(fill);
    const arcLight = new THREE.PointLight("#cfe8ff", 0, 5, 2);
    const fireLight = new THREE.PointLight("#ff7a2a", 0, 3.5, 2);
    const chassisLight = new THREE.PointLight("#ff4d4d", 0, 3, 2);
    const dpsLight = new THREE.PointLight("#a78bfa", 0, 2.5, 2);
    scene.add(arcLight, fireLight, chassisLight, dpsLight);

    // ---------- Cenário: área de serviço ----------
    const WALL_Z = -1.4;
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(22, 22), M.floor);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const wall = box(11, 5, 0.2, M.wall);
    wall.position.set(0, 2.5, WALL_Z - 0.1);
    scene.add(wall);
    const tiles = box(11, 1.0, 0.012, M.tileWall);
    tiles.position.set(0, 0.5, WALL_Z + 0.006);
    const listel = rbox(11, 0.03, 0.02, 0.006, M.listel);
    listel.position.set(0, 1.0, WALL_Z + 0.01);
    scene.add(tiles, listel);
    // Prateleira com produtos de limpeza
    const shelf = rbox(0.62, 0.03, 0.22, 0.01, M.wood);
    shelf.position.set(-2.05, 1.55, WALL_Z + 0.11);
    scene.add(shelf);
    [["#2f80ed", 0.07, 0.24], ["#f2994a", 0.06, 0.2], ["#27ae60", 0.055, 0.27], ["#eb5757", 0.065, 0.18]].forEach(([c, r, hgt], i) => {
      const b = cyl(r * 0.6, hgt, std(c, { roughness: 0.3 }), 16);
      b.position.set(-2.28 + i * 0.15, 1.565 + hgt / 2, WALL_Z + 0.11);
      const capB = cyl(r * 0.25, 0.04, M.white, 12);
      capB.position.set(b.position.x, 1.565 + hgt + 0.02, WALL_Z + 0.11);
      scene.add(b, capB);
    });
    // Vaso com planta e quadrinho à direita
    const pot = cyl(0.14, 0.3, M.pot, 20, 0.11);
    pot.position.set(1.6, 0.15, WALL_Z + 0.32);
    scene.add(pot);
    for (let i = 0; i < 9; i++) {
      const lf = sph(0.07, i % 2 ? M.plant : M.plant2, 12);
      const a = (i / 9) * Math.PI * 2;
      lf.scale.set(0.55, 2.4, 0.3);
      lf.position.set(1.6 + Math.cos(a) * 0.08, 0.5 + hash(i) * 0.12, WALL_Z + 0.32 + Math.sin(a) * 0.08);
      lf.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5);
      scene.add(lf);
    }
    const artTex = canvasTex(256, 192, (g, w, h) => {
      g.fillStyle = "#f6efe2";
      g.fillRect(0, 0, w, h);
      g.fillStyle = "#e9a46b";
      g.beginPath();
      g.arc(90, 110, 52, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = "#1f3a6b";
      g.fillRect(130, 40, 70, 110);
      g.fillStyle = "#7fb59a";
      g.fillRect(40, 140, 170, 18);
    });
    const frame = rbox(0.4, 0.31, 0.025, 0.006, M.dark);
    frame.position.set(1.48, 1.78, WALL_Z + 0.013);
    const art = plane(0.36, 0.27, new THREE.MeshStandardMaterial({ map: artTex, roughness: 0.8 }));
    art.position.set(1.48, 1.78, WALL_Z + 0.027);
    scene.add(frame, art);
    // Interruptor
    const sw = rbox(0.075, 0.12, 0.012, 0.006, M.white);
    sw.position.set(-0.42, 1.2, WALL_Z + 0.006);
    const swKey = rbox(0.045, 0.07, 0.01, 0.005, M.whiteGloss);
    swKey.position.set(-0.42, 1.2, WALL_Z + 0.016);
    scene.add(sw, swKey);

    // ---------- Quadro de distribuição (de sobrepor, com tampa) ----------
    const QD = new THREE.Vector3(0.35, 1.5, WALL_Z);
    const QW = 0.72;
    const QH = 0.92;
    const QDP = 0.2;
    const QF = WALL_Z + QDP;
    const qBack = box(QW, QH, 0.012, M.enc);
    qBack.position.set(QD.x, QD.y, WALL_Z + 0.006);
    scene.add(qBack);
    for (const s of [-1, 1]) {
      const sd = rbox(0.016, QH, QDP, 0.004, M.enc);
      sd.position.set(QD.x + s * (QW / 2 - 0.008), QD.y, WALL_Z + QDP / 2);
      const tb = rbox(QW, 0.016, QDP, 0.004, M.enc);
      tb.position.set(QD.x, QD.y + s * (QH / 2 - 0.008), WALL_Z + QDP / 2);
      scene.add(sd, tb);
    }
    const mplate = rbox(QW - 0.06, QH - 0.06, 0.006, 0.003, M.plate);
    mplate.position.set(QD.x, QD.y, WALL_Z + 0.018);
    scene.add(mplate);
    const RAIL_Z = WALL_Z + 0.03;
    const CZ = RAIL_Z + 0.03;
    const WZ = WALL_Z + 0.025;
    const ROW_A = QD.y + 0.2;
    const ROW_B = QD.y - 0.08;
    for (const y of [ROW_A, ROW_B]) {
      const rail = rbox(0.6, 0.035, 0.008, 0.002, M.rail);
      rail.position.set(QD.x, y, RAIL_Z - 0.004);
      const lipT = box(0.6, 0.004, 0.012, M.rail);
      lipT.position.set(QD.x, y + 0.0175, RAIL_Z - 0.002);
      const lipB = lipT.clone();
      lipB.position.y = y - 0.0175;
      scene.add(rail, lipT, lipB);
    }

    // Disjuntor DIN: corpo, frente, alavanca com pivô, janela ON/OFF, etiqueta e parafusos dos bornes
    const MOD = 0.068;
    const ON_ROT = 0.42;
    const OFF_ROT = Math.PI - 0.42;
    const indOn = new THREE.MeshStandardMaterial({ color: "#e53935", roughness: 0.4 });
    const indOff = new THREE.MeshStandardMaterial({ color: "#43a047", roughness: 0.4 });
    function makeBreaker({ x, y, poles = 1, label = "", leverColor = "#1f2328", body = M.breaker, labelBg = "#ffffff", labelFg = "#0b1d3f" }) {
      const g = new THREE.Group();
      g.position.set(x, y, RAIL_Z);
      const w = MOD * poles - 0.003;
      const base = rbox(w, 0.19, 0.05, 0.006, body);
      base.position.z = 0.025;
      const nose = rbox(w, 0.085, 0.04, 0.007, body);
      nose.position.z = 0.068;
      g.add(base, nose);
      const terms = [];
      for (let p = 0; p < poles; p++) {
        const px = -w / 2 + MOD * (p + 0.5) - 0.0015;
        for (const sy of [1, -1]) {
          const sc = cyl(0.0095, 0.008, M.screw, 14);
          sc.rotation.x = Math.PI / 2;
          sc.position.set(px, sy * 0.075, 0.051);
          const slot = box(0.013, 0.0022, 0.003, M.dark);
          slot.position.set(px, sy * 0.075, 0.0555);
          slot.rotation.z = 0.6;
          g.add(sc, slot);
        }
        terms.push(px);
      }
      const pivot = new THREE.Group();
      pivot.position.set(0, 0.008, 0.088);
      const lw = poles === 1 ? 0.026 : 0.058;
      const lev = rbox(lw, 0.05, 0.017, 0.005, std(leverColor, { roughness: 0.4 }));
      lev.position.y = 0.024;
      pivot.add(lev);
      pivot.rotation.x = ON_ROT;
      g.add(pivot);
      const ind = plane(0.012, 0.007, indOn);
      ind.position.set(w / 2 - 0.012, 0.03, 0.0885);
      g.add(ind);
      let face = null;
      if (label) {
        face = plane(Math.min(w * 0.88, 0.12), 0.026, new THREE.MeshStandardMaterial({ map: textTex([label], { bg: labelBg, fg: labelFg, w: 256, h: 64, size: 44 }), roughness: 0.5 }));
        face.position.set(0, -0.058, 0.0505);
        g.add(face);
      }
      scene.add(g);
      const top = (p = 0) => [x + terms[p], y + 0.095, CZ];
      const bot = (p = 0) => [x + terms[p], y - 0.095, CZ];
      return { g, pivot, lev, ind, face, x, y, w, top, bot, set(on) {
        pivot.rotation.x = lerp(OFF_ROT, ON_ROT, on);
        ind.material = on > 0.5 ? indOn : indOff;
      } };
    }
    const GERAL = makeBreaker({ x: QD.x - 0.215, y: ROW_A, poles: 2, label: "C50 GERAL" });
    const DR = makeBreaker({ x: QD.x - 0.059, y: ROW_A, poles: 2, label: "DR 30mA", leverColor: "#1d4ed8" });
    const drBtn = cyl(0.011, 0.012, M.yellow, 16);
    drBtn.rotation.x = Math.PI / 2;
    drBtn.position.set(DR.w / 2 - 0.017, -0.025, 0.09);

    // ---------- IK de dois ossos (ombro e cotovelo) com polo; parte da pose atual ----------
    const L1 = 0.29;
    const L2 = 0.27;
    const DOWN = new THREE.Vector3(0, -1, 0);
    const qU = new THREE.Quaternion();
    const qF = new THREE.Quaternion();
    function reach(who, arm, targetW, k, pole = null) {
      if (k <= 0.001) return;
      const { shoulder, elbow, side } = arm;
      who.updateMatrixWorld(true);
      const T = who.userData.hips.worldToLocal(new THREE.Vector3(...targetW));
      const S = shoulder.position.clone();
      const v = T.clone().sub(S);
      const d = Math.min(L1 + L2 - 0.003, Math.max(0.08, v.length()));
      const dir = v.normalize();
      const pl = (pole || new THREE.Vector3(side * 0.7, -1, -0.5)).clone().normalize();
      const n = new THREE.Vector3().crossVectors(dir, pl);
      if (n.lengthSq() < 1e-6) n.set(1, 0, 0);
      n.normalize();
      const a = Math.acos(Math.min(1, Math.max(-1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
      const upperDir = dir.clone().applyAxisAngle(n, a);
      qU.setFromUnitVectors(DOWN, upperDir);
      const E = S.clone().addScaledVector(upperDir, L1);
      const Td = S.clone().addScaledVector(dir, d);
      const foreDir = Td.sub(E).normalize().applyQuaternion(qU.clone().invert());
      qF.setFromUnitVectors(DOWN, foreDir);
      shoulder.quaternion.slerp(qU, k);
      elbow.quaternion.slerp(qF, k);
    }
    function animateBody(who, t, walk, seed) {
      const u = who.userData;
      const ph = t * 8.5 + seed;
      const sw = Math.sin(ph) * walk;
      u.legs.forEach((l, i) => {
        const s = i === 0 ? sw : -sw;
        l.thigh.rotation.x = 0.5 * s;
        l.knee.rotation.x = walk * 0.75 * Math.max(0, Math.sin(ph + (i === 0 ? 0.9 : 0.9 + Math.PI)));
      });
      u.hips.position.y = 0.92 + 0.025 * Math.abs(Math.sin(ph)) * walk;
      u.torso.scale.y = 1 + 0.012 * Math.sin(t * 2.1 + seed);
      const bl = (t + seed * 0.37) % 3.4 < 0.13 ? 0.12 : 1;
      u.eyes.forEach((e) => (e.scale.y = bl));
      return sw;
    }
    function idleArms(who, sw, bend = 0.25) {
      who.userData.arms.forEach((a, i) => {
        a.shoulder.quaternion.setFromEuler(new THREE.Euler((i === 0 ? -sw : sw) * 0.45, 0, a.side * 0.1));
        a.elbow.quaternion.setFromEuler(new THREE.Euler(-bend - 0.2 * Math.abs(sw), 0, 0));
      });
    }

        { id: "co-terra", a: C.fioTerra + 0.6, b: C.dps, at: () => [OUT.x + 0.022, 1.7, WZ], dx: 110, dy: 20, top: 760 },
        { id: "co-dps", a: C.dps + 0.1, b: C.etiqueta, at: () => worldOf(DPS[0].g, 0, 0.012, 0.09), dx: 110, dy: 160, top: 860 },
        { id: "co-tag", a: C.etiqueta + 0.5, b: C.mito, at: () => [LAV.x, ROW_B - 0.128, CZ], dx: 110, dy: 120, top: 960 },
        { id: "co-40", a: C.a40, b: C.norma, at: LAV_P, dx: 110, dy: 120, top: 960 },
        { id: "co-hot", a: C.fusivel + 0.1, b: C.norma, at: () => HOT.toArray(), dx: -80, dy: 140, top: 960 },
        { id: "co-geral", a: C.desenergizar + 0.6, b: C.cta, at: () => worldOf(GERAL.g, 0, 0.03, 0.09), dx: 120, dy: 90, top: 1020 },
        { id: "co-det", a: C.antesNr + 0.3, b: C.cta, at: () => worldOf(det, 0, 0.014, 0), dx: -120, dy: 90, top: 1020 },
        { id: "co-elet", ...CTA_BOX, a: C.treinamento + 0.4, b: C.loop, at: () => worldOf(elet.userData.hips, 0, 1.08, 0), dx: 110, dy: -60 },
      ];
      for (const c of CALLOUTS) {
        c.el = document.getElementById(c.id);
        c.bw = c.el.offsetWidth;
        c.bh = c.el.offsetHeight;
        c.line = document.createElementNS(SVGNS, "line");
        c.line.setAttribute("stroke", "#0b1d3f");
        c.line.setAttribute("stroke-width", "3");
        c.dot = document.createElementNS(SVGNS, "circle");
        c.dot.setAttribute("r", "8");
        c.dot.setAttribute("fill", "#f97316");
        c.dot.setAttribute("stroke", "#ffffff");
        c.dot.setAttribute("stroke-width", "3");
        svg.append(c.line, c.dot);
      }
      const proj = new THREE.Vector3();
      function placeCallouts(t) {
        for (const c of CALLOUTS) {
          const fadeIn = prog(t, c.a, c.a + 0.25);
          const fadeOut = 1 - prog(t, c.b - 0.2, c.b);
          const o = Math.min(fadeIn, fadeOut);
          if (o <= 0.001) {
            c.el.style.opacity = "0";
            c.line.setAttribute("opacity", "0");
            c.dot.setAttribute("opacity", "0");
            continue;
          }
          proj.fromArray(c.at()).project(camera);
          const px = (proj.x * 0.5 + 0.5) * W;
          const py = (-proj.y * 0.5 + 0.5) * H;
          let bx = px + c.dx - (c.dx < 0 ? c.bw : 0);
          let by = py + c.dy - c.bh / 2;
          bx = Math.min(W - 54 - c.bw, Math.max(54, bx));
          by = Math.min((c.bottom ?? 1160) - c.bh, Math.max(c.top ?? 330, by));
          const lift = 14 * (1 - easeOutExpo(fadeIn));
          c.el.style.opacity = String(o);
          c.el.style.transform = `translate(${bx}px, ${by + lift}px)`;
          const lx = bx + (c.dx < 0 ? c.bw : 0);
          const ly = by + c.bh / 2;
          const grow = easeOut(fadeIn);
          c.line.setAttribute("x1", String(px));
          c.line.setAttribute("y1", String(py));
          c.line.setAttribute("x2", String(lerp(px, lx, grow)));
          c.line.setAttribute("y2", String(lerp(py, ly, grow)));
          c.line.setAttribute("opacity", String(o));
          c.dot.setAttribute("cx", String(px));
          c.dot.setAttribute("cy", String(py));
          c.dot.setAttribute("opacity", String(o));
        }
      }

      // ---------- Estados ao longo do tempo ----------
      // Tampa: entreaberta no início (o eletricista fecha), aberta das camadas até o loop, e ele fecha de novo no fim
      const LID = [[0, 0.45], [0.25, 0.45], [1.0, 0], [C.quadro2, 0], [C.quadro2 + 0.3, 0.5], [C.quadro2 + 0.95, 2.85], [C.loop + 0.6, 2.85], [C.end - 0.9, 0.5], [C.end - 0.15, 0.45]];
      // Geral: desligado para a NR-10 (desenergizar) e religado depois do teste
      const GER = [[0, 1], [C.desenergizar + 0.15, 1], [C.desenergizar + 0.35, 0], [C.curso + 0.4, 0], [C.curso + 0.55, 1]];
      // DR: desarma no teste e o eletricista religa
      const DRL = [[0, 1], [C.teste + 0.05, 1], [C.teste + 0.17, 0], [C.naoEntrega + 0.55, 0], [C.naoEntrega + 0.75, 1]];
      // Calor do cabo: sobrecarga (problema) e disjuntor de 40 A (mito)
      const HEAT = [[0, 0], [C.cabo, 0], [C.esquenta + 0.6, 0.7], [C.g70 + 0.8, 0.75], [C.fuga, 0], [C.a40 + 0.5, 0], [C.dobro, 0.55], [C.semDesarmar + 0.6, 0.85], [C.fusivel, 1.05], [C.parede, 1.4], [C.norma, 1.4], [C.norma + 0.7, 0]];
      // Fio terra da lavanderia: some em "sem terra" e é refeito na camada 3
      const GRD = [[0, 1], [C.semTerra, 1], [C.semTerra + 0.45, 0], [C.fioTerra, 0], [C.fioTerra + 1.3, 1]];
      // Etiquetas nos disjuntores
      const TAGS = [[0, 0], [C.etiqueta, 0], [C.etiqueta + 0.6, 1], [C.loop + 1.2, 1], [C.loop + 1.5, 0]];
      // Faíscas: carcaça (sem terra), DPS (surto) e cabo dentro da parede (mito)
      const CH = (dx, dy) => [MAQ.x + dx, MAQ.y + dy, MAQ.z + 0.31];
      BURSTS.push(
        { t0: C.carcaca + 0.15, o: CH(0.28, 0.2), dir: [1, 0.4, 0.5], spread: 0.9, speed: 1.6, n: 14, life: 0.5, stagger: 0.05, seed: 11, size: 0.8 },
        { t0: C.energizada + 0.05, o: CH(-0.28, 0.32), dir: [-1, 0.5, 0.5], spread: 0.9, speed: 1.7, n: 14, life: 0.5, stagger: 0.05, seed: 23, size: 0.8 },
        { t0: C.energizada + 0.75, o: CH(0.15, -0.36), dir: [0.4, 0.6, 1], spread: 0.8, speed: 1.6, n: 12, life: 0.45, stagger: 0.05, seed: 37, size: 0.8 },
        { t0: C.dps + 0.32, o: [DPS[0].x, ROW_A + 0.01, RAIL_Z + 0.095], dir: [0.3, 0.6, 1], spread: 0.8, speed: 1.5, n: 16, life: 0.45, stagger: 0.04, seed: 51, size: 0.75 },
        { t0: C.fusivel + 0.15, o: [HOT.x, HOT.y, WZ + 0.04], dir: [0, 0.4, 1], spread: 0.9, speed: 2.2, n: 26, life: 0.75, stagger: 0.1, seed: 63, size: 0.9 },
        { t0: C.fusivel + 0.9, o: [HOT.x + 0.08, HOT.y, WZ + 0.04], dir: [0.2, 0.3, 1], spread: 0.9, speed: 2.0, n: 20, life: 0.7, stagger: 0.1, seed: 71, size: 0.9 },
        { t0: C.parede - 0.05, o: [HOT.x, HOT.y, WZ + 0.05], dir: [0, 0.25, 1], spread: 1.1, speed: 3.4, n: 46, life: 1.1, stagger: 0.12, seed: 83, size: 1.1 },
        { t0: C.parede + 0.5, o: [HOT.x - 0.06, HOT.y, WZ + 0.05], dir: [-0.2, 0.3, 1], spread: 1.0, speed: 2.6, n: 36, life: 0.9, stagger: 0.15, seed: 97, size: 1.0 },
      );
      const bChassisA = makeBolt(14, 2.5, 9, "#ff6b6b");
      const bChassisB = makeBolt(12, 2.2, 8, "#93c5fd");
      const bArc = makeBolt(18, 3.5, 16, "#7cc4ff");
      const bArc2 = makeBolt(14, 2.6, 11, "#a5b4fc");
      const SPEED = (lo, hi, keys) => (x) => lerp(lo, hi, track(x, keys));
      const lavSpeed = SPEED(0.45, 1.6, [[0, 0], [C.esquenta, 0], [C.esquenta + 0.6, 0.6], [C.fuga, 0.6], [C.fuga + 0.4, 0], [C.dobro - 0.2, 0], [C.dobro + 0.6, 0.85], [C.fusivel, 1], [C.norma + 0.4, 1], [C.norma + 0.9, 0]]);
      const flowT0 = new Map();

      // Pontos-alvo das mãos
      const handleW = () => worldOf(lidPanel, -QW / 2 + 0.05, 0, 0.03);
      const toward = (from, to, back) => {
        const a = new THREE.Vector3(...from);
        const b = new THREE.Vector3(...to);
        return b.clone().addScaledVector(b.sub(a).normalize(), -back).toArray();
      };
      const shoulderW = (arm) => worldOf(arm.shoulder, 0, 0, 0);
      const hipsW = (x, y, z) => worldOf(elet.userData.hips, x, y, z);

      // ---------- Render de um quadro a partir de t ----------
      return function render(t) {
        const cam = cameraAt(t);
        // Tremor curto no arco do mito
        const shake = 0.012 * pulse(t, C.parede - 0.05, C.parede + 0.5);
        camera.position.set(cam.p[0] + shake * Math.sin(t * 91), cam.p[1] + shake * Math.sin(t * 77 + 1), cam.p[2]);
        camera.lookAt(cam.q[0], cam.q[1], cam.q[2]);
        camera.updateMatrixWorld(true);

        // Tampa, geral e DR
        lid.rotation.y = track(t, LID);
        const ger = track(t, GER);
        const drl = track(t, DRL);
        GERAL.set(ger);
        DR.set(drl);
        drBtn.position.z = DR_BTN_Z - 0.007 * (t >= C.teste - 0.15 && t < C.teste + 0.15 ? 1 : 0);
        drT.position.z = drBtn.position.z + 0.0065;
        const gerOn = ger > 0.5 ? 1 : 0;
        const live = gerOn && drl > 0.5 ? 1 : 0;

        // Troca do disjuntor (prática errada, sozinha): o de 20 A sai, entra o de 40 A, e volta ao certo na norma
        const swapOut = prog(t, C.a40 - 0.7, C.a40 - 0.35);
        const swapIn = prog(t, C.a40 - 0.3, C.a40 + 0.1);
        const swapBack = prog(t, C.norma + 0.2, C.norma + 0.6);
        const swapped = t >= C.a40 - 0.35 && t < C.norma + 0.4;
        LAV.face.material.map = swapped ? TEX40 : TEX20;
        const outZ = swapped ? 0.18 * (1 - easeOut(swapIn)) + 0.1 * swapBack : 0.18 * easeInOut(swapOut) * (t < C.a40 ? 1 : 0);
        LAV.g.position.z = RAIL_Z + outZ;
        LAV.set(1);
        // "Sem desarmar": a alavanca treme mas não cai
        if (t > C.semDesarmar - 0.2 && t < C.semDesarmar + 0.9) LAV.pivot.rotation.x = ON_ROT + 0.08 * Math.sin(t * 40) * pulse(t, C.semDesarmar - 0.2, C.semDesarmar + 0.9);

        // Destaques (camada 1)
        const sel = track(t, [[C.cabo25, 0], [C.cabo25 + 0.4, 1], [C.d20 - 0.3, 1], [C.d20 + 0.2, 0]]);
        const sel20 = track(t, [[C.d20 - 0.3, 0], [C.d20 + 0.1, 1], [C.c2, 1], [C.c2 + 0.3, 0]]);
        LAV.face.material.emissive = LAV.face.material.emissive || new THREE.Color();
        LAV.face.material.emissive.set(swapped ? "#ff3030" : "#22c55e");
        LAV.face.material.emissiveIntensity = swapped ? 0.6 + 0.4 * Math.sin(t * 10) : 1.4 * sel20;

        // Calor do cabo
        const heat = track(t, HEAT);
        const hot = Math.min(1, heat);
        const cBase = new THREE.Color("#1b1d22");
        phaseMat.color.copy(cBase).lerp(new THREE.Color(heat > 1 ? "#5a1d0c" : "#8a3b12"), hot * 0.8);
        phaseMat.emissive.set(sel > 0.02 && heat < 0.05 ? "#4aa3ff" : heat > 1 ? "#ff2a00" : "#ff5a00");
        phaseMat.emissiveIntensity = heat > 0.02 ? 0.6 + 2.6 * hot + 1.6 * Math.max(0, heat - 1) + 0.3 * Math.sin(t * 9) * hot : 1.1 * sel;
        condLav.material.emissive = condLav.material.emissive || new THREE.Color();
        condLav.material.emissive.set("#ff6a1a");
        condLav.material.emissiveIntensity = 0.5 * Math.max(0, heat - 0.9);
        fireLight.position.set(HOT.x, HOT.y - 0.1, WZ + 0.75);
        fireLight.intensity = 0.4 * Math.max(0, heat - 0.5) * (0.85 + 0.15 * Math.sin(t * 23));
        scorch.material.opacity = 0.9 * prog(heat, 1.1, 1.4) * (1 - prog(t, C.norma + 0.2, C.norma + 0.9));

        // Fluxo de energia (velocidade integrada no tempo)
        const T = (spd) => spd * 9;
        const sLav = integ(t, lavSpeed);
        const emph = 0.55 + 0.45 * track(t, [[C.seguro - 0.2, 0], [C.seguro + 0.3, 1], [C.camadas, 1], [C.camadas + 0.5, 0], [C.cabo - 0.2, 0], [C.cabo + 0.3, 1], [C.fuga, 1], [C.fuga + 0.4, 0], [C.dobro - 0.3, 0], [C.dobro + 0.3, 1], [C.norma, 1], [C.norma + 0.5, 0]]);
        const lavColor = heat > 0.98 ? "#ff3b1a" : heat > 0.35 ? "#ff8a1a" : sel > 0.3 ? "#7cc4ff" : "#ffd24a";
        fF1.set(0.55 * emph, T(t * 0.45));
        fF2.set(0.55 * emph, T(t * 0.45 + 0.3));
        fJ1.set(0.55 * emph * gerOn, T(t * 0.45));
        fJ2.set(0.55 * emph * live, T(t * 0.45));
        fLav.set((0.6 * emph + 0.5 * hot) * live, sLav * 8, lavColor);
        fCord.set(0.45 * emph * live, T(t * 0.4));
        fNeu.set(0.35 * emph * live * track(t, [[C.c1, 0], [C.c1 + 0.3, 0], [C.cabo25, 0], [C.cabo25 + 0.4, 1], [C.d20, 1], [C.d20 + 0.3, 0]]), -T(t * 0.4));

        // Fuga para a carcaça (sem terra) e pele eletrificada
        const leak = track(t, [[C.fuga, 0], [C.fuga + 0.3, 1], [C.c1 - 0.2, 1], [C.c1 + 0.1, 0]]);
        fLeak.set(1.1 * leak, T(t * 0.6));
        const carc = track(t, [[C.fuga + 0.2, 0], [C.fuga + 0.8, 0.35], [C.carcaca - 0.2, 0.4], [C.carcaca + 0.3, 1], [C.c1 - 0.2, 1], [C.c1 + 0.1, 0]]);
        chassisSkinMat.uniforms.uT.value = t;
        chassisSkinMat.uniforms.uI.value = carc * (0.75 + 0.25 * Math.sin(t * 13));
        chassisSkin.visible = carc > 0.01;
        chassisMat.emissiveIntensity = 0.18 * carc * (0.6 + 0.4 * Math.abs(Math.sin(t * 6)));
        chassisLight.position.set(MAQ.x + 0.2, MAQ.y + 0.3, MAQ.z + 0.7);
        chassisLight.intensity = 0.4 * carc * (0.7 + 0.3 * Math.sin(t * 17));
        // Arcos curtos pulando na carcaça (mudam 15 vezes por segundo)
        const cs = Math.floor(t * 15);
        const crack = carc > 0.6 ? 1 : 0;
        const onA = crack && hash(cs * 1.3) > 0.35;
        const onB = crack && hash(cs * 2.7 + 5) > 0.5;
        const pt = (s) => CH((hash(s) - 0.5) * 0.52, (hash(s + 1) - 0.5) * 0.74);
        setBolt(bChassisA, pt(cs * 3.1), pt(cs * 3.1 + 7), cs * 1.7, 0.06, onA ? 1 : 0);
        setBolt(bChassisB, pt(cs * 4.3 + 2), pt(cs * 4.3 + 11), cs * 2.9 + 4, 0.05, onB ? 0.9 : 0);

        // Máquina: tambor girando e painel aceso só com energia
        const spin = integ(t, (x) => (track(x, DRL) > 0.5 && track(x, GER) > 0.5 ? 6 : 0));
        clothes.forEach((cl, i) => {
          const a = spin + (i / clothes.length) * Math.PI * 2;
          cl.position.set(MAQ.x + Math.cos(a) * 0.08, MAQ.y - 0.05 + Math.sin(a) * 0.08 - 0.03, MAQ.z + 0.318);
          cl.rotation.z = a;
        });
        dispMat.emissiveIntensity = live ? 1.6 : 0.05;

        // Fio terra: some e volta crescendo; fluxo verde depois de refeito
        const grd = track(t, GRD);
        GND.geo.setDrawRange(0, Math.floor((GND_IDX * grd) / 6) * 6);
        GND.mesh.visible = grd > 0.002;
        GND.mesh.material.emissive = GND.mesh.material.emissive || new THREE.Color();
        GND.mesh.material.emissive.set("#22c55e");
        GND.mesh.material.emissiveIntensity = t >= C.fioTerra && t < C.dps ? 0.8 * (1 - prog(t, C.circuitos, C.dps)) : 0;
        fGnd.u.uDraw.value = grd;
        const gOn = track(t, [[C.fioTerra + 0.9, 0], [C.fioTerra + 1.4, 1], [C.dps - 0.3, 1], [C.dps, 0]]);
        fGnd.set(1.0 * gOn, -T(t * 0.5));

        // DPS: surto chega pela entrada, o DPS conduz para a barra de terra e para a haste
        const s0 = C.dps - 0.15;
        const headIn = prog(t, s0, s0 + 0.32);
        fF1.u.uHead.value = headIn * F1.L;
        fF1.u.uHeadI.value = 9 * pulse(t, s0 - 0.02, s0 + 0.36);
        fF1.u.uColor.value.set("#ffd24a").multiplyScalar(fF1.k);
        fDpsIn.set(0, 0);
        fDpsIn.u.uHead.value = prog(t, s0 + 0.3, s0 + 0.45) * DPSIN.L;
        fDpsIn.u.uHeadI.value = 9 * pulse(t, s0 + 0.28, s0 + 0.48);
        fDpsIn.mesh.visible = fDpsIn.u.uHeadI.value > 0.01;
        const after = track(t, [[s0 + 0.45, 0], [s0 + 0.6, 1], [C.etiqueta - 0.4, 1], [C.etiqueta, 0]]);
        fDpsOut.set(1.2 * after, -T(t * 0.6));
        fDpsOut.u.uHead.value = prog(t, s0 + 0.45, s0 + 0.65) * DPSOUT.L;
        fDpsOut.u.uHeadI.value = 8 * pulse(t, s0 + 0.43, s0 + 0.68);
        fDpsOut.mesh.visible = after > 0.01 || fDpsOut.u.uHeadI.value > 0.01;
        fEarth.set(1.2 * after, T(t * 0.6));
        fEarth.u.uHead.value = prog(t, s0 + 0.62, s0 + 1.0) * EARTH.L;
        fEarth.u.uHeadI.value = 8 * pulse(t, s0 + 0.6, s0 + 1.05);
        fEarth.mesh.visible = after > 0.01 || fEarth.u.uHeadI.value > 0.01;
        const dpsHit = pulse(t, s0 + 0.4, s0 + 0.75);
        dpsWinMat.color.set(dpsHit > 0.2 ? "#ffffff" : "#22c55e");
        dpsWinMat.emissive.set(dpsHit > 0.2 ? "#c4b5fd" : "#22c55e");
        dpsWinMat.emissiveIntensity = 0.4 + 6 * dpsHit + (t > s0 && t < C.etiqueta ? 1.2 : 0);
        dpsLight.position.set(DPS[0].x, ROW_A, RAIL_Z + 0.3);
        dpsLight.intensity = 0.5 * dpsHit;

        // Etiquetas
        const tags = track(t, TAGS);
        CIRC.forEach((m, i) => {
          const k = clamp01(tags * 1.6 - i * 0.2);
          m.tag.visible = k > 0.01;
          m.tag.scale.setScalar(Math.max(0.01, spring(k)));
        });

        // Arco do mito dentro do conduíte (fase-neutro) e no DPS
        const ms = Math.floor(t * 18);
        const arcI = Math.max(
          t > C.fusivel && t < C.parede ? (hash(ms * 1.9) > 0.45 ? 0.8 : 0) : 0,
          t >= C.parede - 0.08 && t < C.parede + 1.6 ? (hash(ms * 2.3) > 0.2 ? 1 : 0.3) * (1 - prog(t, C.parede + 0.6, C.parede + 1.6)) : 0,
        );
        const big = t >= C.parede - 0.08 && t < C.parede + 1.6;
        const ax = HOT.x + (hash(ms) - 0.5) * 0.08;
        setBolt(bArc, [ax - (big ? 0.16 : 0.07), RUN_Y - 0.002, WZ + 0.01], [ax + (big ? 0.16 : 0.07), RUN_Y + 0.022, WZ + 0.01], ms * 1.3, big ? 0.16 : 0.06, arcI);
        setBolt(bArc2, [ax, RUN_Y + 0.01, WZ + 0.02], [ax + (hash(ms * 3.3) - 0.5) * 0.3, RUN_Y + 0.12 + hash(ms * 4.1) * 0.12, WZ + 0.05], ms * 2.1 + 3, 0.1, big ? arcI * 0.8 : 0);
        if (dpsHit > 0.3) {
          const tp = DPS[0].top();
          setBolt(bArc, [tp[0], tp[1] - 0.02, tp[2] + 0.07], [tp[0] + 0.01, tp[1] - 0.17, tp[2] + 0.07], ms * 5.1, 0.03, dpsHit);
        }
        arcLight.position.set(dpsHit > 0.3 ? DPS[0].x : HOT.x, dpsHit > 0.3 ? ROW_A : RUN_Y - 0.1, WZ + 0.85);
        arcLight.intensity = 1.1 * Math.max(arcI, dpsHit * 0.6);
        const flash = Math.max(0.3 * pulse(t, C.parede - 0.06, C.parede + 0.12), 0.08 * (big && hash(ms * 7.7) > 0.75 ? 1 : 0));
        document.getElementById("world-flash").style.opacity = String(flash);
        bloom.strength = 0.45 + 0.25 * Math.max(arcI, dpsHit) + 0.2 * carc;
        updateSmoke(t, [HOT.x, HOT.y, WZ], Math.max(0.35 * prog(heat, 0.45, 0.75), prog(heat, 0.95, 1.3)) * (1 - prog(t, C.norma + 0.3, C.norma + 1.2)), 0.45);
        updateSparks(t);

        // ---------- Eletricista ----------
        const ep = posAt(t);
        const yp = yawTo(ep);
        const yaw = t >= C.quadro2 + 0.5 && t < C.cta ? yp : track(t, [
          [0, yawPanel], [C.cliente + 0.3, yawPanel], [C.pode + 0.1, yawCam], [C.quadro2 - 0.3, yawCam], [C.quadro2 + 0.5, yawTo(posAt(C.quadro2 + 0.5))],
          [C.cta, yawTo(FAR)], [C.cta + 0.7, yawCam], [C.ecasi - 0.2, yawCam], [C.ecasi + 0.6, yawBack],
          [C.loop, yawBack], [C.loop + 1.2, yawPanel],
        ]);
        const ep2 = posAt(t - 0.05);
        const walk = Math.min(1, Math.hypot(ep[0] - ep2[0], ep[2] - ep2[2]) / 0.03);
        // Andando, olha para onde vai
        const epN = posAt(t + 0.08);
        const mvYaw = Math.atan2(epN[0] - ep2[0], epN[2] - ep2[2]);
        elet.position.fromArray(ep);
        elet.rotation.y = walk > 0.02 ? angLerp(yaw, mvYaw, Math.min(1, walk * 1.6) * 0.85) : yaw;
        const sw = animateBody(elet, t, walk, 0.7);
        idleArms(elet, sw);
        const head = elet.userData.head;
        // "Ainda não": balança a cabeça; acompanha a câmera na chamada final
        head.rotation.y = 0.32 * Math.sin((t - C.ainda) * 14) * pulse(t, C.ainda, C.ainda + 0.9);
        head.rotation.x = -0.05 * pulse(t, C.pode, C.ainda);

        // Mão esquerda: fecha e abre a tampa, desliga e religa o geral, acena na chamada final
        // Regra da série: com o quadro energizado ele só fecha a tampa por fora; a tampa abre sozinha (raio-x)
        const lidK = Math.max(track(t, [[0, 1], [1.05, 1], [1.4, 0]]), track(t, [[C.end - 1.4, 0], [C.end - 1.0, 1], [C.end, 1]]));
        const gK = Math.max(
          track(t, [[C.desenergizar - 0.35, 0], [C.desenergizar + 0.12, 1], [C.desenergizar + 0.45, 1], [C.desenergizar + 0.85, 0]]),
          track(t, [[C.curso, 0], [C.curso + 0.38, 1], [C.curso + 0.62, 1], [C.curso + 0.95, 0]]),
        );
        const waveK = track(t, [[C.treinamento, 0], [C.treinamento + 0.45, 1], [C.ecasi - 0.4, 1], [C.ecasi + 0.1, 0]]);
        const shrug = track(t, [[C.pode + 0.05, 0], [C.pode + 0.4, 1], [C.ainda - 0.1, 1], [C.ainda + 0.35, 0]]);
        if (lidK > 0.001) reach(elet, armL, toward(shoulderW(armL), handleW(), 0.04), lidK);
        else if (gK > 0.001) reach(elet, armL, toward(shoulderW(armL), worldOf(GERAL.lev, 0, 0.02, 0.01), 0.045), gK);
        else if (waveK > 0.001) reach(elet, armL, hipsW(0.36 + 0.05 * Math.sin(t * 9), 0.98, 0.14), waveK);
        if (shrug > 0.001) {
          reach(elet, armL, hipsW(0.38, 0.3, 0.24), shrug, new THREE.Vector3(1, -0.6, -1));
          reach(elet, armR, hipsW(-0.38, 0.3, 0.24), shrug, new THREE.Vector3(-1, -0.6, -1));
        }
        // Mão direita: aperta o T (pela frente; o DR religa sozinho); depois segura o detector de tensão
        const tK = track(t, [[C.aperte - 0.25, 0], [C.aperte + 0.45, 1], [C.teste + 0.3, 1], [C.desarmou + 0.25, 0]]);
        const detShow = track(t, [[C.desenergizar + 0.2, 0], [C.desenergizar + 0.7, 1], [C.cta + 0.1, 1], [C.cta + 0.5, 0]]);
        det.visible = detShow > 0.01;
        det.scale.setScalar(Math.max(0.001, spring(detShow)));
        const dK = track(t, [[C.antesNr - 0.3, 0], [C.antesNr + 0.25, 1], [C.curso + 0.5, 1], [C.cta - 0.2, 0]]);
        const pressIn = t >= C.teste - 0.15 && t < C.teste + 0.15 ? 0.012 : -0.035;
        if (tK > 0.001) reach(elet, armR, toward(shoulderW(armR), worldOf(drBtn, 0, 0, 0.012), 0.05 + pressIn), tK);
        else if (dK > 0.001) reach(elet, armR, toward(shoulderW(armR), worldOf(LAV.g, 0, -0.075, 0.056), 0.2), dK);
        // Detector: sem tensão (geral desligado) o LED fica verde
        det.userData.led.emissive.set("#22c55e");
        det.userData.led.emissiveIntensity = dK > 0.9 ? 3.5 + 1.5 * Math.sin(t * 12) : 1.5;

        composer.render(1 / FPS);
        placeCallouts(t);
      };
    }

    // Relógio: um tween do GSAP alimenta render(t). A linha do tempo só é registrada depois que as fontes e os
    // logos da ECASI carregaram, para o uniforme nunca aparecer sem o logo.
    const loader = new THREE.TextureLoader();
    Promise.all([document.fonts.ready, loader.loadAsync("assets/brand/logo-fundo-escuro.png"), loader.loadAsync("assets/brand/simbolo-ecasi.png")]).then(([, backTex, symTex]) => {
      for (const tx of [backTex, symTex]) {
        tx.colorSpace = THREE.SRGBColorSpace;
        tx.anisotropy = 8;
      }
      const render = build(backTex, symTex);
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: C.end, duration: C.end, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["world"] = tl;
    });
  </script>
</template>
