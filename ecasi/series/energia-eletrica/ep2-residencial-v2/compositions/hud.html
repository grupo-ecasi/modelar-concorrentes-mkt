      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, a);
      tl.fromTo(el.querySelector(".n"), { scale: 0.55, opacity: 0, filter: "blur(14px)", transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, a);
      tl.fromTo(el.querySelector(".t"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, a + 0.22);
      tl.fromTo(el.querySelector(".s"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, a + 0.36);
      tl.to(el, { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
      tl.set(el, { visibility: "hidden" }, b);
    }
    function count(sel, to, at, dur = 0.8, fmt = (v) => String(Math.round(v))) {
      const p = { v: 0 };
      tl.fromTo(p, { v: 0 }, { v: to, duration: dur, ease: "power2.out", onUpdate: () => ($(sel).textContent = fmt(p.v)) }, at);
    }
    function bar(sel, at, dur = 0.6) {
      tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: "power3.out" }, at);
    }
    const CHIP = {
      off: { backgroundColor: "#ffffff", borderColor: "#e5e7eb", color: "#6b7280" },
      on: { backgroundColor: "#c2410c", borderColor: "#c2410c", color: "#ffffff" },
      done: { backgroundColor: "#fff1e6", borderColor: "#fed7b5", color: "#c2410c" },
    };
    function chip(n, state, at) {
      tl.to("#hud-chip" + n, { ...CHIP[state], duration: 0.3, ease: "power2.inOut" }, at);
    }
    function vignette(a, b, peak = 1) {
      tl.to("#hud-vig", { opacity: peak, duration: 0.5, ease: "power2.out" }, a);
      tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, b - 0.6);
    }
    function room(n, at) {
      tl.to("#hud-r" + n, { backgroundColor: "#fff1e6", borderColor: "#f97316", color: "#c2410c", duration: 0.25, ease: "power2.out" }, at);
      tl.fromTo("#hud-r" + n, { scale: 0.94 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, at);
    }

    // Abertura (o primeiro quadro já mostra o título, para o loop emendar)
    tl.set("#hud-hook", { opacity: 1 }, 0);
    tl.set("#hud-vig", { opacity: 0.7 }, 0);
    tl.to("#hud-hook", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, C.ainda - 0.12);
    tl.set("#hud-hook", { visibility: "hidden" }, C.ainda + 0.1);
    tl.fromTo("#hud-ainda", { opacity: 0, scale: 1.25, filter: "blur(12px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, C.ainda);
    tl.to("#hud-ainda", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, C.quadro2 - 0.1);
    tl.set("#hud-ainda", { visibility: "hidden" }, C.quadro2 + 0.1);
    tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, C.camadas);
    show("#hud-live", C.quadro2 + 0.1, C.camadas - 0.1);

    // Barra 1-2-3: entra em "três camadas"
    [1, 2, 3].forEach((n, i) => {
      tl.fromTo("#hud-chip" + n, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER }, C.camadas + i * 0.12);
    });
    chip(1, "on", C.c1);
    chip(1, "done", C.c2);
    chip(2, "on", C.c2);
    chip(2, "done", C.c3);
    chip(3, "on", C.c3);
    chip(3, "done", C.mito);
    tl.to("#hud-chips", { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, C.cta - 0.1);
    tl.fromTo("#hud-chips", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER, immediateRender: false }, C.loop + 0.1);
    chip(1, "on", C.confira + 0.64);
    chip(2, "on", C.confira + 0.8);
    chip(3, "on", C.confira + 1.04);

    // Problema: calor no PVC, fuga e falta de terra
    show("#hud-c70", C.pvc - 0.2, C.fuga - 0.1);
    count("#hud-v70", 70, C.g70 - 0.2);
    show("#hud-cleak", C.mili - 0.1, C.semTerra - 0.1);
    show("#hud-cterra", C.semTerra, C.c1);
    vignette(C.carcaca, C.c1 + 0.2, 0.75);

    // Camada 1
    section("#hud-s1", C.c1, C.escolhido - 0.2);
    show("#hud-q1", C.escolhido - 0.2, C.cabo25 - 0.1);
    show("#hud-c24", C.cabo25 - 0.1, C.entao - 0.1);
    count("#hud-v24", 24, C.a24 - 0.1);
    show("#hud-c20", C.entao - 0.1, C.c2);

    // Camada 2
    section("#hud-s2", C.c2, C.ma30 - 0.1);
    show("#hud-rooms", C.ma30 - 0.1, C.externa + 0.6);
    room(1, C.banheiro - 0.05);
    room(2, C.cozinha - 0.05);
    room(3, C.lavanderia - 0.05);
    room(4, C.externa - 0.05);
    show("#hud-qt", C.externa + 0.6, C.desarmou - 0.1);
    show("#hud-cno", C.desarmou - 0.1, C.c3);

    // Camada 3
    section("#hud-s3", C.c3, C.fioTerra - 0.2);
    show("#hud-t1", C.fioTerra - 0.2, C.mito);
    show("#hud-t2", C.dps - 0.15, C.mito);
    show("#hud-t3", C.etiqueta - 0.15, C.mito);

    // Mito: disjuntor maior no mesmo cabo
    show("#hud-alert", C.mito, C.norma, { dur: 0.45 });
    show("#hud-cneq", C.poe - 0.1, C.a40 - 0.2);
    tl.fromTo("#hud-nao", { opacity: 0, scale: 1.3, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, C.naoMito);
    show("#hud-cmp2", C.a40 - 0.2, C.norma);
    bar("#hud-b-bad", C.a40, 0.8);
    count("#hud-v40", 40, C.a40, 0.8);
    bar("#hud-b-ok", C.cabo24 - 0.1, 0.6);
    tl.fromTo("#hud-17x", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: ENTER }, C.dobro - 0.1);
    vignette(C.fusivel - 0.2, C.norma + 0.2, 0.85);

    // Norma
    show("#hud-norma-head", C.norma + 0.2, C.cta);
    show("#hud-k1", C.norma + 0.5, C.cta);
    show("#hud-k2", C.nr10 - 0.1, C.cta);
    show("#hud-k3", C.curso - 0.1, C.cta);

    // Fecho: a vinheta volta aos poucos para emendar com o primeiro quadro
    tl.set("#hud-end", { opacity: 1, visibility: "visible" }, C.confira - 0.05);
    tl.fromTo("#hud-end1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.confira);
    tl.fromTo("#hud-end2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.confira + 0.8);
    tl.fromTo("#hud-end3", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.antes);
    tl.to("#hud-vig", { opacity: 0.7, duration: 1.2, ease: "power1.inOut" }, C.end - 1.4);

    window.__timelines["hud"] = tl;
  </script>
</template>
