        const [tb, vb] = keys[i + 1];

    // Caminho com cantos arredondados (fios dobrados de verdade)
    function bendPath(pts, r = 0.02) {
      const P = pts.map((p) => new THREE.Vector3(...p));
      const path = new THREE.CurvePath();
      let cur = P[0].clone();
      for (let i = 1; i < P.length - 1; i++) {
        const a = P[i - 1];
        const b = P[i];
        const c = P[i + 1];
        const l1 = b.distanceTo(a);
        const l2 = c.distanceTo(b);
        const rr = Math.min(r, l1 / 2, l2 / 2);
        const p1 = b.clone().addScaledVector(b.clone().sub(a).normalize(), -rr);
        const p2 = b.clone().addScaledVector(c.clone().sub(b).normalize(), rr);
        if (cur.distanceTo(p1) > 1e-5) path.add(new THREE.LineCurve3(cur.clone(), p1));
        path.add(new THREE.QuadraticBezierCurve3(p1, b.clone(), p2));
        cur = p2;
      }
      path.add(new THREE.LineCurve3(cur, P[P.length - 1]));
      return path;
    }
    function wire(pts, m, r = 0.0058, bend = 0.018) {
      const path = bendPath(pts, bend);
      const L = path.getLength();
      const geo = new THREE.TubeGeometry(path, Math.max(24, Math.round(L * 180)), r, 8, false);
      if (m.map) {
        m = m.clone();
        m.map = m.map.clone();
        m.map.repeat.set(L / 0.035, 1);
        m.map.needsUpdate = true;
      }
      const mesh = shade(new THREE.Mesh(geo, m));
      scene.add(mesh);
      return { mesh, path, geo, L, r };
    }

    // ---------- Energia: tubo de fluxo (pulsos que correm pelo fio, com brilho) ----------
    const FLOW_VS = `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`;
    const FLOW_FS = `uniform float uT; uniform float uI; uniform float uDens; uniform float uLen; uniform vec3 uColor; uniform float uHead; uniform float uHeadI; uniform float uDraw; uniform float uBase;
      varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){
        if (vUv.x > uDraw) discard;
        float s = vUv.x * uLen;
        float f = fract(s * uDens - uT);
        float dash = smoothstep(0.0, 0.1, f) * (1.0 - smoothstep(0.28, 0.55, f));
        float facing = abs(dot(normalize(vN), normalize(vV)));
        float body = 0.3 + 0.7 * facing;
        float head = uHeadI * exp(-pow((s - uHead) / 0.06, 2.0));
        float e = uI * (uBase + dash) * body + head * (0.5 + 0.5 * facing);
        gl_FragColor = vec4(uColor * e, 1.0);
      }`;
    const flows = [];
    function flowOn(w, color, k = 2.6, dens = 9, scaleR = 1.55) {
      const geo = new THREE.TubeGeometry(w.path, w.geo.parameters.tubularSegments, w.r * scaleR, 8, false);
      const mt = new THREE.ShaderMaterial({
        uniforms: {
          uT: { value: 0 },
          uI: { value: 0 },
          uDens: { value: dens },
          uLen: { value: w.L },
          uColor: { value: new THREE.Color(color).multiplyScalar(k) },
          uHead: { value: -9 },
          uHeadI: { value: 0 },
          uDraw: { value: 1 },
          uBase: { value: 0.12 },
        },
        vertexShader: FLOW_VS,
        fragmentShader: FLOW_FS,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const mesh = new THREE.Mesh(geo, mt);
      mesh.renderOrder = 6;
      mesh.frustumCulled = false;
      scene.add(mesh);
      const f = { mesh, u: mt.uniforms, L: w.L, k, set(i, T, col) {
        mesh.visible = i > 0.002 || mt.uniforms.uHeadI.value > 0.002;
        mt.uniforms.uI.value = i;
        mt.uniforms.uT.value = T;
        if (col) mt.uniforms.uColor.value.set(col).multiplyScalar(k);
      } };
      flows.push(f);
      return f;
    }

    // ---------- Energia: superfície eletrificada (linhas que andam sobre a carcaça) ----------
    const SKIN_FS = `uniform float uT; uniform float uI; uniform vec3 uColor; varying vec3 vP; varying vec3 vN; varying vec3 vV;
      float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float n(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(h(i), h(i + vec2(1.0, 0.0)), u.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), u.x), u.y); }
      void main(){
        vec2 p = vP.xy * 7.0 + vP.zy * 5.0 + vP.xz * 3.0;
        float a = n(p + vec2(uT * 2.3, -uT * 1.7)) * 0.65 + n(p * 2.3 - vec2(uT * 4.1, uT * 2.9)) * 0.35;
        float lines = 1.0 - smoothstep(0.0, 0.035, abs(a - 0.52));
        float rim = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.2);
        float flick = 0.65 + 0.35 * sin(uT * 37.0) * sin(uT * 23.0 + 1.3);
        gl_FragColor = vec4(uColor * (lines * 2.6 * flick + rim * 0.9) * uI, 1.0);
      }`;
    function skinMat(color) {
      return new THREE.ShaderMaterial({
        uniforms: { uT: { value: 0 }, uI: { value: 0 }, uColor: { value: new THREE.Color(color) } },
        vertexShader: `varying vec3 vP; varying vec3 vN; varying vec3 vV;
          void main(){ vP = position; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: SKIN_FS,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
    }

    // ---------- Energia: arco elétrico (raio ramificado, núcleo branco e halo azul) ----------
    const bolts = [];
    function makeBolt(N, coreW, glowW, glowColor) {
      const mk = (w, col, op) => {
        const geo = new LineGeometry();
        geo.setPositions(new Float32Array(N * 3));
        const m = new LineMaterial({ color: col, linewidth: w, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending });
        m.resolution.set(W, H);
        const l = new Line2(geo, m);
        l.frustumCulled = false;
        l.renderOrder = 10;
        l.visible = false;
        scene.add(l);
        return l;
      };
      const b = { N, glow: mk(glowW, new THREE.Color(glowColor).multiplyScalar(0.8), 0.6), core: mk(coreW, new THREE.Color(1.8, 1.9, 2.3), 1) };
      bolts.push(b);
      return b;
    }
    const vA = new THREE.Vector3();
    const vB = new THREE.Vector3();
    const vD = new THREE.Vector3();
    const vU = new THREE.Vector3();
    const vWp = new THREE.Vector3();
    const UPV = new THREE.Vector3(0, 1, 0);
    function setBolt(b, a, c, seed, amp, inten) {
      if (inten <= 0.01) {
        b.core.visible = b.glow.visible = false;
        return;
      }
      vA.fromArray(a);
      vB.fromArray(c);
      vD.subVectors(vB, vA);
      vU.crossVectors(vD, Math.abs(vD.y) > 0.9 * vD.length() ? new THREE.Vector3(1, 0, 0) : UPV).normalize();
      vWp.crossVectors(vD, vU).normalize();
      const pts = [];
      for (let i = 0; i < b.N; i++) {
        const s = i / (b.N - 1);
        const env = Math.sin(Math.PI * s);
        // grosso (4 controles interpolados) + fino (por ponto)
        const cs = s * 4;
        const ci = Math.floor(cs);
        const cf = cs - ci;
        const c1 = lerp(hash(seed + ci * 3.1) - 0.5, hash(seed + (ci + 1) * 3.1) - 0.5, cf);
        const c2 = lerp(hash(seed + ci * 5.7 + 9) - 0.5, hash(seed + (ci + 1) * 5.7 + 9) - 0.5, cf);
        const f1 = (hash(seed + i * 7.3 + 1) - 0.5) * 0.45;
        const f2 = (hash(seed + i * 9.1 + 2) - 0.5) * 0.45;
        const o1 = (c1 + f1) * amp * env;
        const o2 = (c2 + f2) * amp * env;
        pts.push(vA.x + vD.x * s + vU.x * o1 + vWp.x * o2, vA.y + vD.y * s + vU.y * o1 + vWp.y * o2, vA.z + vD.z * s + vU.z * o1 + vWp.z * o2);
      }
      for (const l of [b.core, b.glow]) {
        const arr = l.geometry.attributes.instanceStart.data.array;
        for (let i = 0; i < b.N - 1; i++) {
          for (let j = 0; j < 3; j++) {
            arr[i * 6 + j] = pts[i * 3 + j];
            arr[i * 6 + 3 + j] = pts[(i + 1) * 3 + j];
          }
        }
        l.geometry.attributes.instanceStart.data.needsUpdate = true;
        l.visible = true;
      }
      b.core.material.opacity = Math.min(1, inten);
      b.glow.material.opacity = 0.6 * Math.min(1, inten);
      return pts;
    }

    // ---------- Energia: faíscas balísticas (determinísticas, quicam no piso) ----------
    const SPARK_N = 220;
    const sparks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.0055, 0.0055, 1), new THREE.MeshBasicMaterial({ color: "#ffffff" }), SPARK_N);
    sparks.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(SPARK_N * 3), 3);
    sparks.frustumCulled = false;
    sparks.renderOrder = 9;
    scene.add(sparks);
    const BURSTS = [];
    const dum = new THREE.Object3D();
    const ZAX = new THREE.Vector3(0, 0, 1);
    const sV = new THREE.Vector3();
    const sP = new THREE.Vector3();
    const sCol = new THREE.Color();
    function updateSparks(t) {
      let k = 0;
      for (const b of BURSTS) {
        const age = t - b.t0;
        if (age < 0 || age > b.life + b.stagger + 0.1) continue;
        const d = new THREE.Vector3(...b.dir).normalize();
        const u = new THREE.Vector3().crossVectors(d, Math.abs(d.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : UPV).normalize();
        const w = new THREE.Vector3().crossVectors(d, u);
        for (let i = 0; i < b.n && k < SPARK_N; i++) {
          const h1 = hash(b.seed + i * 1.37);
          const h2 = hash(b.seed + i * 2.71);
          const h3 = hash(b.seed + i * 4.13);
          const h4 = hash(b.seed + i * 5.93);
          const a = age - h4 * b.stagger;
          const life = b.life * (0.45 + 0.55 * h3);
          if (a < 0 || a > life) continue;
          const th = b.spread * Math.sqrt(h1);
          const ph = 2 * Math.PI * h2;
          const sp = b.speed * (0.45 + 0.75 * hash(b.seed + i * 7.7));
          sV.copy(d).multiplyScalar(Math.cos(th)).addScaledVector(u, Math.sin(th) * Math.cos(ph)).addScaledVector(w, Math.sin(th) * Math.sin(ph)).multiplyScalar(sp);
          sP.set(b.o[0] + sV.x * a, b.o[1] + sV.y * a - 4.9 * a * a, b.o[2] + sV.z * a);
          let vy = sV.y - 9.8 * a;
          if (sP.y < 0.004) {
            // quique simples no piso
            sP.y = 0.004 + Math.abs(sP.y) * 0.25;
            vy = Math.abs(vy) * 0.3;
          }
          const vel = new THREE.Vector3(sV.x, vy, sV.z);
          const spd = vel.length();
          dum.position.copy(sP);
          dum.quaternion.setFromUnitVectors(ZAX, vel.normalize());
          dum.scale.set(b.size, b.size, 0.012 + spd * 0.022);
          dum.updateMatrix();
          sparks.setMatrixAt(k, dum.matrix);
          const fade = 1 - a / life;
          sCol.setRGB(lerp(1.1, 3.0, fade), lerp(0.3, 2.2, fade * fade), lerp(0.06, 0.9, fade * fade * fade));
          sparks.setColorAt(k, sCol);
          k++;
        }
      }
      dum.scale.set(0, 0, 0);
      dum.updateMatrix();
      for (; k < SPARK_N; k++) sparks.setMatrixAt(k, dum.matrix);
      sparks.instanceMatrix.needsUpdate = true;
      sparks.instanceColor.needsUpdate = true;
    }

    // ---------- Energia: fumaça (sprites suaves) ----------
    const smoke = [];
    for (let k = 0; k < 30; k++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: "#3a3e45", transparent: true, depthWrite: false, opacity: 0 }));
      s.renderOrder = 7;
      scene.add(s);
      smoke.push(s);
    }
    function updateSmoke(t, src, amount, spread = 0.5) {
      smoke.forEach((s, k) => {
        if (amount <= 0.01) {
          s.visible = false;
          return;
        }
        const f = (hash(k * 1.7) + t * (0.32 + hash(k * 2.3) * 0.18)) % 1;
        s.visible = true;
        s.position.set(
          src[0] + (hash(k * 3.1) - 0.5) * spread + 0.08 * Math.sin(t * 1.4 + k) * f,
          src[1] + 0.03 + f * (0.7 + hash(k * 4.4) * 0.4),
          src[2] + 0.06 + f * 0.25,
        );
        s.scale.setScalar(0.1 + f * (0.45 + hash(k) * 0.25));
        s.material.rotation = hash(k * 5.5) * 6 + t * 0.3;
        s.material.opacity = amount * 0.5 * (1 - f) * Math.min(1, f * 8);
      });
    }

    // ---------- Luz: interna, com janela fria e chave quente ----------
    const hemi = new THREE.HemisphereLight("#fffaf2", "#b3a690", 0.21);
    scene.add(hemi);
    const key = new THREE.DirectionalLight("#fff0dc", 0.88);
    key.position.set(2.6, 5.4, 4.2);
    key.target.position.set(-0.3, 1.2, -1.2);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -3.6;
    key.shadow.camera.right = 3.6;
    key.shadow.camera.top = 3.6;
    key.shadow.camera.bottom = -3.6;
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 16;
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.015;
    key.shadow.radius = 3;
    key.shadow.blurSamples = 12;
    scene.add(key, key.target);
    const fill = new THREE.DirectionalLight("#d6e6ff", 0.21);
    fill.position.set(-4, 2.6, 2.5);
    scene.add(fill);
    const arcLight = new THREE.PointLight("#cfe8ff", 0, 5, 2);
    const fireLight = new THREE.PointLight("#ff7a2a", 0, 3.5, 2);
    const chassisLight = new THREE.PointLight("#ff4d4d", 0, 3, 2);
    const dpsLight = new THREE.PointLight("#a78bfa", 0, 2.5, 2);
    scene.add(arcLight, fireLight, chassisLight, dpsLight);

    // ---------- Texturas industriais ----------
    // Piso epóxi cinza com respingos de agregado
    const epoxyTex = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = "#a9afb1";
      g.fillRect(0, 0, w, h);
      for (let i = 0; i < 9000; i++) {
        const v = hash(i * 1.17);
        g.fillStyle = v > 0.5 ? `rgba(255,255,255,${0.05 + v * 0.06})` : `rgba(40,48,56,${0.04 + v * 0.08})`;
        g.fillRect(hash(i + 0.3) * w, hash(i + 0.7) * h, 1 + hash(i + 0.5) * 2, 1 + hash(i + 0.9) * 2);
      }
      for (let i = 0; i < 14; i++) {
        const x = hash(i * 3.3) * w;
        const y = hash(i * 5.1) * h;
        const r = 40 + hash(i * 7.7) * 90;
        const grd = g.createRadialGradient(x, y, 0, x, y, r);
        grd.addColorStop(0, "rgba(255,255,255,0.07)");
        grd.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = grd;
        g.fillRect(x - r, y - r, r * 2, r * 2);
      }
    }, [9, 9]);
    // Bloco de concreto pintado (parede do galpão)
    const blockTex = canvasTex(512, 256, (g, w, h) => {
      g.fillStyle = "#9aa4ae";
      g.fillRect(0, 0, w, h);
      for (let r = 0; r < 4; r++) {
        for (let c = -1; c < 4; c++) {
          const x = c * 128 + (r % 2 ? 64 : 0);
          const v = hash(r * 13 + c * 7);
          g.fillStyle = `rgb(${196 - v * 10},${202 - v * 10},${208 - v * 10})`;
          g.fillRect(x + 3, r * 64 + 3, 122, 58);
          for (let i = 0; i < 70; i++) {
            const k = r * 1000 + c * 100 + i;
            g.fillStyle = `rgba(90,98,108,${0.05 + hash(k) * 0.08})`;
            g.fillRect(x + 3 + hash(k + 0.2) * 120, r * 64 + 3 + hash(k + 0.4) * 56, 2, 2);
          }
        }
      }
    }, [10, 3]);
    // Faixa zebrada amarela e preta
    const hazardTex = canvasTex(256, 128, (g) => {
      g.fillStyle = "#facc15";
      g.fillRect(0, 0, 256, 128);
      g.fillStyle = "#1f2937";
      for (let x = -128; x < 256; x += 48) {
        g.beginPath();
        g.moveTo(x, 128);
        g.lineTo(x + 24, 128);
        g.lineTo(x + 152, 0);
        g.lineTo(x + 128, 0);
        g.fill();
      }
    });
    hazardTex.wrapS = THREE.RepeatWrapping;
    // Grade da tampa do ventilador do motor
    const grilleTex = canvasTex(128, 128, (g, w, h) => {
      g.fillStyle = "#1c2026";
      g.fillRect(0, 0, w, h);
      g.strokeStyle = "#3a414b";
      g.lineWidth = 5;
      for (let r = 10; r < 64; r += 10) {
        g.beginPath();
        g.arc(64, 64, r, 0, Math.PI * 2);
        g.stroke();
      }
    });
    grilleTex.wrapS = grilleTex.wrapT = THREE.ClampToEdgeWrapping;

    const MI = {
      epoxy: std("#ffffff", { map: epoxyTex, roughness: 0.3 }),
      block: std("#ffffff", { map: blockTex, roughness: 0.92 }),
      wallUp: std("#eceff2", { roughness: 0.92 }),
      beam: std("#4b5b6e", { roughness: 0.5, metalness: 0.4 }),
      cabinet: std("#c8cbc7", { map: brushedTex, roughness: 0.42, metalness: 0.25 }),
      cabinetDark: std("#8f969c", { roughness: 0.5, metalness: 0.3 }),
      plate: std("#d9823b", { roughness: 0.5, metalness: 0.2 }),
      duct: std("#9ca3aa", { roughness: 0.6 }),
      inv: std("#2a2f37", { roughness: 0.45 }),
      heat: std("#8a9097", { roughness: 0.35, metalness: 0.8 }),
      motor: std("#2f7d5c", { roughness: 0.45, metalness: 0.15 }),
      pump: std("#2c4f8a", { roughness: 0.45, metalness: 0.15 }),
      steel: std("#b9bfc6", { roughness: 0.3, metalness: 0.85 }),
      galv: std("#c7ccd1", { roughness: 0.45, metalness: 0.6 }),
      red: std("#c62828", { roughness: 0.4 }),
      green: std("#22a046", { roughness: 0.4 }),
      orange: std("#f97316", { roughness: 0.45 }),
      blue: std("#2563eb", { roughness: 0.45 }),
      airBlue: std("#2f80ed", { roughness: 0.35 }),
      paper: std("#fbfbf7", { roughness: 0.9 }),
      board: std("#7a5232", { roughness: 0.6 }),
    };

    // ---------- Cenário: galpão industrial ----------
    const WALL_Z = -1.4;
    const WZ = WALL_Z + 0.04;
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(22, 22), MI.epoxy);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const wallLow = box(11, 1.5, 0.2, MI.block);
    wallLow.position.set(0, 0.75, WALL_Z - 0.1);
    const wallHigh = box(11, 3.6, 0.2, MI.wallUp);
    wallHigh.position.set(0, 3.3, WALL_Z - 0.1);
    const wallStripe = box(11, 0.06, 0.205, std("#1f3a6b", { roughness: 0.5 }));
    wallStripe.position.set(0, 1.52, WALL_Z - 0.1);
    scene.add(wallLow, wallHigh, wallStripe);
    // Pilares metálicos em perfil I e viga
    for (const x of [-2.55, 3.05]) {
      const web = box(0.05, 5, 0.2, MI.beam);
      web.position.set(x, 2.5, WALL_Z + 0.12);
      const f1 = box(0.22, 5, 0.03, MI.beam);
      f1.position.set(x, 2.5, WALL_Z + 0.02);
      const f2 = box(0.22, 5, 0.03, MI.beam);
      f2.position.set(x, 2.5, WALL_Z + 0.22);
      scene.add(web, f1, f2);
    }
    const girder = box(11, 0.28, 0.24, MI.beam);
    girder.position.set(0, 4.1, WALL_Z + 0.12);
    scene.add(girder);
    // Luminárias high-bay
    for (const x of [-1.2, 1.6]) {
      const dome = cyl(0.26, 0.2, MI.beam, 24, 0.1);
      dome.position.set(x, 3.75, 0.2);
      const lampMat = std("#fffbea", { emissive: "#fff3c4", emissiveIntensity: 1.1 });
      const lamp = new THREE.Mesh(new THREE.CircleGeometry(0.24, 24), lampMat);
      lamp.rotation.x = Math.PI / 2;
      lamp.position.set(x, 3.645, 0.2);
      const rod = cyl(0.012, 0.5, MI.steel, 8);
      rod.position.set(x, 4.08, 0.2);
      scene.add(dome, lamp, rod);
    }
    // Leito de cabos na parede
    const tray = box(3.6, 0.05, 0.22, MI.galv);
    tray.position.set(0.2, 2.42, WALL_Z + 0.13);
    scene.add(tray);
    // Faixas amarelas de circulação no piso
    const lineMat = std("#facc15", { roughness: 0.4 });
    for (const [x, z, w, d] of [[0, 0.75, 9, 0.07], [1.75, -0.95, 1.9, 0.05], [1.75, -0.05, 1.9, 0.05], [0.8, -0.5, 0.05, 0.95], [2.7, -0.5, 0.05, 0.95]]) {
      const l = new THREE.Mesh(new THREE.PlaneGeometry(w, d), lineMat);
      l.rotation.x = -Math.PI / 2;
      l.position.set(x, 0.002, z);
      l.receiveShadow = true;
      scene.add(l);
    }

    // ---------- Painel de comando (CCM) com inversor de frequência ----------
    const PN = new THREE.Vector3(0.35, 1.1, -1.15);
    const PW = 1.0;
    const PH = 2.0;
    const PD = 0.5;
    const FZ = PN.z + PD / 2; // face frontal
    const plinth = box(PW + 0.02, 0.1, PD, MI.inv);
    plinth.position.set(PN.x, 0.05, PN.z);
    scene.add(plinth);
    for (const [w, h, d, x, y, z] of [
      [PW, PH, 0.02, PN.x, PN.y, PN.z - PD / 2 + 0.01],
      [0.02, PH, PD, PN.x - PW / 2 + 0.01, PN.y, PN.z],
      [0.02, PH, PD, PN.x + PW / 2 - 0.01, PN.y, PN.z],
      [PW + 0.04, 0.04, PD + 0.04, PN.x, PN.y + PH / 2, PN.z],
      [PW, 0.02, PD, PN.x, PN.y - PH / 2 + 0.01, PN.z],
    ]) {
      const b = box(w, h, d, MI.cabinet);
      b.position.set(x, y, z);
      scene.add(b);
    }

    // ---------- IK de dois ossos (ombro e cotovelo) com polo; parte da pose atual ----------
    const L1 = 0.29;
    const L2 = 0.27;
    const DOWN = new THREE.Vector3(0, -1, 0);
    const qU = new THREE.Quaternion();
    const qF = new THREE.Quaternion();
    function reach(who, arm, targetW, k, pole = null) {
      if (k <= 0.001) return;
      const { shoulder, elbow, side } = arm;
      who.updateMatrixWorld(true);
      const T = who.userData.hips.worldToLocal(new THREE.Vector3(...targetW));
      const S = shoulder.position.clone();
      const v = T.clone().sub(S);
      const d = Math.min(L1 + L2 - 0.003, Math.max(0.08, v.length()));
      const dir = v.normalize();
      const pl = (pole || new THREE.Vector3(side * 0.7, -1, -0.5)).clone().normalize();
      const n = new THREE.Vector3().crossVectors(dir, pl);
      if (n.lengthSq() < 1e-6) n.set(1, 0, 0);
      n.normalize();
      const a = Math.acos(Math.min(1, Math.max(-1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
      const upperDir = dir.clone().applyAxisAngle(n, a);
      qU.setFromUnitVectors(DOWN, upperDir);
      const E = S.clone().addScaledVector(upperDir, L1);
      const Td = S.clone().addScaledVector(dir, d);
      const foreDir = Td.sub(E).normalize().applyQuaternion(qU.clone().invert());
      qF.setFromUnitVectors(DOWN, foreDir);
      shoulder.quaternion.slerp(qU, k);
      elbow.quaternion.slerp(qF, k);
    }
    function animateBody(who, t, walk, seed) {
      const u = who.userData;
      const ph = t * 8.5 + seed;
      const sw = Math.sin(ph) * walk;
      u.legs.forEach((l, i) => {
        const s = i === 0 ? sw : -sw;
        l.thigh.rotation.x = 0.5 * s;
        l.knee.rotation.x = walk * 0.75 * Math.max(0, Math.sin(ph + (i === 0 ? 0.9 : 0.9 + Math.PI)));
      });
      u.hips.position.y = 0.92 + 0.025 * Math.abs(Math.sin(ph)) * walk;
      u.torso.scale.y = 1 + 0.012 * Math.sin(t * 2.1 + seed);
      const bl = (t + seed * 0.37) % 3.4 < 0.13 ? 0.12 : 1;
      u.eyes.forEach((e) => (e.scale.y = bl));
      return sw;
    }
    function idleArms(who, sw, bend = 0.25) {
      who.userData.arms.forEach((a, i) => {
        a.shoulder.quaternion.setFromEuler(new THREE.Euler((i === 0 ? -sw : sw) * 0.45, 0, a.side * 0.1));
        a.elbow.quaternion.setFromEuler(new THREE.Euler(-bend - 0.2 * Math.abs(sw), 0, 0));
      });
    }

      // ---------- Posições (a ~0,45 m do alvo de cada mão) ----------

      const POS = [
        [0, P_PANEL], [C.desligar - 0.2, P_PANEL], [C.desligar + 0.9, P_FAR],
        [C.c2 - 0.1, P_FAR], [C.bloquear - 0.35, P_CG],

        [C.loop + 0.2, P_CG], [C.loop + 1.8, P_PANEL],
      ];
      const COLPOS = [[0, OFF_COL], [C.c2 + 1.4, OFF_COL], [C.cada - 0.1, P_COL], [C.nr1 + 0.7, P_COL], [C.nr1 + 2.6, OFF_COL]];
      const posAt = (t) => track3(t, POS);
      const colAt = (t) => track3(t, COLPOS);
      const yawTo = (p, q) => Math.atan2(q[0] - p[0], q[2] - p[2]);
      const yawCam = 0.38;
      const yawBack = Math.PI - 0.15;

      // ---------- Câmera: plano-sequência por quadros-chave ----------
      // q = alvo, d = distância, dir = direção da câmera (da cena para ela)
      const DIR = [0.42, 0.12, 1];
      const shot = (q, d, dir = DIR) => {
        const n = Math.hypot(...dir);
        return { q, p: q.map((v, i) => v + (dir[i] / n) * d) };
      };
      const OPEN = shot([0.15, 1.7, -0.8], 7.4);
      const PANELW = (d = 5.4, dy = 0.5) => shot([PN.x, PN.y + dy, PN.z], d);
      const INVC = (d = 3.2, dy = 0.58) => shot([INV.x, INV.y + dy, INV.z], d);
      // LEFT: pela esquerda (o eletricista fica à direita da chave); HIGH: de cima, entre ele e o colega
      const LEFT = [-0.55, 0.2, 1];
      const HIGH = [0.0, 0.95, 1];
      const K = [
        { t: 0, ...OPEN },
        { t: C.pode, ...shot([0.12, 1.66, -0.8], 6.8) },
        { t: C.desligar + 0.8, ...PANELW(5.6) },
        { t: C.camadas + 0.4, ...PANELW(5.9) },
        { t: C.capacitores - 0.3, ...INVC(3.4) },
        { t: C.minutos, ...INVC(3.6, 0.52) },
        { t: C.alguem + 0.4, ...shot([1.0, 1.65, -0.7], 6.4) },
        { t: C.curto, ...shot([0.9, 1.6, -0.7], 6.2) },
        { t: C.arco - 0.2, ...INVC(3.9, 0.5) },
        { t: C.c1 + 0.6, ...shot([-0.8, 1.95, -0.2], 5.2) },
        { t: C.diagrama + 0.6, ...shot([-0.78, 1.9, -0.2], 4.8) },
        { t: C.bloquear, ...shot([CG.x + 0.35, 1.75, CG.z], 4.2, LEFT) },
        { t: C.chave + 0.3, ...shot([CG.x + 0.45, 1.7, CG.z], 4.4, LEFT) },
        { t: C.proprio, ...shot([CG.x + 0.0, 1.22, CG.z], 3.3, HIGH) },
        { t: C.tira + 0.4, ...shot([CG.x + 0.0, 1.2, CG.z], 3.2, HIGH) },
        { t: C.c3 + 0.6, ...PANELW(5.6) },
        { t: C.etiqueta - 0.2, ...shot([PN.x, 1.75, FZ], 3.0) },
        { t: C.tente + 0.2, ...shot([0.95, 1.6, -0.75], 6.0) },
        { t: C.meca + 0.3, ...INVC(3.6, 0.4) },
        { t: C.depois, ...INVC(3.5, 0.4) },
        { t: C.mito + 0.4, ...shot([PN.x - 0.1, 1.95, FZ], 3.6) },
        { t: C.display2 + 0.3, ...INVC(3.4, 0.62) },
        { t: C.v540b, ...shot([0.0, 1.95, -0.6], 6.2) },
        { t: C.norma + 0.6, ...shot([0.0, 1.95, -0.8], 5.4) },
        { t: C.nr1, ...shot([0.0, 1.9, -0.8], 5.2) },
        { t: C.cta + 0.7, ...shot([-0.3, 3.0, -0.6], 9.8) },
        { t: C.loop, ...shot([-0.3, 2.95, -0.6], 9.4) },
        { t: C.loop + 1.6, ...shot([0.13, 1.72, -0.8], 7.0) },
        { t: C.end, ...OPEN },
      ];
      function cameraAt(t) {
        if (t <= K[0].t) return K[0];
        for (let i = 0; i < K.length - 1; i++) {
          const a = K[i];
          const b = K[i + 1];
          if (t <= b.t) {
            const x = easeInOut((t - a.t) / (b.t - a.t));
            return { p: lerp3(a.p, b.p, x), q: lerp3(a.q, b.q, x) };
          }
        }
        return K[K.length - 1];
      }

      // ---------- Callouts presos a pontos 3D ----------
      const svg = document.getElementById("world-lines");
      const SVGNS = "http://www.w3.org/2000/svg";
      function worldOf(obj, x, y, z) {
        obj.updateMatrixWorld(true);
        return obj.localToWorld(new THREE.Vector3(x, y, z)).toArray();
      }
      const CTA_BOX = { top: 1320, bottom: 1600 };
      const CALLOUTS = [
        { id: "co-xray", a: C.desligar + 0.9, b: C.problema, at: () => worldOf(doorPanel, 0.3, 0.6, 0.02), dx: 90, dy: -60, top: 640 },
        { id: "co-cap", a: C.capacitores, b: C.alguem, at: () => CAP_P.toArray(), dx: 140, dy: 150, top: 640 },
        { id: "co-part", a: C.alguem + 0.7, b: C.arco - 0.2, at: () => SPIN.toArray(), dx: -60, dy: -170, top: 640 },
        { id: "co-arco", a: C.arco, b: C.c1, at: () => ARC.toArray(), dx: 150, dy: 140, top: 640 },
        { id: "co-cg", a: C.bloquear + 0.5, b: C.cada, at: () => cgHandle.position.toArray(), dx: -130, dy: -120, top: 760 },
        { id: "co-cmd", a: C.fontes + 0.6, b: C.cada, at: () => cmdLever.position.toArray(), dx: 130, dy: -130, top: 760 },
        { id: "co-air", a: C.chave + 0.25, b: C.proprio, at: () => [AIR.x, AIR.y, AIR.z + 0.04], dx: 130, dy: 120, top: 760 },
        { id: "co-lock", a: C.cadeado + 0.6, b: C.c3 + 0.2, at: () => [HASP.x, HASP.y - 0.1, HASP.z + 0.03], dx: 130, dy: 120, top: 860 },
        { id: "co-wait", a: C.etiqueta, b: C.tente, at: () => worldOf(waitLab, 0, 0, 0), dx: 130, dy: 110, top: 960 },
        { id: "co-try", a: C.partida2 + 0.5, b: C.meca, at: () => SPIN.toArray(), dx: -60, dy: -150, top: 960 },
        { id: "co-0v", a: C.meca + 1.0, b: C.mito, at: () => worldOf(meter, 0, 0.04, 0.03), dx: -110, dy: 120, top: 960 },
        { id: "co-dsp", a: C.apagou + 0.2, b: C.display2, at: () => worldOf(dsp, 0, 0, 0), dx: 140, dy: 130, top: 860 },
        { id: "co-bus", a: C.display2 + 0.3, b: C.v540b, at: () => CAP_P.toArray(), dx: 140, dy: 160, top: 860 },
        { id: "co-epi", a: C.prontuario, b: C.cta, at: () => worldOf(elet.userData.arms[1].hand, 0, 0, 0), dx: -120, dy: 140, top: 1080 },
        { id: "co-elet", ...CTA_BOX, a: C.treinamento + 0.6, b: C.loop, at: () => worldOf(elet.userData.hips, 0, 1.05, 0), dx: 110, dy: -60 },
      ];
      for (const c of CALLOUTS) {
        c.el = document.getElementById(c.id);
        c.bw = c.el.offsetWidth;
        c.bh = c.el.offsetHeight;
        c.line = document.createElementNS(SVGNS, "line");
        c.line.setAttribute("stroke", "#0b1d3f");
        c.line.setAttribute("stroke-width", "3");
        c.dot = document.createElementNS(SVGNS, "circle");
        c.dot.setAttribute("r", "8");
        c.dot.setAttribute("fill", "#f97316");
        c.dot.setAttribute("stroke", "#ffffff");
        c.dot.setAttribute("stroke-width", "3");
        svg.append(c.line, c.dot);
      }
      const proj = new THREE.Vector3();
      function placeCallouts(t) {
        for (const c of CALLOUTS) {
          const fadeIn = prog(t, c.a, c.a + 0.25);
          const fadeOut = 1 - prog(t, c.b - 0.2, c.b);
          const o = Math.min(fadeIn, fadeOut);
          if (o <= 0.001) {
            c.el.style.opacity = "0";
            c.line.setAttribute("opacity", "0");
            c.dot.setAttribute("opacity", "0");
            continue;
          }
          proj.fromArray(c.at()).project(camera);
          const px = (proj.x * 0.5 + 0.5) * W;
          const py = (-proj.y * 0.5 + 0.5) * H;
          let bx = px + c.dx - (c.dx < 0 ? c.bw : 0);
          let by = py + c.dy - c.bh / 2;
          bx = Math.min(W - 54 - c.bw, Math.max(54, bx));
          by = Math.min((c.bottom ?? 1160) - c.bh, Math.max(c.top ?? 330, by));
          const lift = 14 * (1 - easeOutExpo(fadeIn));
          c.el.style.opacity = String(o);
          c.el.style.transform = `translate(${bx}px, ${by + lift}px)`;
          const lx = bx + (c.dx < 0 ? c.bw : 0);
          const ly = by + c.bh / 2;
          const grow = easeOut(fadeIn);
          c.line.setAttribute("x1", String(px));
          c.line.setAttribute("y1", String(py));
          c.line.setAttribute("x2", String(lerp(px, lx, grow)));
          c.line.setAttribute("y2", String(lerp(py, ly, grow)));
          c.line.setAttribute("opacity", String(o));
          c.dot.setAttribute("cx", String(px));
          c.dot.setAttribute("cy", String(py));
          c.dot.setAttribute("opacity", String(o));
        }
      }

      // ---------- Estados ao longo do tempo ----------
      // Motor: para no gancho, parte sozinho pelo CLP no problema, fica parado bloqueado e volta a girar no fim
      const SPD = [
        [0, 1], [0.9, 1], [2.4, 0], [C.alguem + 0.7, 0], [C.alguem + 1.7, 1], [C.c1 - 0.4, 1], [C.c1 + 0.6, 0],
        [C.proximo + 3.2, 0], [C.proximo + 4.6, 1],
      ];
      // Fontes: desligadas e bloqueadas na camada 2, religadas na chamada final (depois de tirar os cadeados)
      const CHV = [[0, 1], [C.bloquear + 0.2, 1], [C.bloquear + 0.35, 0], [C.proximo + 1.0, 0], [C.proximo + 1.15, 1]];
      const CMDS = [[0, 1], [C.fontes + 0.25, 1], [C.fontes + 0.4, 0], [C.proximo + 2.0, 0], [C.proximo + 2.15, 1]];
      const AIRS = [[0, 1], [C.chave + 0.1, 1], [C.chave + 0.3, 0], [C.proximo + 2.5, 0], [C.proximo + 2.65, 1]];
      // Porta: raio-x durante a explicação; aberta só depois de esperar e tentar a partida (camada 3) e na norma
      const XR = [[0, 0], [C.desligar - 0.1, 0], [C.desligar + 0.6, 1], [C.cta + 1.2, 1], [C.loop + 0.6, 0]];
      const DOOR = [[0, 0], [C.meca - 0.6, 0], [C.meca - 0.1, 1.9], [C.mito - 0.05, 1.9], [C.mito + 0.35, 0], [C.norma + 0.1, 0], [C.norma + 0.6, 1.9], [C.cta + 0.4, 1.9], [C.cta + 1.2, 0]];
      // Tensão do barramento CC (fração de 540 V). Cai devagar depois da chave geral e chega a 0 V no teste.
      // No mito, o "replay" mostra a carga que fica com o display apagado (540 V → ~330 V, como o contador do HUD).
      function busAt(t) {
        const off = C.bloquear + 0.35;
        if (t < off) return 1;
        if (t < C.meca) return Math.pow(1 - prog(t, off, C.meca), 2);
        if (t < C.mito + 0.2) return 0;
        if (t < C.norma) return 1 - 0.39 * prog(t, C.apaga, C.centenas + 0.9);
        if (t < C.proximo + 1.15) return 0;
        return prog(t, C.proximo + 1.15, C.proximo + 1.5);
      }
      const spinAt = (t) => integ(t, (x) => track(x, SPD) * 16);
      const BURST_ARC = [
        { t0: C.arco - 0.08, o: ARC.toArray(), dir: [0.2, 0.5, 1], spread: 1.1, speed: 2.8, n: 42, life: 0.9, stagger: 0.12, seed: 13, size: 1.0 },
        { t0: C.arco + 0.35, o: [ARC.x + 0.04, ARC.y, ARC.z], dir: [-0.3, 0.4, 1], spread: 1.0, speed: 2.2, n: 30, life: 0.8, stagger: 0.15, seed: 29, size: 0.9 },
      ];
      BURSTS.push(...BURST_ARC);
      const bArc = makeBolt(18, 3.5, 16, "#7cc4ff");
      const bArc2 = makeBolt(14, 2.6, 11, "#a5b4fc");

      // Pontos-alvo das mãos
      const toward = (from, to, back) => {
        const a = new THREE.Vector3(...from);
        const b = new THREE.Vector3(...to);
        return b.clone().addScaledVector(b.sub(a).normalize(), -back).toArray();
      };
      const shoulderW = (who, arm) => worldOf(arm.shoulder, 0, 0, 0);
      const hipsW = (who, x, y, z) => worldOf(who.userData.hips, x, y, z);
      const qYaw = new THREE.Quaternion();
      const eYaw = new THREE.Euler();

      // ---------- Render de um quadro a partir de t ----------
      return function render(t) {
        const cam = cameraAt(t);
        const shake = 0.01 * pulse(t, C.arco - 0.1, C.arco + 0.5);
        camera.position.set(cam.p[0] + shake * Math.sin(t * 91), cam.p[1] + shake * Math.sin(t * 77 + 1), cam.p[2]);
        camera.lookAt(cam.q[0], cam.q[1], cam.q[2]);
        camera.updateMatrixWorld(true);

        // Porta e raio-x
        door.rotation.y = track(t, DOOR);
        const xr = track(t, XR);
        doorMat.opacity = lerp(1, 0.14, xr);
        doorMat.depthWrite = xr < 0.5;
        doorEdges.material.opacity = xr;

        // Fontes
        const chv = track(t, CHV);
        const cmds = track(t, CMDS);
        const airs = track(t, AIRS);
        cgHandle.rotation.z = lerp(Math.PI / 2, 0, chv);
        cmdLever.position.y = CMD.y + lerp(-0.02, 0.02, cmds);
        airLever.rotation.z = lerp(-Math.PI / 2, 0, airs);
        const powered = chv > 0.5;
        const spd = track(t, SPD);
        const bus = busAt(t);
        const T = (v) => t * v;

        // Fluxo de energia: entrada e comando com a chave ligada; motor só quando gira; ar enquanto a válvula está aberta
        fMain.set(0.75 * (powered ? 1 : 0), T(4));
        fCmd.set(0.6 * (cmds > 0.5 ? 1 : 0), T(4));
        fIn1.set(0.7 * (powered ? 1 : 0), T(4));
        fIn2.set(0.7 * (powered ? 1 : 0), T(4));
        const running = clamp01(spd * 1.2);
        fOutM.set(0.75 * running, integ(t, (x) => track(x, SPD) * 4));
        fMot.set(0.75 * running, integ(t, (x) => track(x, SPD) * 4));
        fAir.set(0.45 * (airs > 0.5 ? 1 : 0), T(2));
        // Sinal remoto do CLP (partida inesperada): um pulso azul corre até o painel
        fClp.set(0.25, T(2));
        fClp.u.uHead.value = prog(t, C.alguem, C.alguem + 0.9) * CLPW.L;
        fClp.u.uHeadI.value = 9 * pulse(t, C.alguem - 0.05, C.alguem + 0.95);
        const remote = t >= C.alguem && t < C.alguem + 1.0;
        clpLedMat.emissive.set(remote && Math.sin(t * 30) > 0 ? "#60a5fa" : "#22c55e");
        clpLedMat.emissiveIntensity = remote ? 3 : 1.4;
        spin.rotation.x = spinAt(t);

        // Capacitores e barramento CC: brilham com a carga
        const flick = 0.9 + 0.1 * Math.sin(t * 7);
        capMat.emissiveIntensity = 0.55 * bus * flick;
        capTopMat.emissiveIntensity = 0.6 * bus * flick;
        busMat.emissiveIntensity = 1.3 * bus * flick;
        capGlow.material.opacity = 0.75 * bus * flick;
        busLight.intensity = 0.9 * bus;
        invLedMat.emissiveIntensity = powered || bus > 0.2 ? 1.6 : 0.05;

        // Display do inversor na porta: apaga no mito com o barramento ainda carregado
        let dspTex = DSP_OFF;
        if (t >= C.mito - 0.1 && t < C.norma) dspTex = t < C.apagou ? DSP_STOP : DSP_OFF;
        else if (spd > 0.5) dspTex = DSP_RUN;
        else if (powered || bus > 0.8) dspTex = DSP_STOP;
        if (dspMat.map !== dspTex) {
          dspMat.map = dspTex;
          dspMat.emissiveMap = dspTex;
          dspMat.needsUpdate = true;
        }
        btnO.position.z = BTN_O_L.z - 0.012 * ((t >= 0.6 && t < 0.95) || t >= C.end - 0.2 ? 1 : 0);
        btnI.position.z = BTN_I_L.z - 0.012 * (t >= C.partida2 - 0.15 && t < C.partida2 + 0.3 ? 1 : 0);

        // Arco elétrico ("e se" um curto acontecer aqui dentro), sem ninguém perto
        const ms = Math.floor(t * 18);
        const arcOn = t >= C.arco - 0.1 && t < C.arco + 1.1;
        const arcI = arcOn ? (hash(ms * 2.3) > 0.2 ? 1 : 0.35) * (1 - prog(t, C.arco + 0.5, C.arco + 1.1)) : 0;
        setBolt(bArc, [DCP.x, DCP.y, DCP.z + 0.03], [DCN.x, DCN.y + (hash(ms) - 0.5) * 0.03, DCN.z + 0.03], ms * 1.3, 0.07, arcI);
        setBolt(bArc2, [ARC.x, ARC.y, ARC.z], [ARC.x + (hash(ms * 3.3) - 0.5) * 0.3, ARC.y + 0.1 + hash(ms * 4.1) * 0.15, ARC.z + 0.06], ms * 2.1 + 3, 0.09, arcI * 0.8);
        arcLight.position.set(ARC.x, ARC.y, ARC.z + 0.8);
        arcLight.intensity = 1.3 * arcI;
        document.getElementById("world-flash").style.opacity = String(Math.max(0.32 * pulse(t, C.arco - 0.12, C.arco + 0.1), arcOn && hash(ms * 7.7) > 0.8 ? 0.08 : 0));
        bloom.strength = 0.45 + 0.3 * arcI + 0.12 * bus;
        updateSmoke(t, [ARC.x, ARC.y, ARC.z], pulse(t, C.arco, C.arco + 2.4) * 0.8, 0.25);
        updateSparks(t);

        // Cadeados e garra
        hasp.visible = t >= C.proprio - 0.2 && t < C.proximo + 0.5;
        for (const [lk, at, until] of [[lockE, C.proprio + 0.35, C.proximo + 0.4], [lockC, C.cadeado + 0.75, C.nr1 + 0.1], [lockM, C.fontes + 0.7, C.proximo + 0.4], [lockA, C.chave + 0.5, C.proximo + 0.4]]) {
          lk.visible = t >= at && t < until;
          lk.scale.setScalar(Math.max(0.01, spring(prog(t, at, at + 0.6))));
        }

        // ---------- Eletricista ECASI ----------
        const ep = posAt(t);
        const ep2 = posAt(t - 0.05);
        const moving = Math.hypot(ep[0] - ep2[0], ep[2] - ep2[2]);
        const walk = Math.min(1, moving / 0.03);
        const BO = worldOf(btnO, 0, 0, 0.02);
        const BI = worldOf(btnI, 0, 0, 0.02);
        const targetYaw = (() => {
          if (t < C.pode + 0.2) return yawTo(ep, BO);
          if (t < C.desligar) return angLerp(yawTo(ep, BO), yawCam, prog(t, C.pode + 0.2, C.pode + 0.8));
          if (t < C.c1) return yawTo(ep, [PN.x, 0, PN.z]);
          if (t < C.c2) return 0.75;
          if (t < C.c3 + 0.3) return yawTo(ep, [-0.66, 0, WALL_Z]);
          if (t < C.mito) return yawTo(ep, [INV.x, 0, PN.z]);
          if (t < C.norma) return yawCam;
          if (t < C.cta + 1.2) return yawTo(ep, [INV.x, 0, PN.z]);
          if (t < C.treinamento) return yawCam;
          if (t < C.loop + 0.2) return angLerp(yawCam, yawBack, prog(t, C.ecasi - 0.3, C.ecasi + 0.5));
          return yawTo(ep, BO);
        })();
        const headingYaw = moving > 0.004 ? Math.atan2(ep[0] - ep2[0], ep[2] - ep2[2]) : targetYaw;
        elet.position.fromArray(ep);
        elet.rotation.y = angLerp(targetYaw, headingYaw, walk * 0.85);
        const sw = animateBody(elet, t, walk, 0.7);
        idleArms(elet, sw);
        const head = elet.userData.head;
        head.rotation.y = 0.3 * Math.sin((t - C.nao) * 14) * pulse(t, C.nao, C.nao + 0.9);
        head.rotation.x = 0.18 * pulse(t, C.c1 + 0.5, C.c2 - 0.4);

        // Mão direita: botão O, comando, válvula de ar, botão I, porta, multímetro, aceno
        const CGH = worldOf(cgHandle, 0.06, 0, 0.02);
        const LEV = worldOf(cmdLever, 0, 0, 0.02);
        const AIRH = worldOf(airLever, 0.07, 0, 0.02);
        const HSP = [HASP.x - 0.03, HASP.y - 0.08, HASP.z + 0.04];
        const DH = worldOf(handle, 0, 0, 0.03);
        const env = (a, b, c, d) => track(t, [[a, 0], [b, 1], [c, 1], [d, 0]]);
        const actsR = [
          [Math.max(env(-1, 0, 1.0, 1.5), env(C.end - 1.2, C.end - 0.45, C.end + 1, C.end + 2)), BO, 0.05],
          [env(C.fontes - 0.2, C.fontes + 0.2, C.fontes + 0.7, C.chave - 0.1), LEV, 0.05],
          [env(C.chave - 0.1, C.chave + 0.15, C.chave + 0.5, C.cada - 0.2), AIRH, 0.05],
          [env(C.partida2 - 0.6, C.partida2 - 0.15, C.partida2 + 0.35, C.partida2 + 0.8), BI, 0.05],
          [env(C.meca - 1.0, C.meca - 0.65, C.meca - 0.2, C.meca + 0.1), DH, 0.05],
          [env(C.norma - 0.1, C.norma + 0.15, C.norma + 0.5, C.norma + 0.8), DH, 0.05],
          [env(C.proximo + 1.6, C.proximo + 1.9, C.proximo + 2.3, C.proximo + 2.6), LEV, 0.05],
        ];
        const mK = Math.max(env(C.meca - 0.1, C.meca + 0.5, C.mito - 0.3, C.mito + 0.1), env(C.prontuario - 0.4, C.prontuario + 0.2, C.cta - 0.4, C.cta));
        const waveK = env(C.treinamento, C.treinamento + 0.45, C.ecasi - 0.5, C.ecasi - 0.1);
        const crossK = env(C.mito + 0.4, C.mito + 1.0, C.norma - 0.6, C.norma - 0.2);
        const actR = actsR.find(([k]) => k > 0.001);
        if (actR) reach(elet, armR, toward(shoulderW(elet, armR), actR[1], actR[2]), actR[0]);
        else if (mK > 0.001) reach(elet, armR, [INV.x - 0.06, 1.08, FZ + 0.14], mK);
        else if (waveK > 0.001) reach(elet, armR, hipsW(elet, -0.36 - 0.05 * Math.sin(t * 9), 0.98, 0.14), waveK);
        else if (crossK > 0.001) reach(elet, armR, hipsW(elet, 0.1, 0.3, 0.22), crossK, new THREE.Vector3(-1, -0.4, -1));
        // Mão esquerda: prancheta, chave geral, cadeado na garra, tira cadeado e religa a chave no fim
        const clipK = env(C.c1 - 0.2, C.c1 + 0.4, C.c2 - 0.5, C.c2 + 0.1);
        const actsL = [
          [env(C.bloquear - 0.3, C.bloquear + 0.1, C.bloquear + 0.6, C.fontes - 0.2), CGH, 0.05],
          [env(C.proprio - 0.4, C.proprio + 0.2, C.proprio + 0.8, C.tira), HSP, 0.04],
          [env(C.proximo - 0.3, C.proximo + 0.15, C.proximo + 0.45, C.proximo + 0.7), HSP, 0.04],
          [env(C.proximo + 0.6, C.proximo + 0.9, C.proximo + 1.3, C.proximo + 1.6), CGH, 0.05],
        ];
        const actL = actsL.find(([k]) => k > 0.001);
        if (actL) reach(elet, armL, toward(shoulderW(elet, armL), actL[1], actL[2]), actL[0]);
        else if (clipK > 0.001) reach(elet, armL, hipsW(elet, 0.1, 0.36, 0.3), clipK, new THREE.Vector3(1, -0.6, -0.4));
        else if (crossK > 0.001) reach(elet, armL, hipsW(elet, -0.1, 0.32, 0.22), crossK, new THREE.Vector3(1, -0.4, -1));

        // Prancheta na mão esquerda (de frente para ele, inclinada para ler), com os itens marcados na fala
        clip.visible = clipK > 0.02;
        if (clip.visible) {
          const hp = worldOf(armL.hand, 0, -0.05, 0.02);
          clip.position.set(hp[0], hp[1], hp[2]);
          clip.rotation.set(-0.95, elet.rotation.y + Math.PI, 0, "YXZ");
          clip.scale.setScalar(Math.max(0.01, spring(clipK)));
          clip.userData.marcar((t >= C.analise ? 1 : 0) + (t >= C.permissao ? 1 : 0) + (t >= C.diagrama ? 1 : 0));
        }
        // Multímetro na mão direita e as pontas de prova nos bornes DC+ e DC−
        meter.visible = mK > 0.02;
        if (meter.visible) {
          const hp = worldOf(armR.hand, 0, -0.06, 0.03);
          meter.position.set(hp[0], hp[1], hp[2]);
          meter.rotation.set(-0.35, elet.rotation.y + Math.PI, 0, "YXZ");
          meter.scale.setScalar(Math.max(0.01, spring(mK)));
          meter.userData.tela(mK > 0.7 ? (bus > 0.02 ? "v" : "z") : "off");
        }
        const probes = mK > 0.7;
        probeR.visible = probeK.visible = probes;
        if (probes) {
          meter.updateMatrixWorld(true);
          setProbe(probeR, meter.localToWorld(vA.set(-0.03, -0.09, 0.02)).clone(), DCP.clone().add(new THREE.Vector3(0, 0, 0.02)));
          setProbe(probeK, meter.localToWorld(vB.set(0.03, -0.09, 0.02)).clone(), DCN.clone().add(new THREE.Vector3(0, 0, 0.02)));
        }

        // ---------- Colega da manutenção (cadeado azul) ----------
        const cp = colAt(t);
        const cp2 = colAt(t - 0.05);
        const cMove = Math.hypot(cp[0] - cp2[0], cp[2] - cp2[2]);
        const cWalk = Math.min(1, cMove / 0.03);
        col.visible = cp[0] > -3.4;
        col.position.fromArray(cp);
        col.rotation.y = cMove > 0.004 ? Math.atan2(cp[0] - cp2[0], cp[2] - cp2[2]) : yawTo(cp, [HASP.x, 0, HASP.z]);
        const csw = animateBody(col, t, cWalk, 2.1);
        idleArms(col, csw);
        const cK = Math.max(env(C.cadeado - 0.1, C.cadeado + 0.5, C.cadeado + 1.1, C.tira + 0.3), env(C.nr1 - 0.5, C.nr1 - 0.1, C.nr1 + 0.3, C.nr1 + 0.6));
        if (cK > 0.001) reach(col, colR, toward(shoulderW(col, colR), [HASP.x + 0.03, HASP.y - 0.08, HASP.z + 0.04], 0.04), cK);

        composer.render(1 / FPS);
        placeCallouts(t);
      };
    }

    // Relógio: um tween do GSAP alimenta render(t). A linha do tempo só é registrada depois que as fontes e os
    // logos da ECASI carregaram, para o uniforme nunca aparecer sem o logo.
    const loader = new THREE.TextureLoader();
    Promise.all([document.fonts.ready, loader.loadAsync("assets/brand/logo-fundo-escuro.png"), loader.loadAsync("assets/brand/simbolo-ecasi.png")]).then(([, backTex, symTex]) => {
      for (const tx of [backTex, symTex]) {
        tx.colorSpace = THREE.SRGBColorSpace;
        tx.anisotropy = 8;
      }
      const render = build(backTex, symTex);
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: C.end, duration: C.end, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["world"] = tl;
    });
  </script>
</template>
