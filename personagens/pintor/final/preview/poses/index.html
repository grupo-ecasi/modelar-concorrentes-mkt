<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #eef2f8; }
      #root { position: relative; width: 100%; height: 100%; }
      #cv { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #rotulo { position: absolute; left: 0; right: 0; bottom: 90px; text-align: center; font: 700 64px sans-serif; color: #0b1220; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <canvas id="cv" width="1080" height="1920"></canvas>
      <div id="rotulo"></div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { criarPintor, POSES } from "./assets/pintor-rig.js";
      window.__timelines = window.__timelines || {};
      const NOMES = ["idle","andar","apontar","acenar","explicar","pensar","joinha","comemorar","olhar_em_volta","pegar","pintar_rolo","pintar_broxa","lixar"];
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("cv"), antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      const scene = new THREE.Scene(); scene.background = new THREE.Color("#eef2f8");
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.6;
      const sol = new THREE.DirectionalLight("#fff1dc", 2.2); sol.position.set(1.5, 3, 2.5); sol.castShadow = true;
      scene.add(sol, new THREE.HemisphereLight("#cfe3ff", "#b9c7a0", 0.5));
      const camera = new THREE.PerspectiveCamera(34, 1080 / 1920, 0.01, 50);
      camera.position.set(1.0, 0.75, 2.4); camera.lookAt(0, 0.5, 0);
      new GLTFLoader().loadAsync("assets/pintor.glb").then((g) => {
        const p = criarPintor(THREE, g.scene); scene.add(p.root);
        const rot = document.getElementById("rotulo");
        const render = (t) => {
          const i = Math.min(NOMES.length - 1, Math.floor(t)); rot.textContent = NOMES[i];
          p.pose(POSES[NOMES[i]](t)); renderer.render(scene, camera);
        };
        const st = { t: 0 }; const tl = gsap.timeline({ paused: true });
        tl.to(st, { t: 13, duration: 13, ease: "none", onUpdate: () => render(st.t) }, 0);
        render(0); window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
