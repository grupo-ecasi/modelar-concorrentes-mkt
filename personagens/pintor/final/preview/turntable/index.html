<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #eef2f8; }
      #root { position: relative; width: 100%; height: 100%; }
      #cv { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #rotulo { position: absolute; left: 0; right: 0; bottom: 90px; text-align: center;
        font: 700 44px sans-serif; color: #0b1220; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <canvas id="cv" width="1080" height="1920"></canvas>
      <div id="rotulo">pintor · v6</div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      window.__timelines = window.__timelines || {};
      const DUR = 8;
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("cv"), antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#eef2f8");
      const pm = new THREE.PMREMGenerator(renderer);
      scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.6;

      const sol = new THREE.DirectionalLight("#fff1dc", 2.2);
      sol.position.set(1.5, 3, 2.5);
      sol.castShadow = true;
      sol.shadow.mapSize.set(2048, 2048);
      scene.add(sol, new THREE.HemisphereLight("#cfe3ff", "#b9c7a0", 0.5));

      const chao = new THREE.Mesh(new THREE.CircleGeometry(1.2, 64), new THREE.MeshStandardMaterial({ color: "#dfe6f1", roughness: 0.9 }));
      chao.rotation.x = -Math.PI / 2;
      chao.receiveShadow = true;
      scene.add(chao);

      const camera = new THREE.PerspectiveCamera(32, 1080 / 1920, 0.01, 50);
      camera.position.set(0, 0.62, 2.55);
      camera.lookAt(0, 0.5, 0);

      const piv = new THREE.Group();
      scene.add(piv);

      new GLTFLoader().loadAsync("assets/modelo_v6.glb").then((gltf) => {
        const boneco = gltf.scene;
        boneco.traverse((o) => {
          if (o.isMesh) {
            o.geometry.computeVertexNormals();
            o.material.flatShading = false;
            o.material.roughness = 0.8;
            o.material.metalness = 0;
            o.material.needsUpdate = true;
            o.castShadow = true;
            o.receiveShadow = true;
          }
        });
        const caixa = new THREE.Box3().setFromObject(boneco);
        const alt = caixa.max.y - caixa.min.y;
        boneco.scale.multiplyScalar(1.0 / alt);
        const c2 = new THREE.Box3().setFromObject(boneco);
        const ctr = c2.getCenter(new THREE.Vector3());
        boneco.position.set(-ctr.x, -c2.min.y, -ctr.z);
        piv.add(boneco);

        const render = (t) => {
          piv.rotation.y = (t / DUR) * Math.PI * 2;
          renderer.render(scene, camera);
        };
        const st = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(st.t) }, 0);
        render(0);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
