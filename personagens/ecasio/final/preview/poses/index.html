<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #eef2f8; }
      #root { position: relative; width: 100%; height: 100%; }
      #cv { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #rotulo { position: absolute; left: 0; right: 0; bottom: 90px; text-align: center; font: 700 64px sans-serif; color: #0b1220; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <canvas id="cv" width="1080" height="1920"></canvas>
      <div id="rotulo"></div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { criarEcasio, POSES } from "./assets/ecasio-rig.js";
      window.__timelines = window.__timelines || {};
      const NOMES = ["acenar","comemorar","pA","pB","pC","pD","pE","pF","joinha","explicar","lado","pegar","juntas"];
      Object.assign(POSES, {
        pA: () => ({ bracoD: [-0.9, 0, 0.75], antebracoD: [-1.0, 0, 0] }),
        pB: () => ({ bracoD: [-0.7, 0.6, 0.8], antebracoD: [-1.2, 0, 0] }),
        pC: () => ({ bracoD: [-1.0, 0, 0.5], antebracoD: [0, -1.2, 0] }),
        pD: () => ({ bracoD: [-0.5, 0, 0.9], antebracoD: [-1.6, 0, 0] }),
        pE: () => ({ bracoD: [-0.6, -0.5, 0.9], antebracoD: [-1.3, 0, 0] }),
        pF: () => ({ bracoD: [-0.8, 0, 0.9], antebracoD: [0, 0, 1.2] }),
      });
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("cv"), antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      const scene = new THREE.Scene(); scene.background = new THREE.Color("#eef2f8");
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.6;
      const sol = new THREE.DirectionalLight("#fff1dc", 2.2); sol.position.set(1.5, 3, 2.5); sol.castShadow = true;
      scene.add(sol, new THREE.HemisphereLight("#cfe3ff", "#b9c7a0", 0.5));
      const camera = new THREE.PerspectiveCamera(30, 1080 / 1920, 0.01, 50);
      new GLTFLoader().loadAsync("assets/ecasio_v1.glb").then((g) => {
        const p = criarEcasio(THREE, g.scene); scene.add(p.root);
        const dots = new THREE.Group(); scene.add(dots);
        for (const v of Object.values(p.J)) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.012), new THREE.MeshBasicMaterial({ color: "#ff0044", depthTest: false })); s.position.set(...v); s.renderOrder = 9; dots.add(s); }
        const rot = document.getElementById("rotulo");
        const render = (t) => {
          const i = Math.min(NOMES.length - 1, Math.floor(t)); const nome = NOMES[i]; rot.textContent = nome;
          dots.visible = nome === "juntas";
          if (nome === "juntas") { camera.position.set(0, 0.5, 3.0); p.pose({}); }
          else if (nome === "lado") { camera.position.set(2.6, 0.6, 0.6); p.pose(POSES.explicar(t)); }
          else { camera.position.set(0.9, 0.7, 2.6); p.pose(POSES[nome](t)); }
          camera.lookAt(0, 0.48, 0);
          renderer.render(scene, camera);
        };
        const st = { t: 0 }; const tl = gsap.timeline({ paused: true });
        tl.to(st, { t: 13, duration: 13, ease: "none", onUpdate: () => render(st.t) }, 0);
        render(0); window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
