<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Paleta do site housepintura.com.br (site.v2.css) */
      :root {
        --ink-950: #0b1220;
        --blue-600: #2457d6;
        --wa: #1a9e4b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink-950);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Parte 2: massa corrida comum (PVA) na área externa × selador + massa acrílica, com narração (21,5 s, 9:16) -->
    <div data-hf-id="hf-6lcs" id="root" data-composition-id="main" data-start="0" data-duration="21.5" data-width="1080" data-height="1920">
      <!-- O muro: estágios do estrago na chuva, desempenadeira, muro refeito sob a mesma chuva -->
      <div data-hf-id="hf-p11m"
        id="muro"
        class="clip"
        data-composition-id="muro"
        data-composition-src="compositions/muro.html"
        data-start="0"
        data-duration="17.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <!-- Gancho com o balde "uso interno" e o dinheiro voando; já está na tela no quadro 0 (capa) -->
      <div data-hf-id="hf-ppgg"
        id="hook"
        class="clip"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="6.8"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <!-- Selos ❌/✅, marcações do estrago e as três etapas do jeito certo -->
      <div data-hf-id="hf-ikvp"
        id="labels"
        class="clip"
        data-composition-id="labels"
        data-composition-src="compositions/labels.html"
        data-start="6"
        data-duration="11"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div data-hf-id="hf-oodr"
        id="endcard"
        class="clip"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="16.9"
        data-duration="4.6"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <!-- Narração gravada pelo cliente (normalizada em -15 LUFS) -->
      <audio data-hf-id="hf-6idv" id="voice" class="clip" src="assets/narracao-voz.wav" data-start="0" data-duration="20.48" data-track-index="10" data-volume="1"></audio>
      <!-- Chuva sintetizada + efeitos sonoros (tools/build_audio.py), abaixo da voz -->
      <audio data-hf-id="hf-bhmq" id="mix" class="clip" src="assets/audio-mix.wav" data-start="0" data-duration="21.5" data-track-index="11" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
