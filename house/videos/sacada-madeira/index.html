<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Paleta do site housepintura.com.br (site.v2.css) */
      :root {
        --ink-950: #0b1220;
        --blue-600: #2457d6;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink-950);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.4" data-width="1080" data-height="1920">
      <!-- Clipes gerados no Google Flow (Veo 3.1 Fast) a partir das fotos reais da obra -->
      <video
        id="v-pintar"
        class="clip shot"
        src="assets/clips/02-pintar.mp4"
        data-start="2.4"
        data-duration="3.4"
        data-media-start="3.6"
        data-track-index="1"
        muted
        playsinline
        style="z-index: 1"
      ></video>
      <video
        id="v-verniz"
        class="clip shot"
        src="assets/clips/03-verniz.mp4"
        data-start="5.8"
        data-duration="3.2"
        data-media-start="2.6"
        data-track-index="1"
        muted
        playsinline
        style="z-index: 1"
      ></video>
      <video
        id="v-revelacao"
        class="clip shot"
        src="assets/clips/04-revelacao.mp4"
        data-start="9"
        data-duration="7.9"
        data-media-start="0"
        data-track-index="1"
        muted
        playsinline
        style="z-index: 1"
      ></video>
      <div
        id="hook"
        class="clip"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.4"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="overlay"
        class="clip"
        data-composition-id="overlay"
        data-composition-src="compositions/overlay.html"
        data-start="0"
        data-duration="20.4"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="endcard"
        class="clip"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="16.5"
        data-duration="3.9"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <!-- Som: pincelada e verniz dos próprios clipes + efeitos nas entradas, pré-mixados (tools/build_audio.py) -->
      <audio id="mix" class="clip" src="assets/audio-mix.wav" data-start="0" data-duration="20.4" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Aproximação lenta em cada clipe, para a imagem nunca ficar parada
      tl.fromTo("#v-pintar", { scale: 1 }, { scale: 1.07, duration: 3.4, ease: "none" }, 2.4);
      tl.fromTo("#v-verniz", { scale: 1.06 }, { scale: 1, duration: 3.2, ease: "none" }, 5.8);
      tl.fromTo("#v-revelacao", { scale: 1 }, { scale: 1.05, duration: 7.9, ease: "none" }, 9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
