<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #9fd3f5; }
    #world-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">
    <canvas id="world-canvas" width="1080" height="1920"></canvas>
  </div>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import * as N from "./assets/c3d/nucleo.js";
    import * as CEN from "./assets/c3d/cenario.js";
    import * as PIN from "./assets/c3d/props-pintura.js";
    import * as EFE from "./assets/c3d/efeitos.js";
    import { criarPintor, POSES, misturar } from "./assets/c3d/personagens/pintor-rig.js";

    // Tempos ancorados na narração (assets/transcript.json). Mantenha igual a tools/cues.json.
    const C = {
      d1: 4.32, chuva1: 11.0, d2: 14.56, ent2: 21.52, chuva2: 24.6, d3: 28.48, porem3: 36.32, agora3: 40.8,
      d4: 45.12, existe4: 54.8, d5: 59.76, soque5: 67.91, d6: 74.87, agora6: 85.83, d7: 90.55, faca7: 103.11,
      recap: 110.39, cta: 116.15, end: 122.84,
    };
    const { sm, lerp, rnd, aplicarPop } = N;
    const mat = (c, r = 0.9, extra) => N.mat(THREE, c, r, extra);

    const { renderer, scene, camera, sol, hemi } = N.palco(THREE, RoomEnvironment, document.getElementById("world-canvas"));

    // ---------- céu, sol, nuvens, pássaros ----------
    const ceu = CEN.ceu(THREE); scene.add(ceu);
    const CEU = { dia: ["#3f9be8", "#d6f0ff"], chuva: ["#6f7f93", "#b7c2ce"], noite: ["#0b1633", "#27407a"] };
    const tTopo = new THREE.Color(), tBase = new THREE.Color(), cA = new THREE.Color(), cB = new THREE.Color();
    const disco = CEN.sol(THREE, { raio: 1.4 }); disco.position.set(-4.5, 7.5, -16); scene.add(disco);
    const NUV_X = [-3.5, 2.8, 6, -7];
    const nuvensDia = [[-3.5, 5.6, -9, 1.4, 1], [2.8, 6.4, -10, 1.7, 2], [6, 5.2, -12, 1.2, 3], [-7, 6.8, -13, 1.6, 4]].map(([x, y, z, e, s]) => { const n = CEN.nuvem(THREE, { seed: s, escala: e }); n.position.set(x, y, z); scene.add(n); return n; });
    const nuvensChuva = Array.from({ length: 5 }, (_, i) => { const n = CEN.nuvem(THREE, { seed: 10 + i, escala: 1.1, cor: "#8d98a8" }); n.position.set(-2.4 + i * 1.2, 3.6 + (i % 2) * 0.3, 0.4); scene.add(n); return n; });
    const aves = CEN.passaros(THREE, { n: 4 }); aves.position.set(0, 3.4, -2.5); scene.add(aves);

    // ---------- chão, calçada, rua e vizinhança ----------
    scene.add(CEN.chao(THREE, { tamanho: 80 }));
    const calc = CEN.calcada(THREE, { largura: 5.6, profundidade: 1.8 }); calc.position.z = 0.9; scene.add(calc);
    const rua = CEN.rua(THREE, { largura: 40, profundidade: 3.2 }); rua.position.z = 3.8; scene.add(rua);
    for (const [x, z, s, a] of [[-2.6, -0.4, 1, 2.6], [2.7, -0.6, 2, 2.3], [-5.6, -2.5, 3, 2.9], [5.8, -2.2, 4, 2.7], [-3.4, 2.0, 5, 1.9]]) { const a3 = CEN.arvore(THREE, { seed: s, altura: a }); a3.position.set(x, 0, z); scene.add(a3); }
    for (const [x, cor, tel] of [[-5.9, "#ffb84d", "#c2553c"], [6.0, "#7bd389", "#b5523b"], [-9.5, "#f783ac", "#8a4b3a"], [9.6, "#4dabf7", "#c2553c"]]) { const c = CEN.casaVizinha(THREE, { cor, telhado: tel, largura: 2.6, altura: 1.8 }); c.position.set(x, 0, -1.6); scene.add(c); }
    for (const [x, z, s] of [[-1.55, 0.22, 7], [1.55, 0.22, 8]]) { const b = CEN.arbusto(THREE, { seed: s, raio: 0.22 }); b.position.set(x, 0.04, z); scene.add(b); }
    const cant = CEN.canteiro(THREE, { largura: 1.0, profundidade: 0.28, n: 70 }); cant.position.set(0.85, 0.04, 0.18); scene.add(cant);
    for (const x of [-3.6, 3.6]) { const c = CEN.cerca(THREE, { comprimento: 3.6, cor: "#ffffff" }); c.position.set(x, 0, 0.35); scene.add(c); }
    const poste = CEN.poste(THREE, { altura: 3.0 }); poste.position.set(2.5, 0, 1.9); scene.add(poste);
    const correio = CEN.caixaCorreio(THREE); correio.position.set(-2.1, 0, 1.55); scene.add(correio);
    for (const [x, z, cor, s] of [[-1.42, 0.62, "#e8743b", 9], [-1.2, 0.75, "#2457d6", 11]]) { const v = CEN.vaso(THREE, { cor, seed: s }); v.position.set(x, 0.04, z); scene.add(v); }

    // ---------- fachada com textura desenhada em canvas ----------
    const W = 3.4, H = 2.1;
    const tcv = document.createElement("canvas"); tcv.width = 1024; tcv.height = 632;
    const g = tcv.getContext("2d");
    const wallTex = new THREE.CanvasTexture(tcv); wallTex.colorSpace = THREE.SRGBColorSpace; wallTex.anisotropy = 4;
    const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.92 });
    const parede = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.2), [mat("#bdb6a8"), mat("#bdb6a8"), mat("#bdb6a8"), mat("#bdb6a8"), wallMat, mat("#bdb6a8")]);
    parede.position.set(0, H / 2, -0.1); parede.castShadow = true; parede.receiveShadow = true; scene.add(parede);
    // telhado de duas águas
    const tel = new THREE.Shape(); tel.moveTo(-W / 2 - 0.25, 0); tel.lineTo(0, 1.0); tel.lineTo(W / 2 + 0.25, 0); tel.lineTo(-W / 2 - 0.25, 0);
    const telhado = new THREE.Mesh(new THREE.ExtrudeGeometry(tel, { depth: 0.5, bevelEnabled: false }), mat("#b5523b", 0.8));
    telhado.position.set(0, H, -0.45); telhado.castShadow = true; scene.add(telhado);
    const oitao = new THREE.Mesh(new THREE.ShapeGeometry((() => { const s = new THREE.Shape(); s.moveTo(-W / 2, 0); s.lineTo(0, 0.86); s.lineTo(W / 2, 0); return s; })()), mat("#bdb6a8"));
    oitao.position.set(0, H, 0.001); scene.add(oitao);
    // porta e janela (molduras azul-marinho)
    function moldura(x, y, w, h) {
      const gq = new THREE.Group();
      const vidro = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), mat(h > 0.9 ? "#5b3a24" : "#8fb8d8", 0.5));
      gq.add(vidro);
      const m = mat("#1b2f8a", 0.6);
      for (const [px, py, sw, sh] of [[0, h / 2, w + 0.1, 0.06], [0, -h / 2, w + 0.1, 0.06], [-w / 2, 0, 0.06, h], [w / 2, 0, 0.06, h]]) {
        const b = new THREE.Mesh(new THREE.BoxGeometry(sw, sh, 0.08), m); b.position.set(px, py, 0.02); gq.add(b);
      }
      gq.position.set(x, y, 0.03); gq.traverse((o) => { if (o.isMesh) o.castShadow = true; }); scene.add(gq);
    }
    moldura(-0.95, 0.62, 0.62, 1.2);
    moldura(0.85, 1.15, 0.9, 0.62);

    // estados da parede
    const R = rnd(7);
    const manchas = Array.from({ length: 70 }, () => [R(), R(), 6 + R() * 30, R()]);
    const gotas = Array.from({ length: 90 }, () => [R(), R() * 0.5, 0.15 + R() * 0.45, 2 + R() * 4]);
    const placas = [...Array.from({ length: 26 }, () => [R(), 0.08 + R() * 0.8, 20 + R() * 55, 14 + R() * 40, R()]), ...Array.from({ length: 22 }, () => [0.42 + R() * 0.36, 0.3 + R() * 0.45, 30 + R() * 50, 20 + R() * 34, R()])];
    const trincas = Array.from({ length: 5 }, (_, i) => { const r2 = rnd(100 + i); const pts = [[0.12 + i * 0.19 + r2() * 0.05, 0.15 + r2() * 0.2]]; for (let k = 0; k < 9; k++) { const [x, y] = pts[pts.length - 1]; pts.push([x + (r2() - 0.5) * 0.05, y + 0.05 + r2() * 0.03]); } return pts; });
    const fios = Array.from({ length: 40 }, (_, i) => { const r2 = rnd(300 + i); const x = r2(), y = r2() * 0.9; return [[x, y], [x + (r2() - 0.5) * 0.06, y + 0.03 + r2() * 0.04], [x + (r2() - 0.5) * 0.1, y + 0.06 + r2() * 0.05]]; });

    function reboco(cor = "#b9b0a1") {
      g.fillStyle = cor; g.fillRect(0, 0, 1024, 632);
      const r = rnd(11);
      for (let i = 0; i < 2600; i++) { g.fillStyle = r() < 0.5 ? "rgba(0,0,0,0.05)" : "rgba(255,255,255,0.06)"; g.fillRect(r() * 1024, r() * 632, 2 + r() * 4, 2 + r() * 4); }
    }
    function demao(cor, k, sheen = 0) { // pinta da esquerda para a direita até a fração k
      if (k <= 0) return;
      g.save(); g.beginPath(); g.rect(0, 0, 1024 * k, 632); g.clip();
      g.fillStyle = cor; g.fillRect(0, 0, 1024, 632);
      if (sheen) { const gr = g.createLinearGradient(0, 0, 0, 632); gr.addColorStop(0, `rgba(255,255,255,${sheen})`); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 1024, 632); }
      const r = rnd(23); for (let i = 0; i < 900; i++) { g.fillStyle = "rgba(0,0,0,0.025)"; g.fillRect(r() * 1024, r() * 632, 3, 3); }
      g.restore();
      if (k < 1) { g.fillStyle = "rgba(0,0,0,0.08)"; g.fillRect(1024 * k - 3, 0, 6, 632); }
    }
    function escorrido(k, cor = "rgba(150,140,120,0.55)") { // listras de chuva e manchas
      if (k <= 0) return;
      for (const [x, y, len, wdt] of gotas) { g.fillStyle = cor; g.fillRect(x * 1024, y * 632, wdt, len * 632 * k); }
      for (const [x, y, r, a] of manchas) { g.fillStyle = `rgba(120,110,95,${0.18 * k * (0.5 + a)})`; g.beginPath(); g.ellipse(x * 1024, (0.4 + y * 0.6) * 632, r * 1.6, r, 0, 0, 7); g.fill(); }
    }
    function esfarelado(k) { // PVA: pó claro e falhas
      if (k <= 0) return;
      const r = rnd(41); for (let i = 0; i < 700 * k; i++) { g.fillStyle = "rgba(255,255,255,0.35)"; g.fillRect(r() * 1024, r() * 632, 4 + r() * 10, 2 + r() * 4); }
      for (const [x, y, r2] of manchas) { g.fillStyle = `rgba(185,176,161,${0.75 * k})`; g.beginPath(); g.arc(x * 1024, y * 632, r2 * 0.8 * k, 0, 7); g.fill(); }
    }
    function descascado(k) {
      if (k <= 0) return;
      for (const [x, y, w, h, a] of placas) {
        const kk = Math.min(1, Math.max(0, k * 1.4 - a * 0.4)); if (kk <= 0) continue;
        g.fillStyle = "#b9b0a1"; g.beginPath(); g.ellipse(x * 1024, y * 632, w * kk, h * kk, a, 0, 7); g.fill();
        g.strokeStyle = "rgba(255,255,255,0.9)"; g.lineWidth = 3; g.stroke();
        g.strokeStyle = "rgba(0,0,0,0.25)"; g.lineWidth = 1.5; g.beginPath(); g.ellipse(x * 1024 + 2, y * 632 + 3, w * kk, h * kk, a, 0.2, 3); g.stroke();
      }
    }
    function trinca(k, preench = 0) {
      if (k <= 0) return;
      for (const pts of trincas) {
        const n = Math.max(2, Math.round(pts.length * k));
        g.strokeStyle = preench > 0 ? `rgba(240,236,226,${preench})` : "rgba(60,50,40,0.9)";
        g.lineWidth = preench > 0 ? 9 : 4; g.beginPath();
        pts.slice(0, n).forEach(([x, y], i) => (i ? g.lineTo(x * 1024, (1 - y) * 632) : g.moveTo(x * 1024, (1 - y) * 632))); g.stroke();
        if (preench > 0 && preench < 1) { g.strokeStyle = `rgba(60,50,40,${0.9 * (1 - preench)})`; g.lineWidth = 3; g.stroke(); }
      }
    }
    function fissuras(k) {
      if (k <= 0) return;
      g.strokeStyle = `rgba(90,80,65,${0.75 * k})`; g.lineWidth = 1.6;
      for (const f of fios.slice(0, Math.round(fios.length * k))) { g.beginPath(); f.forEach(([x, y], i) => (i ? g.lineTo(x * 1024, y * 632) : g.moveTo(x * 1024, y * 632))); g.stroke(); }
    }
    function barrado(k) { if (k <= 0) return; g.fillStyle = "#2457d6"; g.fillRect(0, 632 * 0.82, 1024 * k, 632 * 0.18); }

    const CREME = "#efd6a0";
    let chaveAnt = "";
    function desenharParede(t) {
      let ch;
      const p = (a, b) => Math.round(sm(a, b, t) * 40) / 40;
      if (t < 1.3 || t >= C.d6 + 7.3) ch = "final|" + p(C.d6 + 1, C.d6 + 7);
      else if (t < C.d2) ch = "cal|" + p(C.d1 + 1.2, C.d1 + 6) + "|" + p(C.chuva1 + 0.6, C.d2);
      else if (t < C.d3) ch = "pva|" + p(C.d2 + 0.8, C.d2 + 5.5) + "|" + p(C.chuva2 + 0.6, C.d3);
      else if (t < C.d4) ch = "acr|" + p(C.d3 + 0.6, C.d3 + 4.5) + "|" + p(C.porem3 + 1.4, C.agora3);
      else if (t < C.d5) ch = "sel|" + p(C.d4 + 0.5, C.d4 + 4.5) + "|" + p(C.d4 + 5.3, C.d4 + 9.2) + "|" + p(C.existe4 + 0.6, C.existe4 + 3);
      else if (t < C.d6) ch = "tri|" + p(C.d5 + 0.5, C.d5 + 6) + "|" + p(C.soque5 + 1, C.d6 - 0.3);
      else ch = "ela|" + p(C.d6 + 1, C.d6 + 7);
      if (ch === chaveAnt) return;
      chaveAnt = ch;
      const v = ch.split("|"), a = +v[1], b = +v[2], c = +v[3];
      if (v[0] === "final") { reboco(); demao(CREME, 1, 0.05); barrado(1); }
      else if (v[0] === "cal") { reboco(); demao("#f7f6f1", a); escorrido(b); }
      else if (v[0] === "pva") { reboco(); demao("#f7f6f1", 1); escorrido(1); demao("#ecdcb6", a); esfarelado(b); }
      else if (v[0] === "acr") { reboco(); demao(CREME, a, 0.12); if (a < 1) { g.save(); g.globalCompositeOperation = "destination-over"; g.restore(); } descascado(b); }
      else if (v[0] === "sel") { reboco("#b3aa9a"); demao("rgba(205,200,188,0.55)", b); trinca(c); }
      else if (v[0] === "tri") { reboco("#b3aa9a"); demao("rgba(205,200,188,0.55)", 1); trinca(1, a); fissuras(b); }
      else if (v[0] === "ela") { reboco("#b3aa9a"); demao("rgba(205,200,188,0.55)", 1); trinca(1, 1); fissuras(1 - a); demao(CREME, a, 0.08); barrado(a); }
      wallTex.needsUpdate = true;
    }


    // ---------- latas, ferramentas e cenário de obra (entram com "pop" e ficam: o cenário acumula) ----------
    const lona = PIN.lona(THREE, { largura: 1.5, profundidade: 0.8 }); lona.position.set(0.25, 0, 0.55); scene.add(lona);
    const balde = PIN.balde(THREE); balde.position.set(0.62, 0.045, 0.78); scene.add(balde);
    const escada = PIN.escada(THREE, { altura: 1.05 }); escada.position.set(1.95, 0.04, 0.45); escada.rotation.y = -0.4; scene.add(escada);
    const bandeja = PIN.bandeja(THREE, { tinta: CREME }); bandeja.position.set(-0.3, 0.045, 0.82); bandeja.rotation.y = 0.3; scene.add(bandeja);
    const fita = PIN.fitaCrepe(THREE); fita.position.set(-0.55, 0.045, 0.7); scene.add(fita);
    const LATAS = [
      [C.d2, PIN.lata(THREE, { cor: "#ecdcb6", rotulo: "#6b8bd6", texto: "PVA" }), [0.85, 0.66]],
      [C.d3, PIN.lata(THREE, { cor: CREME, rotulo: "#ff8a3d", texto: "ACR" }), [1.05, 0.78]],
      [C.d4 + 5, PIN.lata(THREE, { cor: "#d9d2c4", rotulo: "#1a9e4b", texto: "SEL" }), [1.25, 0.64]],
      [C.d5, PIN.bisnaga(THREE, { rotulo: "#9775fa" }), [1.42, 0.8]],
      [C.d6, PIN.lata(THREE, { cor: CREME, rotulo: "#2457d6", texto: "ELAST", altura: 0.21, raio: 0.095 }), [1.62, 0.66]],
    ].map(([t0, obj, [x, z]]) => { obj.position.set(x, 0.045, z); scene.add(obj); return [t0, obj]; });
    const fer = { broxa: PIN.broxa(THREE), rolo: PIN.rolo(THREE), lixa: PIN.lixa(THREE), espatula: PIN.espatula(THREE) };

    // ---------- efeitos ----------
    const chuva = EFE.chuva(THREE, { n: 800, area: [7, 4.2, 3.6], centro: [0, 0, 1.4] }); scene.add(chuva.obj);
    const po = EFE.poeira(THREE, { n: 160 }); scene.add(po.obj);
    const resp = EFE.respingos(THREE, { n: 46, tamanho: 0.026 }); scene.add(resp.obj);
    const brilho = EFE.brilhos(THREE, { n: 18, raio: 1.5 }); brilho.obj.position.set(0, 0.5, 0.15); scene.add(brilho.obj);
    const conf = EFE.confete(THREE, { n: 260, area: [3.4, 3, 2] }); conf.obj.position.set(0, 0, 0.8); scene.add(conf.obj);

    // ---------- câmera: planos por trecho, com aproximação lenta dentro de cada plano ----------
    const P = {
      aberta: { pos: [2.4, 1.6, 6.0], alvo: [0, 1.1, 0] },
      frente: { pos: [0.0, 0.85, 2.7], alvo: [0, 0.65, 0.6] },
      media: { pos: [1.7, 1.0, 3.0], alvo: [0.05, 0.85, 0.2] },
      lado: { pos: [2.1, 1.05, 1.6], alvo: [0, 0.9, 0.3] },
      parede: { pos: [0.7, 1.1, 1.5], alvo: [0.3, 0.95, 0] },
      close: { pos: [0.15, 0.85, 1.75], alvo: [0, 0.82, 0.75] },
      balde: { pos: [0.28, 0.45, 1.65], alvo: [0.62, 0.14, 0.78] },
      ceu: { pos: [1.6, 1.3, 5.2], alvo: [0, 1.9, 0] },
    };
    const PLANOS = [
      [0, "aberta"], [1.3, "frente"], [C.d1, "media"], [C.chuva1, "ceu"], [C.d2, "lado"], [C.ent2, "frente"], [C.chuva2, "aberta"],
      [C.d3, "media"], [C.porem3, "parede"], [C.agora3, "frente"], [C.d4, "lado"], [C.existe4, "parede"], [C.d5, "media"],
      [C.soque5, "aberta"], [C.d6, "media"], [C.agora6, "aberta"], [C.d7, "aberta"], [C.faca7, "frente"], [C.recap, "balde"], [C.recap + 2.2, "aberta"], [C.cta, "close"],
    ];
    const vA = new THREE.Vector3(), vB = new THREE.Vector3(), alvo = new THREE.Vector3(), dir = new THREE.Vector3();
    function cam(t) {
      const i = PLANOS.findLastIndex((p) => p[0] <= t);
      const [t0, nome] = PLANOS[i], ant = PLANOS[i - 1], t1 = PLANOS[i + 1] ? PLANOS[i + 1][0] : C.end;
      const k = ant ? sm(t0, t0 + (t0 === C.recap + 2.2 ? 3.2 : 0.9), t) : 1;
      const a = ant ? P[ant[1]] : P[nome], b = P[nome];
      vA.set(...a.pos); vB.set(...b.pos); camera.position.lerpVectors(vA, vB, k);
      vA.set(...a.alvo); vB.set(...b.alvo); alvo.lerpVectors(vA, vB, k);
      // aproximação lenta (até 8% da distância) ao longo do plano + leve deriva lateral
      const prog = Math.min(1, Math.max(0, (t - t0) / Math.max(1, t1 - t0)));
      dir.subVectors(alvo, camera.position).multiplyScalar(0.08 * prog); camera.position.add(dir);
      camera.position.x += Math.sin(t * 0.25) * 0.05;
      camera.lookAt(alvo);
    }

    // ---------- roteiro do pintor ----------
    // [início, pose, frente para a parede?, ferramenta, x]
    const ATOS = [
      [0, "idle", false, null, 0.1], [C.d1, "pegar", false, null, 0.1], [C.d1 + 1.2, "pintar_broxa", true, "broxa", 0.1],
      [C.chuva1, "olhar_em_volta", false, "broxa", 0.1], [C.d2 - 0.2, "pegar", false, null, 0.1], [C.d2 + 0.7, "pintar_rolo", true, "rolo", 0.1], [C.ent2, "explicar", false, "rolo", 0.1],
      [C.chuva2, "pensar", false, null, 0.1], [C.d3 - 0.2, "pegar", false, null, 0.1], [C.d3 + 0.6, "pintar_rolo", true, "rolo", 0.1], [C.d3 + 5, "apontar", false, "rolo", 0.1],
      [C.porem3, "olhar_em_volta", false, null, 0.1], [C.agora3, "explicar", false, null, 0.1],
      [C.d4, "lixar", true, "lixa", 0.1], [C.d4 + 5.2, "pintar_rolo", true, "rolo", 0.1], [C.existe4, "apontar", false, null, 0.1],
      [C.d5, "lixar", true, "espatula", 0.1], [C.d5 + 6.5, "explicar", false, null, 0.1], [C.soque5, "pensar", false, null, 0.1],
      [C.d6 - 0.2, "pegar", false, null, 0.1], [C.d6 + 0.7, "pintar_rolo", true, "rolo", 0.1], [C.agora6, "comemorar", false, null, 0.1], [C.agora6 + 2.2, "joinha", false, null, 0.1],
      [C.d7, "explicar", false, null, 0.1], [C.d7 + 5, "apontar", false, null, 0.1], [C.d7 + 9, "explicar", false, null, 0.1], [C.faca7, "joinha", false, null, 0.1],
      [C.recap, "idle", false, null, 0.1], [C.recap + 2.6, "comemorar", false, null, 0.1], [C.cta, "acenar", false, null, 0.1],
    ];
    let pintor = null;
    const FADE = 0.45, mao = new THREE.Vector3();
    function atuar(t) {
      const i = ATOS.findLastIndex((a) => a[0] <= t), at = ATOS[i], ant = ATOS[i - 1];
      const k = ant ? sm(at[0], at[0] + FADE, t) : 1;
      const pose = misturar(ant ? POSES[ant[1]](t) : {}, POSES[at[1]](t), k);
      const ryA = ant && ant[2] ? Math.PI * 0.82 : 0, ryB = at[2] ? Math.PI * 0.82 : 0;
      pose.raiz = { ...(pose.raiz || {}), ry: lerp(ryA, ryB, k) };
      pintor.pose(pose);
      pintor.root.position.set(at[4], 0.045, at[2] ? lerp(0.55, 0.45, k) : 0.62);
      for (const [nome, obj] of Object.entries(fer)) { if (at[3] === nome) aplicarPop(obj, t, at[0], 0.4); else obj.visible = false; }
      // respingos saem da ferramenta enquanto pinta; pó sai da lixa
      const pintando = at[2] && (at[3] === "rolo" || at[3] === "broxa");
      pintor.osso("maoD").getWorldPosition(mao);
      resp.obj.position.set(mao.x, mao.y - 0.15, mao.z - 0.05);
      const corResp = t >= C.d6 ? CREME : t >= C.d4 ? "#d9d2c4" : t >= C.d3 ? CREME : t >= C.d2 ? "#ecdcb6" : "#ffffff";
      resp.atualizar(t, pintando ? sm(at[0], at[0] + 0.5, t) : 0, corResp);
      po.obj.position.set(mao.x, mao.y - 0.1, mao.z + 0.05);
      po.atualizar(t, at[3] === "lixa" && at[2] ? 1 : 0);
    }

    // ---------- relógio ----------
    function render(t) {
      desenharParede(t);
      const chuvaK = Math.max(sm(C.chuva1, C.chuva1 + 0.8, t) * (1 - sm(C.d2 - 0.6, C.d2, t)), sm(C.chuva2, C.chuva2 + 0.8, t) * (1 - sm(C.d3 - 0.6, C.d3, t)), sm(C.agora6 + 0.3, C.agora6 + 1, t) * (1 - sm(C.d7 - 0.8, C.d7, t)));
      const ciclo = t > C.soque5 && t < C.d6 ? Math.sin(((t - C.soque5) / (C.d6 - C.soque5)) * Math.PI * 2) : 0;
      const noite = Math.max(0, -ciclo) * 0.92;
      const lapso = t > C.porem3 && t < C.agora3 ? (t - C.porem3) / (C.agora3 - C.porem3) : 0;
      // céu: dia → chuva → noite
      tTopo.set(CEU.dia[0]).lerp(cA.set(CEU.chuva[0]), chuvaK).lerp(cB.set(CEU.noite[0]), noite);
      tBase.set(CEU.dia[1]).lerp(cA.set(CEU.chuva[1]), chuvaK).lerp(cB.set(CEU.noite[1]), noite);
      ceu.userData.cores.topo.value.copy(tTopo); ceu.userData.cores.base.value.copy(tBase);
      disco.visible = noite < 0.3 && chuvaK < 0.5;
      const ang = lapso > 0 ? lapso * Math.PI * 6 : t > C.soque5 && t < C.d6 ? ((t - C.soque5) / (C.d6 - C.soque5)) * Math.PI * 2 : 0.6;
      sol.position.set(Math.cos(ang) * 4 + 2, 5 * Math.max(0.25, Math.abs(Math.sin(ang + 1.2))), 4);
      disco.position.x = -4.5 + (lapso > 0 ? Math.cos(ang) * 6 : 0);
      sol.intensity = 2.4 * (1 - 0.6 * chuvaK) * (1 - noite);
      hemi.intensity = 0.65 * (1 - 0.55 * noite);
      poste.userData.lampada.emissiveIntensity = 0.4 + noite * 3;
      nuvensDia.forEach((n, i) => { n.position.x = NUV_X[i] + Math.sin(t * 0.05 + i) * 0.8; n.userData.material.opacity = 1 - chuvaK * 0.6; });
      nuvensChuva.forEach((n, i) => { n.userData.material.opacity = chuvaK * 0.95; n.visible = chuvaK > 0.02; n.position.x = -2.4 + i * 1.2 + Math.sin(t * 0.3 + i) * 0.1; });
      aves.userData.atualizar(t); aves.visible = chuvaK < 0.3 && noite < 0.3;
      chuva.atualizar(t, chuvaK);
      for (const [t0, l] of LATAS) { if (t < 1.3 || t >= C.recap) { if (l.userData.escala0) l.scale.copy(l.userData.escala0); l.visible = true; } else aplicarPop(l, t, t0 + 0.3, 0.55); }
      brilho.atualizar(t, Math.max(sm(C.d6 + 6.5, C.d6 + 7.3, t) * (1 - sm(C.d7 - 0.5, C.d7, t)), t < 1.2 ? 1 : 0, sm(C.recap + 2.4, C.recap + 3, t) * (1 - sm(C.cta, C.cta + 0.5, t))));
      conf.atualizar(t, Math.max(sm(C.agora6, C.agora6 + 0.3, t) * (1 - sm(C.agora6 + 2.4, C.agora6 + 3, t)), sm(C.recap + 2.6, C.recap + 3, t) * (1 - sm(C.cta + 0.3, C.cta + 1, t))));
      if (pintor) atuar(t);
      cam(t);
      renderer.render(scene, camera);
    }

    new GLTFLoader().loadAsync("assets/c3d/personagens/pintor.glb").then((gltf) => {
      pintor = criarPintor(THREE, gltf.scene);
      scene.add(pintor.root);
      const maoD = pintor.osso("maoD");
      for (const o of Object.values(fer)) { o.position.set(-0.03, -0.02, 0.02); maoD.add(o); }
      return document.fonts.ready;
    }).then(() => {
      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: C.end, duration: C.end, ease: "none", onUpdate: () => render(st.t) }, 0);
      render(0);
      window.__timelines["world"] = tl;
    });
  </script>
</template>
