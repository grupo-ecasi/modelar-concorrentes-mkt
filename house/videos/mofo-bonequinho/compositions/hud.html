    <div data-hf-id="hf-xff3" id="hud-k2" class="hud-abs hud-item is-green" style="top: 640px">
      <div data-hf-id="hf-j3q8" class="ic"><svg data-hf-id="hf-u81e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-l5ki" d="M20 6 9 17l-5-5" /></svg></div>
      <div data-hf-id="hf-s4jc" class="tx">Seca</div>
    </div>
    <div data-hf-id="hf-2585" id="hud-k3" class="hud-abs hud-item is-green" style="top: 810px">
      <div data-hf-id="hf-ipf7" class="ic"><svg data-hf-id="hf-umcf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-ljvj" d="M20 6 9 17l-5-5" /></svg></div>
      <div data-hf-id="hf-ddua" class="tx">Sem mofo<span data-hf-id="hf-nlf5" class="sub">antes de pintar</span></div>
    </div>

    <!-- Fecho em loop -->
    <div data-hf-id="hf-t8dz" id="hud-end" class="hud-abs hud-title" style="top: 330px; font-size: 120px">
      <span data-hf-id="hf-u0c9" class="w" id="hud-end1">Mofo voltou?</span><br data-hf-id="hf-regs" />
      <span data-hf-id="hf-jchb" class="w hud-blue" id="hud-end2">Uma camada</span><br data-hf-id="hf-r05r" />
      <span data-hf-id="hf-kwqg" class="w" id="hud-end3">está faltando.</span>
    </div>
  </div>
  <script>
    /*CUES*/
    const C = {
      "hook": 0.0,
      "volta": 2.48,
      "mancha": 3.6,
      "mas": 4.72,
      "vivo": 5.92,
      "embaixo": 6.32,
      "camadas": 8.4,
      "problema": 11.04,
      "fungo2": 12.48,
      "umidade1": 13.92,
      "p70": 15.36,
      "tempo": 16.8,
      "cria": 17.76,
      "raizes": 18.16,
      "poros": 19.12,
      "esconde": 21.28,
      "c1": 22.64,
      "achar": 23.84,
      "infiltracao": 25.6,
      "vazamento": 26.72,
      "vapor": 28,
      "ventilacao": 29.12,
      "resolver": 30.48,
      "c2": 33.2,
      "matar": 34.48,
      "agua": 35.84,
      "rotulo": 38.16,
      "luva": 39.04,
      "janela": 39.6,
      "agir": 41.12,
      "enxagua": 41.92,
      "secar": 44,
      "nunca": 45.12,
      "c3": 47.84,
      "certa": 50,
      "base": 50.88,
      "antimofo1": 53.28,
      "banheiro": 54.48,
      "lavavel": 56.48,
      "mito": 57.76,
      "naoMito": 60.4,
      "protege": 61.53,
      "umida": 64.49,
      "voltaBaixo": 66.17,
      "norma": 66.73,
      "limpa": 72.65,
      "seca": 73.29,
      "semMofo": 74.25,
      "cta": 76.01,
      "house": 77.21,
      "causa2": 79.29,
      "orcamento": 80.81,
      "loop": 83.05,
      "dessas": 84.73,
      "faltando": 85.85,
      "end": 87.31
    };
    /*END-CUES*/

    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const ENTER = "expo.out";

    function show(sel, a, b, opts = {}) {
      const el = $(sel);
      const dy = opts.dy ?? 24;
      tl.set(el, { visibility: "visible" }, 0);
      tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: opts.dur ?? 0.6, ease: ENTER }, a);
      if (b != null) {
        tl.to(el, { opacity: 0, y: -10, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
        tl.set(el, { visibility: "hidden" }, b);
      }
    }
    function section(sel, a, b) {
      const el = $(sel);
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, a);
      tl.fromTo(el.querySelector(".n"), { scale: 0.55, opacity: 0, filter: "blur(14px)", transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, a);
      tl.fromTo(el.querySelector(".t"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, a + 0.22);
      tl.fromTo(el.querySelector(".s"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: ENTER }, a + 0.36);
      tl.to(el, { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
      tl.set(el, { visibility: "hidden" }, b);
    }
    function count(sel, to, at, dur = 0.8) {
      const p = { v: 0 };
      tl.fromTo(p, { v: 0 }, { v: to, duration: dur, ease: "power2.out", onUpdate: () => ($(sel).textContent = String(Math.round(p.v))) }, at);
    }
    const CHIP = {
      off: { backgroundColor: "#ffffff", borderColor: "#dfe6f1", color: "#6b7689" },
      on: { backgroundColor: "#2457d6", borderColor: "#2457d6", color: "#ffffff" },
      done: { backgroundColor: "#dce8fd", borderColor: "#b9cff6", color: "#163c85" },
    };
    const chip = (n, state, at) => tl.to("#hud-chip" + n, { ...CHIP[state], duration: 0.3, ease: "power2.inOut" }, at);
    function vignette(a, b, peak = 1) {
      tl.to("#hud-vig", { opacity: peak, duration: 0.5, ease: "power2.out" }, a);
      tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, b - 0.6);
    }
    // Flash curto nos cortes para o raio-x da parede (mesmos tempos de world.html)
    const flash = (t) => {
      tl.fromTo("#hud-flash", { opacity: 0.85 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, t);
    };
    [C.mas - 0.15, C.cria - 0.2, C.c3 + 1.0, C.mito + 0.6].forEach(flash);

    // Abertura (o primeiro quadro já mostra o título, para o loop emendar)
    tl.set("#hud-hook", { opacity: 1 }, 0);
    tl.to("#hud-hook", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, C.volta - 0.12);
    tl.set("#hud-hook", { visibility: "hidden" }, C.volta + 0.1);
    tl.fromTo("#hud-volta", { opacity: 0, scale: 1.25, filter: "blur(12px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, C.volta);
    tl.to("#hud-volta", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, C.mas - 0.25);
    tl.set("#hud-volta", { visibility: "hidden" }, C.mas - 0.05);
    vignette(C.volta, C.camadas, 0.8);
    show("#hud-vivo", C.vivo - 0.1, C.camadas - 0.35);

    // Barra 1-2-3: entra em "três camadas"
    [1, 2, 3].forEach((n, i) => {
      tl.fromTo("#hud-chip" + n, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER }, C.camadas + i * 0.12);
    });
    chip(1, "on", C.c1);
    chip(1, "done", C.c2);
    chip(2, "on", C.c2);
    chip(2, "done", C.c3);
    chip(3, "on", C.c3);
    chip(3, "done", C.mito);
    tl.to("#hud-chips", { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, C.cta - 0.1);
    tl.fromTo("#hud-chips", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER, immediateRender: false }, C.loop + 0.1);
    chip(1, "on", C.dessas);
    chip(2, "on", C.dessas + 0.15);
    chip(3, "on", C.dessas + 0.3);

    // Problema: 70% de umidade
    show("#hud-c70", C.umidade1 - 0.1, C.cria - 0.25);
    count("#hud-v70", 70, C.p70 - 0.5, 0.7);
    tl.fromTo("#hud-m70", { scaleX: 0 }, { scaleX: 0.7, duration: 0.7, ease: "power2.out" }, C.p70 - 0.5);
    show("#hud-cesc", C.esconde - 0.45, C.c1 - 0.15);

    // Camada 1
    section("#hud-s1", C.c1, C.infiltracao - 0.15);
    show("#hud-a1", C.infiltracao - 0.15, C.resolver - 0.1);
    show("#hud-a2", C.vazamento - 0.1, C.resolver - 0.1);
    show("#hud-a3", C.vapor - 0.1, C.resolver - 0.1);
    show("#hud-cres", C.resolver - 0.1, C.c2);
    vignette(C.resolver, C.c2 + 0.2, 0.6);

    // Camada 2
    section("#hud-s2", C.c2, C.agua - 0.1);
    show("#hud-cagua", C.agua - 0.1, C.agir - 0.1);
    show("#hud-b1", C.agir - 0.1, C.nunca - 0.1);
    show("#hud-b2", C.enxagua - 0.1, C.nunca - 0.1);
    show("#hud-b3", C.secar - 0.1, C.nunca - 0.1);
    show("#hud-nunca", C.nunca - 0.1, C.c3, { dur: 0.45 });

    // Camada 3
    section("#hud-s3", C.c3, C.base - 0.1);
    show("#hud-d1", C.base - 0.1, C.mito);
    show("#hud-d2", C.antimofo1 - 0.1, C.mito);
    show("#hud-d3", C.banheiro - 0.1, C.mito);

    // Mito
    show("#hud-alert", C.mito, C.norma, { dur: 0.45 });
    tl.fromTo("#hud-nao", { opacity: 0, scale: 1.25, filter: "blur(12px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, C.naoMito);
    tl.to("#hud-nao", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, C.protege - 0.2);
    tl.set("#hud-nao", { visibility: "hidden" }, C.protege);
    show("#hud-cmito", C.protege - 0.1, C.norma);
    vignette(C.voltaBaixo - 0.6, C.norma + 0.2, 0.8);

    // Norma
    show("#hud-norma-head", C.norma + 0.3, C.cta);
    show("#hud-k1", C.limpa - 0.15, C.cta);
    show("#hud-k2", C.seca - 0.15, C.cta);
    show("#hud-k3", C.semMofo - 0.15, C.cta);

    // Fecho: a vinheta volta aos poucos para emendar com o primeiro quadro
    tl.set("#hud-end", { opacity: 1, visibility: "visible" }, C.loop - 0.05);
    tl.fromTo("#hud-end1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.loop);
    tl.fromTo("#hud-end2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.dessas - 0.3);
    tl.fromTo("#hud-end3", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.faltando - 0.1);
    tl.to("#hud-vig", { opacity: 0.6, duration: 1.2, ease: "power1.inOut" }, C.end - 1.4);

    window.__timelines["hud"] = tl;
  </script>
</template>
