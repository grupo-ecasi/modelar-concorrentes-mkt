  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js";

    // Tempos ancorados na narração (assets/transcript.json). Fonte única: tools/cues.json
    /*CUES*/
    const C = {
      "hook": 0.0,
      "ontem": 0.88,
      "pode": 1.68,
      "pintar": 1.92,
      "ainda": 2.8,
      "nao": 3.36,

      "pronta": 5.76,
      "camadas": 6.8,
      "problema": 9.76,
      "reboco": 10.4,
      "agua": 11.76,
      "cal": 12.16,
      "agora": 13.76,
      "empurrando": 14.96,
      "bolhas": 16.96,
      "manchas": 17.6,
      "descascando": 19.2,
      "c1": 20.4,
      "esperar": 21.68,
      "cura": 23.92,
      "secar": 25.52,
      "c2": 26.72,
      "limpar": 28,
      "escova": 29.6,
      "esfarela": 32.24,
      "fundo": 33.6,
      "c3": 35.2,
      "selar": 36.32,
      "selador": 37.12,
      "iguala": 40.24,
      "rende": 42.4,
      "mito": 43.36,
      "seco2": 44.4,
      "basta": 45.36,
      "ph": 47.52,
      "alcalino": 50.56,
      "mancha": 52.64,
      "solta": 53.36,
      "norma": 54.56,
      "pede": 57.04,
      "cta": 60.43,
      "house": 61.55,
      "whatsapp": 63.87,
      "loop": 64.75,
      "espera": 66.27,
      "prepara": 67.15,
      "sela": 68.19,
      "antes": 69.07,
      "end": 71.09
    };
    /*END-CUES*/

    const W = 1080;
    const H = 1920;
    const canvas = document.getElementById("world-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog("#dcecf8", 22, 60);
    const camera = new THREE.PerspectiveCamera(34, W / H, 0.05, 200);

    // ---------- Utilidades determinísticas ----------
    const hash = (n) => {
      const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return s - Math.floor(s);
    };
    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const prog = (t, a, b) => clamp01((t - a) / (b - a));
    const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const easeOut = (x) => 1 - Math.pow(1 - x, 3);
    const easeOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
    const lerp = (a, b, x) => a + (b - a) * x;
    const lerp3 = (a, b, x) => [lerp(a[0], b[0], x), lerp(a[1], b[1], x), lerp(a[2], b[2], x)];
    const spring = (x) => (x <= 0 ? 0 : 1 - Math.exp(-6 * x) * Math.cos(9 * x));
    function track(t, keys) {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 0; i < keys.length - 1; i++) {
        const [ta, va] = keys[i];
        const [tb, vb] = keys[i + 1];
        if (t <= tb) return tb === ta ? vb : lerp(va, vb, easeInOut((t - ta) / (tb - ta)));
      }
      return keys[keys.length - 1][1];
    }
    function track3(t, keys) {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 0; i < keys.length - 1; i++) {
        const [ta, va] = keys[i];
        const [tb, vb] = keys[i + 1];
        if (t <= tb) return tb === ta ? vb : lerp3(va, vb, easeInOut((t - ta) / (tb - ta)));
      }
      return keys[keys.length - 1][1];
    }

    // ---------- Materiais e texturas ----------
    const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, metalness: 0, ...extra });
    const smooth = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.62, metalness: 0, ...extra });
    function canvasTex(w, h, draw, rep = [1, 1]) {
      const cv = document.createElement("canvas");
      cv.width = w;
      cv.height = h;
      draw(cv.getContext("2d"), w, h);
      const tx = new THREE.CanvasTexture(cv);
      tx.colorSpace = THREE.SRGBColorSpace;
      tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
      tx.repeat.set(rep[0], rep[1]);
      tx.anisotropy = 4;
      return tx;
    }
    function textTex(lines, { bg = "#ffffff", fg = "#0b1220", w = 256, h = 128, size = 48, font = '"Barlow Condensed", sans-serif', weight = 800 } = {}) {
      return canvasTex(w, h, (g) => {
        g.fillStyle = bg;
        g.fillRect(0, 0, w, h);
        g.fillStyle = fg;
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.font = `${weight} ${size}px ${font}`;
        lines.forEach((ln, i) => g.fillText(ln, w / 2, h / 2 + (i - (lines.length - 1) / 2) * size * 1.05));
      });
    }
    // Reboco: textura clara e rugosa; a cor do material dá o tom (molhado = escuro, seco = claro)
    const rebocoTex = canvasTex(512, 256, (g, w, h) => {
      g.fillStyle = "#e9e6df";
      g.fillRect(0, 0, w, h);
      for (let i = 0; i < 2600; i++) {
        const v = 200 + Math.floor(hash(i) * 55);
        g.fillStyle = `rgb(${v},${v - 2},${v - 6})`;
        g.fillRect(hash(i + 0.3) * w, hash(i + 0.7) * h, 1 + hash(i + 0.9) * 3, 1 + hash(i + 0.1) * 3);
      }
      g.strokeStyle = "rgba(120,115,105,0.18)";
      g.lineWidth = 2;
      for (let i = 0; i < 26; i++) {
        g.beginPath();
        const y = hash(i + 50) * h;
        g.moveTo(0, y);
        g.bezierCurveTo(w * 0.3, y + 10, w * 0.6, y - 8, w, y + 4);
        g.stroke();
      }
    });
    // Manchas de umidade (alfa), que somem com a secagem
    const wetTex = canvasTex(512, 256, (g, w, h) => {
      g.clearRect(0, 0, w, h);
      for (let i = 0; i < 46; i++) {
        const x = hash(i + 7) * w;
        const y = hash(i + 13) * h;
        const r = 20 + hash(i + 19) * 70;
        const grd = g.createRadialGradient(x, y, 0, x, y, r);
        grd.addColorStop(0, "rgba(40,44,50,0.75)");
        grd.addColorStop(1, "rgba(40,44,50,0)");
        g.fillStyle = grd;
        g.beginPath();
        g.arc(x, y, r, 0, Math.PI * 2);
        g.fill();
      }
    });
    const brickTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#d9c9b0";
      g.fillRect(0, 0, w, h);
      const bh = 32;
      for (let r = 0; r < h / bh; r++) {
        const off = r % 2 ? 0 : 32;
        for (let c = -1; c < w / 64 + 1; c++) {
          const v = hash(r * 31 + c);
          g.fillStyle = `rgb(${190 + v * 30},${92 + v * 25},${58 + v * 15})`;
          g.fillRect(c * 64 + off + 3, r * bh + 3, 58, bh - 6);
          g.fillStyle = "rgba(60,30,20,0.35)";
          g.fillRect(c * 64 + off + 18, r * bh + 11, 8, 10);
          g.fillRect(c * 64 + off + 38, r * bh + 11, 8, 10);
        }
      }
    }, [4, 3]);
    const tileTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#b5532f";
      g.fillRect(0, 0, w, h);
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const v = hash(r * 9 + c * 3);
          g.fillStyle = `rgb(${190 + v * 30},${88 + v * 20},${50 + v * 12})`;
          g.beginPath();
          g.ellipse(c * 32 + 16, r * 32 + 18, 15, 16, 0, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = "rgba(80,25,10,0.35)";
          g.fillRect(c * 32, r * 32 + 28, 32, 4);
        }
      }
    }, [8, 3]);
    const grassTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#86b85a";
      g.fillRect(0, 0, w, h);
      for (let i = 0; i < 1800; i++) {
        const v = hash(i * 1.7);
        g.fillStyle = v > 0.5 ? "rgba(110,160,70,0.6)" : "rgba(150,195,95,0.55)";
        g.fillRect(hash(i + 0.2) * w, hash(i + 0.5) * h, 2, 4 + v * 5);
      }
    }, [14, 14]);
    const concreteTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#cfcac0";
      g.fillRect(0, 0, w, h);
      g.strokeStyle = "rgba(90,85,75,0.35)";
      g.lineWidth = 3;
      for (let i = 0; i <= 4; i++) {
        g.beginPath();
        g.moveTo(i * 64, 0);
        g.lineTo(i * 64, h);
        g.stroke();
      }
    }, [10, 1]);
    const M = {
      grass: mat("#ffffff", { map: grassTex }),
      concrete: mat("#ffffff", { map: concreteTex }),
      asphalt: mat("#4b5058"),
      curb: mat("#bdb8ae"),
      brick: mat("#ffffff", { map: brickTex }),
      chapisco: mat("#8d8a84"),
      tile: mat("#ffffff", { map: tileTex }),
      ridge: mat("#9c4426"),
      fascia: mat("#f4efe6"),
      paintFinal: mat("#f2e6cf"),
      trim: mat("#2457d6"),
      wood: mat("#8b5a34"),
      woodDark: mat("#6b4226"),
      glass: new THREE.MeshStandardMaterial({ color: "#a9d3ee", roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.75 }),
      frame: mat("#f7f7f5"),
      steel: mat("#8a939f", { roughness: 0.5 }),
      steelDark: mat("#5b6474", { roughness: 0.5 }),
      orange: mat("#f97316"),
      plank: mat("#c8a46a"),
      tarp: mat("#2f6fd6"),
      bag: mat("#d8d2c4"),
      trunk: mat("#7a5232"),
      leaf: mat("#5f9e4a"),
      leaf2: mat("#78b35a"),
      bush: mat("#4f8a3e"),
      dark: mat("#2b2f36"),
      white: mat("#f8f8f6"),
      yellow: mat("#facc15"),
      blue: mat("#2457d6"),
      cloud: new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 1, flatShading: true }),
    };
    const box = (w, h, d, m) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    };
    const cyl = (r, h, m, seg = 12, r2 = r) => {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r2, h, seg), m);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    };
    const sph = (r, m, seg = 16) => {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(6, seg * 0.75)), m);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    };
    const plane = (w, h, mt) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), mt);

    // ---------- Céu (gradiente com cores animáveis), sol e luzes ----------
    const skyUni = { top: { value: new THREE.Color("#5fa8e8") }, bottom: { value: new THREE.Color("#e8f3fb") } };
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(90, 32, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        uniforms: skyUni,
        vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
        fragmentShader: "uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(vP.y*1.4+0.12,0.0,1.0); gl_FragColor = vec4(mix(bottom, top, pow(h,0.8)),1.0); }",
      }),
    );
    scene.add(sky);
    const hemi = new THREE.HemisphereLight("#dbeeff", "#8aa36a", 1.25);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight("#fff1dc", 2.6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 40;
    sun.shadow.bias = -0.0005;
    sun.shadow.radius = 4;
    scene.add(sun, sun.target);
    const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(2.2, 16, 12), new THREE.MeshBasicMaterial({ color: "#fff3c4", fog: false }));
    scene.add(sunDisc);
    const moon = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 12), new THREE.MeshBasicMaterial({ color: "#eef2ff", fog: false }));
    scene.add(moon);
    const clouds = [];
    for (let k = 0; k < 6; k++) {
      const g = new THREE.Group();
      for (let j = 0; j < 4; j++) {
        const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9 + hash(k * 4 + j) * 0.7, 1), M.cloud);
        s.position.set(j * 1.0 - 1.5, hash(k + j * 0.3) * 0.4, hash(k * 2 + j) * 0.6);
        g.add(s);
      }
      g.userData = { x0: -30 + k * 11, y: 14 + hash(k + 9) * 6, z: -28 - hash(k + 3) * 10, sp: 0.35 + hash(k + 5) * 0.25 };
      scene.add(g);
      clouds.push(g);
    }

    // ---------- Chão: grama, calçada, meio-fio e rua ----------
    const grass = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M.grass);
    grass.rotation.x = -Math.PI / 2;
    grass.receiveShadow = true;
    scene.add(grass);
    const walk = box(14, 0.06, 1.3, M.concrete);
    walk.position.set(0, 0.03, 2.85);
    const curb = box(14, 0.12, 0.16, M.curb);
    curb.position.set(0, 0.06, 3.58);
    const street = box(30, 0.02, 6, M.asphalt);
    street.position.set(0, 0.01, 6.6);
    scene.add(walk, curb, street);
    for (let i = 0; i < 4; i++) {
      const p = box(0.55, 0.04, 0.42, M.concrete);
      p.position.set(-0.9, 0.02, 0.55 + i * 0.52);
      scene.add(p);
    }

    // ---------- A casa ----------
    const HW = 5.4;
    const HD = 3.6;
    const WALL_H = 2.8;
    const FZ = 0;
    // Fachada: reboco novo (cor animada de molhado para seco)
    const rebocoMat = new THREE.MeshStandardMaterial({ color: "#6a6e72", map: rebocoTex, roughness: 0.95 });
    const facade = box(HW, WALL_H, 0.22, rebocoMat);
    facade.position.set(0, WALL_H / 2, FZ - 0.11);
    scene.add(facade);
    const wetMat = new THREE.MeshBasicMaterial({ map: wetTex, transparent: true, opacity: 1, depthWrite: false });
    const wetLayer = plane(HW, WALL_H, wetMat);
    wetLayer.position.set(0, WALL_H / 2, FZ + 0.004);
    scene.add(wetLayer);
    // Selador (passado pelo pintor na camada 3) e pintura final (chamada final)
    const seladorMat = new THREE.MeshStandardMaterial({ color: "#f5f3ee", roughness: 0.6, transparent: true, opacity: 0.55, depthWrite: false });
    const seladorLayer = plane(1, WALL_H - 0.12, seladorMat);
    seladorLayer.position.set(0, WALL_H / 2, FZ + 0.008);
    scene.add(seladorLayer);
    const paintLayer = new THREE.Group();
    const paintMain = plane(HW, WALL_H, new THREE.MeshStandardMaterial({ color: "#f2e6cf", roughness: 0.8 }));
    paintMain.position.set(0, WALL_H / 2, 0);
    const paintBar = plane(HW, 0.55, new THREE.MeshStandardMaterial({ color: "#2457d6", roughness: 0.7 }));
    paintBar.position.set(0, 0.275, 0.001);
    paintLayer.add(paintMain, paintBar);
    paintLayer.position.set(0, 0, FZ + 0.012);
    scene.add(paintLayer);
    // Lateral direita: ainda no tijolo, com chapisco na parte de baixo (a próxima etapa da obra)
    const sideR = box(0.22, WALL_H, HD, M.brick);
    sideR.position.set(HW / 2 - 0.11, WALL_H / 2, -HD / 2);
    scene.add(sideR);
    const chap = box(0.01, 1.1, HD - 0.4, M.chapisco);
    chap.position.set(HW / 2 + 0.006, 0.55, -HD / 2 - 0.1);
    scene.add(chap);
    const sideL = box(0.22, WALL_H, HD, M.paintFinal);
    sideL.position.set(-HW / 2 + 0.11, WALL_H / 2, -HD / 2);
    const back = box(HW, WALL_H, 0.22, M.paintFinal);
    back.position.set(0, WALL_H / 2, -HD + 0.11);
    scene.add(sideL, back);
    // Empenas triangulares e telhado de duas águas
    const RISE = 1.25;
    const gable = new THREE.Shape();
    gable.moveTo(-HD / 2, 0);
    gable.lineTo(HD / 2, 0);
    gable.lineTo(0, RISE);
    gable.closePath();
    for (const [x, m] of [[HW / 2 - 0.11, M.brick], [-HW / 2 + 0.11, M.paintFinal]]) {
      const gm = new THREE.Mesh(new THREE.ExtrudeGeometry(gable, { depth: 0.2, bevelEnabled: false }), m);
      gm.rotation.y = Math.PI / 2;
      gm.position.set(x - 0.1, WALL_H, -HD / 2);
      gm.castShadow = true;
      scene.add(gm);
    }
    const slopeLen = Math.hypot(HD / 2, RISE) + 0.55;
    const ang = Math.atan2(RISE, HD / 2);
    for (const s of [1, -1]) {
      const r = box(HW + 0.7, 0.09, slopeLen, M.tile);
      r.rotation.x = s * ang;
      r.position.set(0, WALL_H + RISE / 2 - 0.02, -HD / 2 + s * (HD / 4 + 0.2));
      scene.add(r);
    }
    const ridge = cyl(0.09, HW + 0.75, M.ridge, 8);
    ridge.rotation.z = Math.PI / 2;
    ridge.position.set(0, WALL_H + RISE + 0.02, -HD / 2);
    const fascia = box(HW + 0.7, 0.14, 0.04, M.fascia);
    fascia.position.set(0, WALL_H - 0.12, 0.47);
    scene.add(ridge, fascia);
    // Porta e janela
    const DOOR_X = -0.9;
    const doorFrame = box(1.02, 2.18, 0.06, M.frame);
    doorFrame.position.set(DOOR_X, 1.09, FZ + 0.02);
    const door = box(0.88, 2.08, 0.06, M.wood);
    door.position.set(DOOR_X, 1.04, FZ + 0.045);
    scene.add(doorFrame, door);
    for (let i = 0; i < 3; i++) {
      const panel = box(0.7, 0.5, 0.02, M.woodDark);
      panel.position.set(DOOR_X, 0.45 + i * 0.62, FZ + 0.085);
      scene.add(panel);
    }
    const knob = sph(0.035, M.yellow, 10);
    knob.position.set(DOOR_X + 0.32, 1.02, FZ + 0.1);
    scene.add(knob);
    const WIN_X = 1.25;

    // ---------- Bonequinho melhorado: rosto, cotovelos, joelhos, mãos e roupa ----------

    function makePerson(kind, logoTex) {

        knee.add(sh);
        if (!isP) {
          const cuff = cyl(0.075, 0.08, pants, 12);

        const foot = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.14, 4, 10), shoes);
        foot.rotation.x = Math.PI / 2;
        foot.position.set(0, -0.43, 0.05);
        foot.castShadow = true;
        knee.add(foot);
        thigh.add(knee);
        hips.add(thigh);
        legs.push({ thigh, knee });

      // Bermuda do morador cobre a coxa
      // Tronco

      torso.scale.set(1.18, 1, 0.78);

      if (logoTex && isP) {

          const logo = new THREE.Mesh(new THREE.CircleGeometry(0.088 * s, 24), new THREE.MeshBasicMaterial({ map: logoTex }));

          logo.rotation.y = ry;
          hips.add(patch, logo);

        lp(0.138, 0, 0.6);
        lp(-0.138, Math.PI, 1.0);

      // Pescoço e cabeça com rosto
      const neck = cyl(0.05, 0.1, SKIN, 10);
      neck.position.y = 0.63;
      hips.add(neck);
      const head = new THREE.Group();
      head.position.y = 0.8;
      hips.add(head);
      const skull = sph(0.145, SKIN, 24);
      skull.scale.set(1, 1.08, 0.98);
      head.add(skull);
      const eyeMat = smooth("#1b1b1f", { roughness: 0.3 });
      const eyes = [];
      for (const s of [-1, 1]) {
        const e = sph(0.021, eyeMat, 12);
        e.position.set(s * 0.052, 0.015, 0.128);
        const hl = sph(0.007, new THREE.MeshBasicMaterial({ color: "#ffffff" }), 8);
        hl.position.set(0.006, 0.007, 0.018);
        e.add(hl);
        head.add(e);
        eyes.push(e);
        const brow = box(0.05, 0.012, 0.012, smooth(isP ? "#3b2a1e" : "#5a3a22"));
        brow.position.set(s * 0.053, 0.06, 0.132);
        brow.rotation.z = -s * 0.12;
        head.add(brow);
        const ear = sph(0.03, SKIN, 10);
        ear.scale.set(0.6, 1, 0.8);
        ear.position.set(s * 0.145, 0, 0);

      const nose = sph(0.02, SKIN, 10);

      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.006, 6, 16, Math.PI), smooth("#8a3b2e"));

        const brim = cyl(0.13, 0.015, smooth("#1c46b0"), 16);

      g.userData = { hips, torso, head, eyes, legs, arms };

    // Rolo de pintura (o do morador com tinta; o do pintor com selador)
    function makeRoller(color) {

    function makeBrush() {

    // ---------- IK de dois ossos (ombro e cotovelo) com polo ----------
    const L1 = 0.29;
    const L2 = 0.27;
    const DOWN = new THREE.Vector3(0, -1, 0);
    const IDQ = new THREE.Quaternion();
    const qU = new THREE.Quaternion();
    const qF = new THREE.Quaternion();
    const tmpM = new THREE.Matrix4();
    function reach(who, arm, targetW, k) {
      const { shoulder, elbow, side } = arm;
      if (k <= 0.001) {
        shoulder.quaternion.identity();
        elbow.quaternion.identity();
        return;
      }
      who.updateMatrixWorld(true);
      const hips = who.userData.hips;
      const T = hips.worldToLocal(new THREE.Vector3(...targetW));
      const S = shoulder.position.clone();
      const v = T.clone().sub(S);
      const d = Math.min(L1 + L2 - 0.002, Math.max(0.08, v.length()));
      const dir = v.normalize();
      const pole = new THREE.Vector3(side * 0.7, -1, -0.5).normalize();
      let n = new THREE.Vector3().crossVectors(dir, pole);
      if (n.lengthSq() < 1e-6) n.set(1, 0, 0);
      n.normalize();
      const a = Math.acos(Math.min(1, Math.max(-1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
      const upperDir = dir.clone().applyAxisAngle(n, a);
      qU.setFromUnitVectors(DOWN, upperDir);
      const E = S.clone().addScaledVector(upperDir, L1);
      const Td = S.clone().addScaledVector(dir, d);
      const foreDir = Td.sub(E).normalize().applyQuaternion(qU.clone().invert());
      qF.setFromUnitVectors(DOWN, foreDir);
      shoulder.quaternion.slerpQuaternions(IDQ, qU, k);
      elbow.quaternion.slerpQuaternions(IDQ, qF, k);
    }
    // Pose de caminhada e respiração
    function animateBody(who, t, walk, seed) {
      const u = who.userData;
      const ph = t * 8.5 + seed;
      const sw = Math.sin(ph) * walk;
      u.legs.forEach((l, i) => {
        const s = i === 0 ? sw : -sw;
        l.thigh.rotation.x = 0.5 * s;
        l.knee.rotation.x = walk * 0.75 * Math.max(0, Math.sin(ph + (i === 0 ? 0.9 : 0.9 + Math.PI)));
      });
      u.hips.position.y = 0.92 + 0.025 * Math.abs(Math.sin(ph)) * walk;
      u.torso.scale.y = 1 + 0.012 * Math.sin(t * 2.1 + seed);
      u.head.rotation.z = 0.03 * Math.sin(t * 0.9 + seed);
      // Piscada determinística
      const bl = (t + seed * 0.37) % 3.4 < 0.13 ? 0.12 : 1;
      u.eyes.forEach((e) => (e.scale.y = bl));
      return sw;
    }
    function swingArms(who, sw, bend = 0.25) {
      who.userData.arms.forEach((a, i) => {
        a.shoulder.quaternion.setFromEuler(new THREE.Euler((i === 0 ? -sw : sw) * 0.45, 0, a.side * 0.08));
        a.elbow.quaternion.setFromEuler(new THREE.Euler(-bend - 0.2 * Math.abs(sw), 0, 0));
      });
    }

    // ---------- Montagem (depois de carregar o logo da House) ----------
    function build(logoTex) {
      const morador = makePerson("morador", null);
      const pintor = makePerson("pintor", logoTex);
      scene.add(morador, pintor);
      const rollerM = makeRoller("#f2e6cf");
      morador.userData.arms[1].hand.add(rollerM);
      const rollerP = makeRoller("#f5f3ee");
      pintor.userData.arms[1].hand.add(rollerP);
      const brush = makeBrush();
      pintor.userData.arms[1].hand.add(brush);

      // ---------- Posições ----------
      const P_MH = [0.6, 0, 0.82];
      const P_MS = [-0.35, 0, 2.05];
      const P_MW = [-0.2, 0, 0.66];
      const P_P0 = [2.25, 0, 0.95];
      const P_PW = [0.25, 0, 0.66];
      const P_PS = [2.3, 0, 0.9];
      const P_PC = [0.45, 0, 1.35];
      const MPOS = [
        [0, P_MH], [C.nao + 0.7, P_MH], [C.pronta, P_MS],
        [C.mito - 1.3, P_MS], [C.mito + 0.2, P_MW], [C.norma - 0.4, P_MW], [C.norma + 1.0, P_MS],
        [C.loop + 0.2, P_MS], [C.loop + 1.9, P_MH],
      ];
      const PPOS = [
        [0, P_P0], [C.c2 - 0.9, P_P0], [C.limpar + 0.3, P_PW],
        [C.c3 - 0.2, P_PW], [C.selador, [-0.15, 0, 0.66]], [C.rende + 0.4, [0.5, 0, 0.66]],
        [C.mito - 0.5, [0.5, 0, 0.66]], [C.mito + 0.8, P_PS],
        [C.cta - 0.2, P_PS], [C.cta + 1.2, P_PC],
        [C.loop + 0.2, P_PC], [C.loop + 1.7, P_P0],
      ];
      const mAt = (t) => track3(t, MPOS);
      const pAt = (t) => track3(t, PPOS);
      const yawTo = (p, q) => Math.atan2(q[0] - p[0], q[2] - p[2]);
      const CAMYAW = 0.4;

      // ---------- Câmera ----------
      const DIR = [0.42, 0.14, 1];
      const shot = (q, d, dir = DIR) => {
        const n = Math.hypot(...dir);
        return { q, p: q.map((v, i) => v + (dir[i] / n) * d) };
      };
      const OPEN = shot([1.25, 1.95, 0.6], 6.6);
      const CUTS = (d = 3.6, dy = 0.45) => shot([CUT.x - 0.1, CUT.y + dy, CUT.z], d);
      const K = [
        { t: 0, ...OPEN },
        { t: C.pode, ...shot([1.2, 1.9, 0.6], 6.2) },
        { t: C.pronta + 0.4, ...shot([0.3, 2.7, -0.6], 11.5) },
        { t: C.camadas + 0.6, ...shot([0.3, 2.7, -0.6], 11.0) },
        { t: C.reboco, ...CUTS(3.9) },
        { t: C.agora, ...CUTS(3.6) },
        { t: C.descascando + 0.6, ...CUTS(3.4) },
        { t: C.esperar, ...shot([0.2, 3.4, -0.8], 13.5) },
        { t: C.secar + 0.8, ...shot([0.3, 3.2, -0.6], 12.5) },
        { t: C.c2 + 0.4, ...shot([0.3, 1.65, 0.3], 4.2, [1.0, 0.2, 0.62]) },
        { t: C.esfarela - 0.2, ...shot([0.3, 1.5, 0.3], 3.6, [1.0, 0.2, 0.62]) },
        { t: C.fundo + 0.6, ...shot([0.5, 1.55, 0.5], 4.0, [1.0, 0.2, 0.7]) },
        { t: C.c3 + 0.5, ...shot([0.5, 2.1, 0.5], 5.6) },
        { t: C.selador + 0.6, ...CUTS(3.7, 0.4) },
        { t: C.iguala + 0.4, ...shot([0.3, 2.0, 0.4], 5.2) },
        { t: C.mito + 0.6, ...shot([-0.25, 1.6, 0.35], 3.8, [1.0, 0.2, 0.62]) },
        { t: C.ph - 0.4, ...CUTS(3.6, 0.45) },
        { t: C.solta + 0.4, ...CUTS(3.4, 0.4) },
        { t: C.norma + 0.8, ...shot([0.4, 2.4, -0.2], 8.6) },
        { t: C.cta + 0.8, ...shot([0.2, 3.6, -0.5], 12.8) },
        { t: C.loop, ...shot([0.2, 3.55, -0.5], 12.2) },
        { t: C.loop + 1.7, ...shot([1.23, 1.97, 0.6], 6.8) },
        { t: C.end, ...OPEN },
      ];
      function cameraAt(t) {
        if (t <= K[0].t) return K[0];
        for (let i = 0; i < K.length - 1; i++) {
          const a = K[i];
          const b = K[i + 1];
          if (t <= b.t) {
            const x = easeInOut((t - a.t) / (b.t - a.t));
            return { p: lerp3(a.p, b.p, x), q: lerp3(a.q, b.q, x) };
          }
        }
        return K[K.length - 1];
      }

      // ---------- Callouts presos a pontos 3D ----------
      const svg = document.getElementById("world-lines");
      const SVGNS = "http://www.w3.org/2000/svg";
      const wOf = (obj, x = 0, y = 0, z = 0) => {
        obj.updateMatrixWorld(true);
        return obj.localToWorld(new THREE.Vector3(x, y, z)).toArray();
      };
      const CTA_BOX = { top: 1320, bottom: 1600 };
      const CALLOUTS = [
        { id: "co-umido", a: C.seco + 0.2, b: C.problema, at: () => [0.2, 2.1, FZ + 0.02], dx: 120, dy: -60, top: 700 },
        { id: "co-agua", a: C.agua - 0.1, b: C.agora, at: () => wOf(drops[3]), dx: 120, dy: -80, top: 700 },
        { id: "co-cal", a: C.cal - 0.1, b: C.agora, at: () => wOf(grains[2]), dx: 120, dy: 70, top: 700 },
        { id: "co-bolha", a: C.bolhas - 0.1, b: C.descascando - 0.1, at: () => wOf(blisters[1]), dx: 120, dy: -90, top: 700 },
        { id: "co-mancha", a: C.manchas - 0.1, b: C.c1, at: () => wOf(stains[0]), dx: -100, dy: 60, top: 700 },
        { id: "co-desc", a: C.descascando - 0.1, b: C.c1, at: () => wOf(peel), dx: 110, dy: 130, top: 700 },
        { id: "co-seco", a: C.cura + 0.5, b: C.c2, at: () => [-0.4, 1.9, FZ + 0.02], dx: 110, dy: 120, top: 1000 },
        { id: "co-po", a: C.escova + 0.3, b: C.esfarela - 0.2, at: () => [0.35, 1.2, FZ + 0.03], dx: 130, dy: 120, top: 960 },
        { id: "co-fundo", a: C.fundo, b: C.c3, at: () => wOf(fundoCan, 0, 0.3, 0), dx: 120, dy: -90, top: 960 },
        { id: "co-selador", a: C.selador + 0.3, b: C.mito, at: () => wOf(layers[0], CW / 2, 0.2, 0), dx: 110, dy: -90, top: 960 },
        { id: "co-fora", a: C.seco2 - 0.2, b: C.ph - 0.4, at: () => wOf(morador.userData.arms[0].hand), dx: 120, dy: -90, top: 960 },
        { id: "co-dentro", a: C.ph, b: C.norma, at: () => wOf(cReb, CW / 2, 0.1, 0), dx: 110, dy: 110, top: 960 },
        { id: "co-pintor", ...CTA_BOX, a: C.house - 0.2, b: C.loop, at: () => wOf(pintor.userData.head, 0, 0.2, 0), dx: 110, dy: -60 },
      ];
      for (const c of CALLOUTS) {
        c.el = document.getElementById(c.id);
        c.bw = c.el.offsetWidth;
        c.bh = c.el.offsetHeight;
        c.line = document.createElementNS(SVGNS, "line");
        c.line.setAttribute("stroke", "#0b1220");
        c.line.setAttribute("stroke-width", "3");
        c.dot = document.createElementNS(SVGNS, "circle");
        c.dot.setAttribute("r", "8");
        c.dot.setAttribute("fill", "#2457d6");
        c.dot.setAttribute("stroke", "#ffffff");
        c.dot.setAttribute("stroke-width", "3");
        svg.append(c.line, c.dot);
      }
      const proj = new THREE.Vector3();
      function placeCallouts(t) {
        for (const c of CALLOUTS) {
          const fadeIn = prog(t, c.a, c.a + 0.25);
          const fadeOut = 1 - prog(t, c.b - 0.2, c.b);
          const o = Math.min(fadeIn, fadeOut);
          if (o <= 0.001) {
            c.el.style.opacity = "0";
            c.line.setAttribute("opacity", "0");
            c.dot.setAttribute("opacity", "0");
            continue;
          }
          proj.fromArray(c.at()).project(camera);
          const px = (proj.x * 0.5 + 0.5) * W;
          const py = (-proj.y * 0.5 + 0.5) * H;
          let bx = px + c.dx - (c.dx < 0 ? c.bw : 0);
          let by = py + c.dy - c.bh / 2;
          bx = Math.min(W - 54 - c.bw, Math.max(54, bx));
          by = Math.min((c.bottom ?? 1160) - c.bh, Math.max(c.top ?? 330, by));
          const lift = 14 * (1 - easeOutExpo(fadeIn));
          c.el.style.opacity = String(o);
          c.el.style.transform = `translate(${bx}px, ${by + lift}px)`;
          const lx = bx + (c.dx < 0 ? c.bw : 0);
          const ly = by + c.bh / 2;
          const grow = easeOut(fadeIn);
          c.line.setAttribute("x1", String(px));
          c.line.setAttribute("y1", String(py));
          c.line.setAttribute("x2", String(lerp(px, lx, grow)));
          c.line.setAttribute("y2", String(lerp(py, ly, grow)));
          c.line.setAttribute("opacity", String(o));
          c.dot.setAttribute("cx", String(px));
          c.dot.setAttribute("cy", String(py));
          c.dot.setAttribute("opacity", String(o));
        }
      }

      // ---------- Estados ----------
      // Umidade da fachada: molhada até "esperar", seca no time-lapse, volta molhada no loop
      const WET = [[0, 1], [C.esperar + 0.2, 1], [C.secar + 1.2, 0], [C.loop + 0.3, 0], [C.loop + 1.3, 1]];
      // Pintura final só na chamada final
      const PAINT = [[0, 0], [C.cta + 0.3, 0], [C.cta + 1.8, 1], [C.loop + 0.1, 1], [C.loop + 0.9, 0]];
      // Selador passado pelo pintor (largura da faixa)
      const SEL = [[0, 0], [C.selador, 0], [C.rende + 0.4, 1], [C.loop + 0.1, 1], [C.loop + 0.6, 0]];
      // Lupa visível: problema, secagem, camada 3 e mito
      const CUTK = [[0, 0], [C.reboco - 0.6, 0], [C.reboco, 1], [C.c2 - 0.3, 1], [C.c2 + 0.2, 0], [C.selador - 0.6, 0], [C.selador, 1], [C.iguala + 0.4, 1], [C.iguala + 1.0, 0], [C.ph - 0.9, 0], [C.ph - 0.4, 1], [C.norma, 1], [C.norma + 0.5, 0]];
      // Time-lapse dos 28 dias
      const TL0 = C.esperar + 0.2;
      const TL1 = C.secar + 1.0;
      const DAYS = 5;
      const SUN_DAY = new THREE.Vector3(6, 9, 7).normalize();
      const cDay = { top: new THREE.Color("#5fa8e8"), bot: new THREE.Color("#e8f3fb") };
      const cDusk = { top: new THREE.Color("#3a4f8f"), bot: new THREE.Color("#f6b27a") };
      const cNight = { top: new THREE.Color("#0b1530"), bot: new THREE.Color("#24375e") };

      const tmp = new THREE.Vector3();
      return function render(t) {
        const cam = cameraAt(t);
        camera.position.fromArray(cam.p);
        camera.lookAt(cam.q[0], cam.q[1], cam.q[2]);
        camera.updateMatrixWorld(true);

        // ----- Céu, sol e luz (time-lapse) -----
        let sunDir = SUN_DAY.clone();
        let light = 1;
        let sky = cDay;
        let skyMix = 0;
        if (t > TL0 && t < TL1) {
          const u = prog(t, TL0, TL1);
          const a = u * DAYS * Math.PI * 2;
          // Ângulo do sol: começa de manhã, faz DAYS voltas completas e termina na mesma posição
          const base = Math.atan2(SUN_DAY.y, SUN_DAY.x);
          const ang = base + a;
          sunDir = new THREE.Vector3(Math.cos(ang), Math.sin(ang), 0.55).normalize();
          const h = sunDir.y;
          light = clamp01(h * 2.2 + 0.1);
          // cor do céu pela altura do sol
          if (h > 0.25) skyMix = 0;
          else if (h > -0.05) skyMix = 1 - (h + 0.05) / 0.3;
          else skyMix = 1 + clamp01((-h - 0.05) / 0.25);
          const ease = Math.min(prog(t, TL0, TL0 + 0.4), 1 - prog(t, TL1 - 0.4, TL1));
          skyMix *= ease;
          light = lerp(1, light, ease);
          sunDir.lerp(SUN_DAY, 1 - ease).normalize();
        }
        const top = new THREE.Color();
        const bot = new THREE.Color();
        if (skyMix <= 1) {
          top.copy(cDay.top).lerp(cDusk.top, skyMix);
          bot.copy(cDay.bot).lerp(cDusk.bot, skyMix);
        } else {
          top.copy(cDusk.top).lerp(cNight.top, skyMix - 1);
          bot.copy(cDusk.bot).lerp(cNight.bot, skyMix - 1);
        }
        skyUni.top.value.copy(top);
        skyUni.bottom.value.copy(bot);
        scene.fog.color.copy(bot);
        sun.position.copy(sunDir).multiplyScalar(18).add(new THREE.Vector3(0, 0, 0));
        sun.target.position.set(0, 0, 0);
        sun.intensity = 2.6 * light;
        sun.color.set(skyMix > 0.3 && skyMix < 1.2 ? "#ffc58a" : "#fff1dc");
        hemi.intensity = lerp(1.25, 0.35, clamp01(skyMix - 0.6));
        sunDisc.position.copy(sunDir).multiplyScalar(70);
        sunDisc.visible = sunDir.y > -0.05;
        moon.position.copy(sunDir).multiplyScalar(-70);
        moon.visible = t > TL0 && t < TL1 && -sunDir.y > 0.05;
        clouds.forEach((c) => {
          const sp = t > TL0 && t < TL1 ? 6 : 1;
          const x = ((c.userData.x0 + (t + (t > TL0 ? (Math.min(t, TL1) - TL0) * (sp - 1) : 0)) * c.userData.sp + 40) % 80) - 40;
          c.position.set(x, c.userData.y, c.userData.z);
        });

        // ----- Fachada: umidade, selador e pintura -----
        const wet = track(t, WET);
        rebocoMat.color.set("#cfcabf").lerp(new THREE.Color("#666a6e"), wet);
        wetMat.opacity = 0.85 * Math.pow(wet, 0.7);
        wetLayer.visible = wet > 0.01;
        const sel = track(t, SEL);
        seladorLayer.visible = sel > 0.005;
        const SX0 = -0.42;
        const SX1 = 0.58;
        const sw = Math.max(0.001, (SX1 - SX0) * sel);
        seladorLayer.scale.x = sw;
        seladorLayer.position.x = SX0 + sw / 2;
        const paint = track(t, PAINT);
        paintLayer.visible = paint > 0.005;
        paintLayer.scale.x = Math.max(0.001, paint);
        paintLayer.position.x = -HW / 2 * (1 - paint);

        // ----- Lupa (corte da parede) -----
        const ck = track(t, CUTK);
        cut.visible = ck > 0.01;
        cut.scale.setScalar(Math.max(0.01, spring(ck)));
        spotRing.visible = ck > 0.01;
        spotRing.scale.setScalar(Math.max(0.01, ck));
        beam.visible = ck > 0.05;
        if (beam.visible) {
          cut.updateMatrixWorld(true);
          const c = [[-CW / 2, -CH / 2], [CW / 2, -CH / 2], [CW / 2, CH / 2], [-CW / 2, CH / 2]].map(([x, y]) => cut.localToWorld(new THREE.Vector3(x, y, OUT_Z)));
          const s = SPOT;
          const pos = beam.geometry.attributes.position.array;
          let i = 0;
          for (let k = 0; k < 4; k++) {
            const a = c[k];
            const b = c[(k + 1) % 4];
            for (const p of [s, a, b]) {
              pos[i++] = p.x;
              pos[i++] = p.y;
              pos[i++] = p.z;
            }
          }
          for (let k = i; k < pos.length; k++) pos[k] = s.x;
          beam.geometry.attributes.position.needsUpdate = true;
          beam.geometry.computeBoundingSphere();
          beamMat.opacity = 0.16 * ck;
        }
        // Água: sai empurrando a tinta (problema) e some com a secagem (camada 1)
        const push = prog(t, C.agora, C.bolhas);
        const dryCut = t < C.c2 ? track(t, [[0, 0], [TL0, 0], [TL1, 1]]) : 1;
        drops.forEach((d, k) => {
          const u = d.userData;
          const z = lerp(u.z, OUT_Z - 0.03, push * (0.4 + 0.6 * hash(k + 2)));
          d.position.set(CW / 2 + 0.03, u.y + 0.02 * Math.sin(t * 2 + k), z);
          const sc = (1 - clamp01(dryCut * 1.4 - hash(k + 8) * 0.4));
          d.visible = sc > 0.02 && t < C.c2 + 0.5 && !(t > C.ph - 1 && t < C.norma + 1);
          d.scale.setScalar(Math.max(0.01, sc));
        });
        grains.forEach((g, k) => {
          g.position.set(CW / 2 + 0.02, g.userData.y, g.userData.z);
          g.visible = t < C.c2;
        });
        // Simulação "e se pintar agora" e, no mito, o ataque da alcalinidade
        const simA = t >= C.agora - 0.3 && t < C.c1 + 0.3;
        const simB = t >= C.ph && t < C.norma + 0.4;
        const filmK = simA ? prog(t, C.agora - 0.3, C.agora + 0.3) * (1 - prog(t, C.c1, C.c1 + 0.3)) : simB ? prog(t, C.ph, C.ph + 0.4) * (1 - prog(t, C.norma, C.norma + 0.4)) : 0;
        film.visible = filmK > 0.01;
        film.scale.set(1, 1, Math.max(0.01, filmK));
        const bl = simA ? prog(t, C.bolhas - 0.2, C.bolhas + 0.6) : simB ? prog(t, C.mancha - 0.3, C.mancha + 0.5) * 0.6 : 0;
        blisters.forEach((b, k) => b.scale.setScalar(Math.max(0.01, spring(clamp01(bl * 1.4 - k * 0.1)))));
        const st = simA ? prog(t, C.manchas - 0.2, C.manchas + 0.6) : simB ? prog(t, C.mancha - 0.2, C.mancha + 0.6) : 0;
        stains.forEach((s, k) => {
          s.material.opacity = clamp01(st * 1.5 - k * 0.12);
          s.visible = s.material.opacity > 0.01;
        });
        const pl = simA ? prog(t, C.descascando - 0.2, C.descascando + 0.8) : simB ? prog(t, C.solta - 0.2, C.solta + 0.7) : 0;
        peelPivot.rotation.x = -1.1 * easeOut(pl);
        // Alcalinidade (mito): o reboco brilha violeta
        rebCutMat.emissiveIntensity = simB ? 0.45 + 0.2 * Math.sin(t * 6) : 0;
        rebCutMat.color.set("#cfcabf").lerp(new THREE.Color("#6f7378"), 1 - dryCut);
        // Camadas de acabamento (camada 3)
        let zz = OUT_Z;
        const lt = [C.selador - 0.1, C.selador + 1.2, C.selador + 2.2];
        layers.forEach((l, i) => {
          const k = t >= C.selador - 0.6 && t < C.iguala + 1.2 ? spring(prog(t, lt[i], lt[i] + 0.6)) : 0;
          l.visible = k > 0.01;
          l.position.set(lerp(CW * 1.2, 0, Math.min(1, k)), 0, zz + l.userData.th / 2);
          zz += l.userData.th;
        });

        // ----- Pó da escova e areia que esfarela -----
        const dOn = (t >= C.escova - 0.1 && t < C.esfarela - 0.2) || (t >= C.esfarela - 0.1 && t < C.fundo + 0.4);
        dust.forEach((d, k) => {
          d.visible = dOn;
          if (dOn) {
            const f = (d.userData.off + t * 0.9) % 1;
            const hx = pintor.position.x + 0.1;
            d.position.set(hx + d.userData.dx, 1.45 - f * 1.35, FZ + 0.06 + d.userData.dz);
          }
        });
        const fk = spring(prog(t, C.fundo - 0.1, C.fundo + 0.5));
        fundoCan.visible = fk > 0.01 && t < C.c3 + 0.5;
        fundoCan.scale.setScalar(Math.max(0.01, fk));

        // ----- Morador -----
        const mp = mAt(t);
        const mp2 = mAt(t - 0.05);
        const mMove = Math.hypot(mp[0] - mp2[0], mp[2] - mp2[2]);
        const mWalk = Math.min(1, mMove / 0.03);
        morador.position.fromArray(mp);
        const mTarget = (() => {
          if (t < C.nao + 0.4) return 0 + Math.PI; // de frente para a fachada
          if (t < C.mito - 1.3) return CAMYAW;
          if (t < C.norma) return Math.PI;
          if (t < C.loop + 0.2) return CAMYAW;
          return Math.PI;
        })();
        const mHead = mMove > 0.004 ? Math.atan2(mp[0] - mp2[0], mp[2] - mp2[2]) : mTarget;
        morador.rotation.y = lerp(mTarget, mHead, mWalk * 0.9);
        const msw = animateBody(morador, t, mWalk, 0.3);
        swingArms(morador, msw);
        const [mA, mB] = morador.userData.arms;
        // Rolo na fachada (gancho e fim), mão na parede (mito), joinha (chamada final)
        const rollK = track(t, [[0, 1], [C.nao - 0.1, 1], [C.nao + 0.5, 0], [C.end - 1.1, 0], [C.end - 0.35, 1]]);
        if (rollK > 0.001) reach(morador, mB, [mp[0] + 0.15, 1.42, FZ + 0.42], rollK);
        const touchK = track(t, [[C.mito, 0], [C.mito + 0.5, 1], [C.basta + 0.3, 1], [C.basta + 0.8, 0]]);
        if (touchK > 0.001) reach(morador, mA, [mp[0] - 0.12, 1.3, FZ + 0.06], touchK);
        const thumbK = track(t, [[C.house - 0.2, 0], [C.house + 0.3, 1], [C.whatsapp + 0.6, 1], [C.whatsapp + 1.1, 0]]);
        if (thumbK > 0.001) reach(morador, mA, [mp[0] + 0.2 * Math.sin(morador.rotation.y) - 0.15, 1.55, mp[2] + 0.25 * Math.cos(morador.rotation.y)], thumbK);

        // ----- Pintor da House -----
        const pp = pAt(t);
        const pp2 = pAt(t - 0.05);
        const pMove = Math.hypot(pp[0] - pp2[0], pp[2] - pp2[2]);
        const pWalk = Math.min(1, pMove / 0.03);
        pintor.position.fromArray(pp);
        const pTarget = (() => {
          if (t < C.c2 - 0.9) return yawTo(pp, [mp[0], 0, mp[2]]);
          if (t < C.mito - 0.5) return Math.PI;
          if (t < C.cta - 0.2) return yawTo(pp, [-0.2, 0, 0.6]);
          if (t < C.loop + 0.2) return Math.PI;
          return yawTo(pp, [P_MH[0], 0, P_MH[2]]);
        })();
        const pHead = pMove > 0.004 ? Math.atan2(pp[0] - pp2[0], pp[2] - pp2[2]) : pTarget;
        pintor.rotation.y = lerp(pTarget, pHead, pWalk * 0.9);
        const psw = animateBody(pintor, t, pWalk, 1.7);
        swingArms(pintor, psw);
        const [pA, pB] = pintor.userData.arms;
        // "Pare" com a mão no gancho
        const stopK = track(t, [[C.nao - 0.4, 0], [C.nao, 1], [C.pronta - 0.6, 1], [C.pronta, 0]]);
        if (stopK > 0.001) {
          const f = [Math.sin(pintor.rotation.y), Math.cos(pintor.rotation.y)];
          reach(pintor, pA, [pp[0] + f[0] * 0.42 - f[1] * 0.12, 1.5, pp[2] + f[1] * 0.42 + f[0] * 0.12], stopK);
        }
        // Escova (camada 2) e rolo de selador (camada 3)
        const brushOn = t >= C.c2 && t < C.esfarela - 0.2;
        brush.visible = brushOn;
        const scrubK = track(t, [[C.escova - 0.5, 0], [C.escova - 0.1, 1], [C.esfarela - 0.5, 1], [C.esfarela - 0.2, 0]]);
        if (scrubK > 0.001) reach(pintor, pB, [pp[0] + 0.12 + 0.12 * Math.sin(t * 7), 1.25 + 0.18 * Math.sin(t * 3.1), FZ + 0.28], scrubK);
        const rubK = track(t, [[C.esfarela - 0.3, 0], [C.esfarela + 0.1, 1], [C.fundo, 1], [C.fundo + 0.4, 0]]);
        if (rubK > 0.001) reach(pintor, pA, [pp[0] - 0.05 + 0.06 * Math.sin(t * 9), 1.2, FZ + 0.06], rubK);
        const rollerOn = t >= C.c3 && t < C.mito - 0.3;
        rollerP.visible = rollerOn;
        const paintK = track(t, [[C.selador - 0.4, 0], [C.selador, 1], [C.rende + 0.4, 1], [C.rende + 0.8, 0]]);
        if (paintK > 0.001) reach(pintor, pB, [pp[0] + 0.1, 1.0 + 0.45 * (0.5 + 0.5 * Math.sin(t * 3.2)), FZ + 0.42], paintK);
        rollerM.visible = true;

        renderer.render(scene, camera);
        placeCallouts(t);
      };
    }

    // Relógio: um tween do GSAP alimenta render(t). A linha do tempo só é registrada depois que as fontes e o
    // logo da House carregaram, para a camiseta nunca aparecer sem o logo.
    const logoTex = new THREE.TextureLoader().loadAsync("assets/brand-house/logo-house.jpg");
    Promise.all([document.fonts.ready, logoTex]).then(([, tex]) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      const render = build(tex);
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: C.end, duration: C.end, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["world"] = tl;
    });
  </script>
</template>
