    function show(sel, a, b, opts = {}) {
      const el = $(sel);
      const dy = opts.dy ?? 24;
      tl.set(el, { visibility: "visible" }, 0);
      tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: opts.dur ?? 0.6, ease: ENTER }, a);
      if (b != null) {
        tl.to(el, { opacity: 0, y: -10, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
        tl.set(el, { visibility: "hidden" }, b);
      }
    }
    function section(sel, a, b) {
      const el = $(sel);
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, a);
      tl.fromTo(el.querySelector(".n"), { scale: 0.55, opacity: 0, filter: "blur(14px)", transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, a);

      tl.to(el, { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, b - 0.25);
      tl.set(el, { visibility: "hidden" }, b);

    function count(sel, to, at, dur = 0.8, ease = "power2.out") {
      const p = { v: 0 };
      tl.fromTo(p, { v: 0 }, { v: to, duration: dur, ease, onUpdate: () => ($(sel).textContent = String(Math.round(p.v))) }, at);

      on: { backgroundColor: "#2457d6", borderColor: "#2457d6", color: "#ffffff" },

    const chip = (n, state, at) => tl.to("#hud-chip" + n, { ...CHIP[state], duration: 0.3, ease: "power2.inOut" }, at);

      tl.to("#hud-vig", { opacity: peak, duration: 0.5, ease: "power2.out" }, a);
      tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, b - 0.6);
    }
    // Flash curto quando a lupa da parede aparece (mesmos tempos de world.html)
    const flash = (t) => tl.fromTo("#hud-flash", { opacity: 0.8 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, t);
    [C.reboco - 0.3, C.selador - 0.3, C.ph - 0.6].forEach(flash);

    // Abertura (o primeiro quadro já mostra o título, para o loop emendar)
    tl.set("#hud-hook", { opacity: 1 }, 0);
    tl.set("#hud-vig", { opacity: 0.6 }, 0);
    tl.to("#hud-hook", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, C.ainda - 0.12);
    tl.set("#hud-hook", { visibility: "hidden" }, C.ainda + 0.1);
    tl.fromTo("#hud-ainda", { opacity: 0, scale: 1.25, filter: "blur(12px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, C.ainda);
    tl.to("#hud-ainda", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, C.seco - 0.1);
    tl.set("#hud-ainda", { visibility: "hidden" }, C.seco + 0.1);
    tl.to("#hud-vig", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, C.camadas);
    show("#hud-pronta", C.seco - 0.15, C.camadas - 0.1);

    // Barra 1-2-3
    [1, 2, 3].forEach((n, i) => {
      tl.fromTo("#hud-chip" + n, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER }, C.camadas + i * 0.12);
    });
    chip(1, "on", C.c1);
    chip(1, "done", C.c2);
    chip(2, "on", C.c2);
    chip(2, "done", C.c3);
    chip(3, "on", C.c3);
    chip(3, "done", C.mito);
    tl.to("#hud-chips", { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, C.cta - 0.1);
    tl.fromTo("#hud-chips", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: ENTER, immediateRender: false }, C.loop + 0.1);
    chip(1, "on", C.espera);
    chip(2, "on", C.prepara);
    chip(3, "on", C.sela);

    // Problema
    show("#hud-cagua", C.reboco, C.agora - 0.1);
    show("#hud-csim", C.agora - 0.1, C.c1);
    show("#hud-d1", C.bolhas - 0.15, C.c1);
    show("#hud-d2", C.manchas - 0.1, C.c1);
    show("#hud-d3", C.descascando - 0.1, C.c1);
    vignette(C.bolhas - 0.2, C.c1 + 0.2, 0.7);

    // Camada 1: calendário dos 28 dias acompanha o time-lapse
    section("#hud-s1", C.c1, C.esperar + 0.6);
    show("#hud-cdias", C.esperar + 0.6, C.c2);
    count("#hud-dia", 28, C.esperar + 0.2, C.secar + 1.0 - C.esperar - 0.2, "none");
    tl.fromTo("#hud-mdia", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: C.secar + 1.0 - C.esperar - 0.2, ease: "none" }, C.esperar + 0.2);

    // Camada 2
    section("#hud-s2", C.c2, C.escova - 0.1);
    show("#hud-b1", C.escova - 0.1, C.c3);
    show("#hud-b2", C.esfarela - 0.15, C.c3);

    // Camada 3
    section("#hud-s3", C.c3, C.selador + 0.3);
    show("#hud-e1", C.selador + 0.3, C.mito);
    show("#hud-e2", C.iguala - 0.15, C.mito);
    show("#hud-e3", C.rende - 0.5, C.mito);

    // Mito: seco por fora, pH 13 por dentro
    show("#hud-alert", C.mito, C.norma, { dur: 0.45 });
    tl.fromTo("#hud-nao", { opacity: 0, scale: 1.3, filter: "blur(10px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, C.basta - 0.25);
    tl.to("#hud-nao", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, C.ph - 0.6);
    tl.set("#hud-nao", { visibility: "hidden" }, C.ph - 0.35);
    show("#hud-ph", C.ph - 0.35, C.mancha - 0.15);
    const SCW = $("#hud-scale").offsetWidth;
    tl.fromTo("#hud-pr", { x: 0 }, { x: SCW * 0.429, duration: 0.9, ease: "power3.out" }, C.ph + 0.3);
    tl.fromTo("#hud-prl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.ph + 0.9);
    tl.fromTo("#hud-mil", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: ENTER }, C.alcalino - 1.4);
    show("#hud-cmito", C.mancha - 0.15, C.norma);
    vignette(C.ph, C.norma + 0.2, 0.55);

    // Norma
    show("#hud-norma-head", C.norma + 0.1, C.cta);
    show("#hud-k1", C.pede - 0.3, C.cta);

    // Fecho: a vinheta volta aos poucos para emendar com o primeiro quadro
    tl.set("#hud-end", { opacity: 1, visibility: "visible" }, C.espera - 0.05);
    tl.fromTo("#hud-end1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.espera);
    tl.fromTo("#hud-end2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.prepara);
    tl.fromTo("#hud-end3", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.antes);
    tl.to("#hud-vig", { opacity: 0.6, duration: 1.0, ease: "power1.inOut" }, C.end - 1.2);

    window.__timelines["hud"] = tl;
  </script>
</template>
